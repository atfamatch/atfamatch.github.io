    <ul><li><b>Automático</b> (lo normal): un solo clic. La jugada toma unos segundos <b>antes y después</b> del momento en que apretaste (se configura en el botón o en Ajustes).</li>
      <li><b>Manual</b> (como el botón rojo de grabar): primer toque = <b>empieza a grabar</b> la jugada, segundo toque = <b>la corta</b>. Mientras tanto el botón parpadea y arriba del panel aparece una barra roja <b>● GRABANDO</b> con el tiempo que lleva, un botón <b>■ Terminar</b> y <b>✕</b> para cancelar (o ${K('Esc')}). Sirve para jugadas largas (un ataque entero, una salida desde el fondo) donde 5 s no alcanzan.</li></ul>
    <p>Arriba del panel tenés el selector <b>Marcar: Según botón · ⚡ Auto · ● Manual</b>. “Según botón” respeta lo que configuraste en cada botón (en ✎ Editar panel → Modo de etiquetado); “Auto” y “Manual” cambian <b>todos</b> los botones de golpe, sin tocar su configuración. Las marcas que llegan desde la tablet del banco siempre son automáticas.</p>
    <h4>Cambiar la velocidad mientras grabás (solo con vídeo, no en vivo)</h4>
    <p>En modo <b>Manual</b>, si mientras la jugada está grabando cambiás la velocidad del reproductor (selector de velocidad o ${K('↑')} / ${K('↓')}), la jugada <b>guarda esos cambios</b>: por ejemplo empezás normal, ponés 0,5x justo en el remate y volvés a 1x. Al verla o exportarla se reproduce igual: normal → cámara lenta → normal. En la barra roja ves 🎚 los cambios que va registrando.</p>
    ${TIP('Si mirás todo el partido a 2x para ir rápido y no cambiás la velocidad durante la jugada, no se guarda nada: solo cuentan los <b>cambios</b> hechos mientras graba. Para borrar los tramos: doble clic en la jugada → Velocidad → <b>Quitar</b>.')}
    <h4>Corregir una jugada</h4>
    <ul><li><b>Doble clic</b> en la jugada (en la línea de tiempo o en la pestaña Jugadas) → cambiás nombre, jugadores, notas, inicio y fin.</li>
      <li>En la línea de tiempo podés <b>arrastrar los bordes</b> de la jugada para alargarla o acortarla.</li>
      <li><b>Clic derecho</b> en una jugada → menú: dibujar, pasar a la pizarra, añadir a lista, exportar, borrar.</li>
      <li>${K('Supr')} borra la jugada seleccionada.</li></ul>
    <h4>Anotar los jugadores que participan</h4>
    <ul><li>Al marcar una jugada, un gol o una tarjeta, la ventana muestra <b>Jugadores que participan</b> con foto, número y nombre: tocás los que intervienen.</li>
      <li>Si marcás rápido sin ventana, en la barra de abajo aparece <b>👤 Jugadores</b>: tocalo y elegís los jugadores de esa jugada sin frenar el vídeo.</li></ul>
    <h4>Me equivoqué de botón / quiero verla otra vez</h4>
    <p>Apenas marcás aparece abajo una barra con <b>↶ Deshacer</b> (o ${K('Ctrl')}+${K('Z')}: deshace las últimas marcas, una por una), <b>▶ Ver</b> (o ${K('Enter')}: repite la última jugada marcada) y <b>☆</b> para ponerle estrellas de importancia (→ <a data-help="entretiempo">Vídeo del entretiempo</a>).</p>
    ${TIP('Apretá ' + K('?') + ' en cualquier momento para ver una hoja con todas las teclas de tu panel.')}
    <h4>Cámara lenta o rápida</h4>
    <p>Cada jugada puede ir en cámara lenta o rápida, entera o solo en el momento clave. → guía <a data-help="velocidad">Cámara lenta y rápida</a>.</p>
    <h4>Pestaña “Jugadas”</h4>
    <p>Lista todas las jugadas. Arriba tenés <b>filtros</b> (por tipo, jugador, equipo, período, etiqueta). Clic en una para verla; con <b>＋</b> la mandás a una lista de vídeo, y <b>▶ Reproducir filtrados</b> / <b>＋ A playlist</b> / <b>🎬 Vídeo</b> trabajan con todas las que quedan después de filtrar.</p>
    <h4>Agregar botones sin salir del partido</h4>
    <p>Tocá <b>✎ Editar panel</b> arriba de la botonera, o <b>clic derecho sobre un botón</b> para cambiarle nombre, color o tecla. → guía <a data-help="paneles">Paneles</a>.</p>` },

  paneles: { icon: '🎛️', title: 'Paneles: armar tu botonera', html: `
    <p>Un <b>panel</b> es la botonera que usás para marcar. Podés tener varios (por ejemplo uno simple para el partido del domingo y uno completo para analizar al rival). Vienen dos listos: <b>Fútbol básico</b> (8 botones, ideal para empezar) y <b>Fútbol predeterminado</b> (más completo). <b>Vacío</b> es para armar uno desde cero.</p>
    ${TIP('Para no romper un panel que funciona, usá <b>Duplicar</b> y modificá la copia.')}
    <h4>La barra de herramientas del editor</h4>
    <p>Arriba tenés 5 botones para agregar cada tipo (ver la tabla en <a data-help="etiquetar">Marcar jugadas</a>): <b>＋ Evento</b>, <b>＋ Etiqueta</b>, <b>＋ Puntuación</b>, <b>＋ Amonestación</b>, <b>＋ Temporizador</b>. El botón nuevo aparece en el lienzo; <b>arrastralo</b> donde quieras y <b>arrastrá la esquina</b> para cambiarle el tamaño.</p>
    <h4>Propiedades de un botón (clic sobre él)</h4>
    <ul>
      <li><b>Nombre y color</b>.</li>
      <li><b>Atajo</b> (tecla): una letra o número para marcar sin el mouse. No repitas teclas (si repetís, la app te avisa y se la saca al otro botón).</li>
      <li><b>Modo de etiquetado</b>: <i>Automático</i> (un clic, toma tiempo antes y después) o <i>Manual</i> (clic al inicio y clic al final).</li>
      <li><b>Tiempo de inicio / fin</b>: cuántos segundos antes y después del clic toma la jugada en modo automático. Ej.: 5 y 5 → jugada de 10 segundos.</li>
      <li><b>Subcategorías</b>: grupos de opciones dentro del botón, por ejemplo <i>Resultado: Correcto / Fallo</i> o <i>Zona: Izquierda / Centro / Derecha</i>. Si marcás <b>mostrarlas dentro del botón</b>, aparecen como cuadritos clicables dentro del botón; <b>por fila</b> define cuántos cuadritos entran por renglón.</li>
      <li><b>Preguntar jugadores</b>: al marcar, te pide quién la hizo.</li>
      <li><b>Posición de campo / medio campo / portería</b>: al marcar te muestra el dibujo y hacés clic donde ocurrió. Con eso salen los <b>mapas de calor</b> y el mapa de tiros en Estadísticas.</li>
      <li><b>Equipo</b> (en temporizadores): para posesión local/visitante (al prender uno se apaga el otro).</li>
    </ul>
    <h4>Fondos de cancha</h4>
    <p>En <b>Fondos para etiquetar posiciones</b> (clic sobre la imagen) podés cambiar las imágenes de <i>Campo</i>, <i>Medio campo</i> y <i>Portería</i> que se usan para marcar posiciones (por ejemplo, una foto de tu cancha).</p>
    <h4>Compartir paneles</h4>
    <ul><li><b>Exportar</b> genera un archivo <code>.panel.json</code> que podés mandar a un compañero.</li>
      <li>Él lo carga con <b>Importar…</b> en esta misma pantalla.</li></ul>
    ${WARN('Cada partido guarda <b>su propia copia</b> del panel. Si cambiás un panel acá, los partidos viejos no cambian; para editar el de un partido, hacelo desde adentro del partido (<b>✎ Editar panel</b>).')}` },

  dibujar: { icon: '✎', title: 'Dibujar sobre el vídeo y anotaciones de texto', html: `
    <ol><li>Pausá el vídeo en el momento que querés explicar.</li>
      <li>Tocá <b>✎ Dibujar</b> (o ${K('D')}). Aparece la barra de herramientas.</li>
      <li>Elegí herramienta, color y grosor, y dibujá sobre la imagen.</li>
      <li>Tocá <b>💾 Guardar dibujo</b> (o ${K('Ctrl')}+${K('S')}). El dibujo queda pegado a ese momento del vídeo.</li></ol>
    <p>Cuando se reproduce la jugada (o se exporta el vídeo), <b>el vídeo se frena</b> unos segundos sobre el dibujo y después sigue. Esos segundos se cambian en <a data-help="ajustes">Ajustes</a> (“Duración dibujos (s)”).</p>
    <h4>Herramientas</h4>
    <table class="grid g-table"><tbody>
      <tr><td>➜ ⇢ ↝</td><td>Flecha, flecha discontinua (pase), flecha curva (conducción).</td></tr>
      <tr><td>▭ ◯ ⬠</td><td>Zonas: rectángulo, círculo, zona libre (clic en cada vértice y <b>doble clic</b> para cerrar).</td></tr>
      <tr><td>T</td><td>Texto. Escribí y tocá Guardar (también se guarda si no apretás Enter).</td></tr>
      <tr><td>🔦</td><td>Foco: ilumina un jugador y oscurece el resto.</td></tr>
      <tr><td>🔍</td><td>Lupa: agranda una parte de la imagen.</td></tr>
      <tr><td>⛓</td><td>Vincular jugadores: clic en cada jugador y doble clic para terminar (muestra líneas, por ejemplo una línea defensiva).</td></tr>
      <tr><td>👤</td><td>Etiqueta con nombre/número de jugador.</td></tr>
      <tr><td>📏 ∠</td><td>Distancia y ángulo.</td></tr>
      <tr><td>↖ ⌫</td><td>Seleccionar/mover y borrar. ↶ (${K('Ctrl')}+${K('Z')}) deshace, ↷ rehace, <b>Limpiar</b> borra todo.</td></tr>
    </tbody></table>
    <h4>📝 Solo texto</h4>
    <p>El botón <b>📝 Texto</b> (o la tecla ${K('T')}) agrega una nota escrita en el momento actual sin necesidad de dibujar. Aparece sobre el vídeo y también en el vídeo exportado.</p>` },

  listas: { icon: '🎞️', title: 'Listas de vídeo (playlists)', html: `
    <p>Una <b>lista de vídeo</b> es una selección de jugadas en el orden que vos quieras, para mirar seguidas o exportar en un solo vídeo. Pueden mezclar jugadas de <b>varios partidos</b>.</p>
    <h4>Crear una lista</h4>
    <ol><li>Pestaña <b>Listas de vídeo</b> → <b>+ Nueva</b> y ponele nombre (ej.: “Pérdidas en salida”).</li>
      <li>Agregá jugadas: en la pestaña <b>Jugadas</b> tocá el <b>＋</b> de cada jugada, o filtrá y tocá <b>＋ A playlist</b> para agregar todas las filtradas, o clic derecho sobre una jugada en la línea de tiempo.</li>
      <li>Ordenalas <b>arrastrando</b>.</li></ol>
    <h4>Extras que podés intercalar</h4>
    <ul><li><b>＋ Título</b>: una pantalla con texto (ej.: “Primer tiempo”).</li>
      <li><b>＋ Imagen</b>: una foto o gráfico.</li>
      <li><b>＋ Pizarra</b>: una jugada animada de la pizarra táctica.</li></ul>
    <h4>Ver y exportar</h4>
    <p>▶ reproduce toda la lista. <b>🎬 Exportar</b> genera el vídeo (ver <a data-help="exportar">Exportar vídeo</a>).</p>` },

  exportar: { icon: '🎬', title: 'Exportar vídeo: carpeta, calidad y opciones', html: `
    <p>La app arma un vídeo nuevo con las jugadas elegidas, <b>con los dibujos, textos, títulos y marca de agua</b>. Lo graba <b>en tiempo real</b>: si las jugadas suman 3 minutos, tarda unos 3 minutos.</p>
    ${WARN('Mientras exporta, <b>no minimices</b> la ventana ni cambies de pestaña: el vídeo saldría cortado o congelado.')}
    <h4>¿Qué puedo exportar? (no hace falta armar una lista)</h4>
    <ul><li><b>Solo un tipo de jugada</b> (por ejemplo todos los <i>Ataque</i>): pestaña <b>Jugadas</b> → en el encabezado del grupo tocá <b>🎬 Exportar</b>. También con <b>clic derecho</b> en el nombre de la fila en la línea de tiempo, o clic derecho en cualquier jugada → <b>Exportar todas las «Ataque»</b>. El botón <b>▶</b> del encabezado las muestra seguidas antes de exportar.</li>
      <li><b>Una combinación</b> (por ejemplo los <i>Ataque</i> del equipo local en el 2.º tiempo con 2 estrellas): elegí los filtros arriba de la pestaña Jugadas y tocá <b>🎬 Exportar filtrados</b>. Si hay filtros puestos, el 🎬 Exportar de cada grupo también los respeta.</li>
      <li><b>Una sola jugada</b>: clic derecho sobre ella → <b>Exportar esta jugada</b>.</li>
      <li><b>Un resumen armado a mano</b>, con el orden que quieras y mezclando partidos: ahí sí, usá una <a data-help="listas">lista de vídeo</a>.</li></ul>
    ${TIP('En la ventana de exportar, <b>Archivos → Un archivo por jugada</b> te da cada Ataque en un vídeo aparte (por ejemplo para mandarlos de a uno por WhatsApp).')}
    <h4>Cada opción, explicada</h4>
    <table class="grid g-table"><tbody>
      <tr><td><b>Nombre del archivo</b></td><td>Cómo se va a llamar el vídeo. Si ya existe uno igual en la carpeta, no se pisa: se guarda como “nombre (2)”.</td></tr>
      <tr><td><b>Guardar en</b></td><td>Por defecto va a <b>Descargas</b>. Con <b>Elegir carpeta…</b> elegís otra (por ejemplo una carpeta de Google Drive/OneDrive para que les llegue a tus compañeros). La app la recuerda para la próxima. La ✕ vuelve a Descargas. La primera vez de cada sesión Windows/Edge puede preguntarte si permitís guardar ahí: tocá <b>Permitir</b>.</td></tr>
      <tr><td><b>Formato</b></td><td><b>MP4</b>: se abre en todos lados (celular, WhatsApp, TV, PowerPoint). Usalo siempre que puedas. <b>WebM</b>: alternativa si tu PC no puede grabar MP4.</td></tr>
      <tr><td><b>Resolución</b></td><td>Tamaño de la imagen. <b>720p</b> alcanza para celular y WhatsApp; <b>1080p</b> para proyectar o TV; 1440p/4K solo si el vídeo original también es así de grande (si no, el archivo pesa más pero no se ve mejor).</td></tr>
      <tr><td><b>Calidad</b></td><td>Cuánta información se guarda por segundo. <b>Liviana</b>: archivos chicos para mandar por WhatsApp. <b>Normal</b>: buen equilibrio. <b>Alta / Máxima</b>: más nitidez en jugadas rápidas, archivos más grandes.</td></tr>
      <tr><td><b>Fotogramas</b></td><td>Imágenes por segundo. <b>30</b> va bien siempre; <b>25</b> si tu vídeo es de 25 (TV europea); <b>60</b> solo si el original es de 60 y querés cámara lenta muy fluida.</td></tr>
      <tr><td><b>Tamaño aprox.</b></td><td>Estimación de cuánto va a pesar, según lo elegido arriba.</td></tr>
      <tr><td><b>Archivos</b></td><td><b>Un único vídeo</b> con todo seguido, o <b>un archivo por jugada</b> (útil para mandar cada clip a un jugador distinto).</td></tr>
      <tr><td><b>Título de jugada</b></td><td>Cartel con el nombre de la jugada, etiquetas y jugadores. En <b>Dónde</b> tocás la flecha de la posición (arriba, abajo, a los costados, en las esquinas); en <b>Tamaño y tiempo</b> elegís si es chico, normal o grande y si se ve toda la jugada o solo los primeros segundos (así no tapa la acción). Destildalo para no mostrar ningún cartel.</td></tr>
      <tr><td><b>Dibujos</b></td><td>Incluye los dibujos/anotaciones; el vídeo se frena sobre cada uno.</td></tr>
      <tr><td><b>Notas</b></td><td>Muestra el texto que escribiste en “Notas” de la jugada.</td></tr>
      <tr><td><b>Marca de agua</b></td><td>Texto chico en la esquina (ej.: el nombre del club). Vacío = sin marca.</td></tr>
      <tr><td><b>Audio</b></td><td>Incluye el sonido del partido.</td></tr>
      <tr><td><b>Pantalla dividida</b></td><td>Si la jugada tiene una pizarra vinculada, la muestra animada al lado del vídeo.</td></tr>
      <tr><td><b>Velocidad</b></td><td><b>Normal</b> respeta la velocidad propia de cada jugada (ver <a data-help="velocidad">Cámara lenta y rápida</a>). Las otras opciones ponen todo el vídeo en cámara lenta o rápida.</td></tr>
    </tbody></table>
    <h4>¿Cuánto pesa? (aprox., por cada minuto de vídeo)</h4>
    <table class="grid g-table"><tbody>
      <tr><td></td><td><b>Liviana</b></td><td><b>Normal</b></td><td><b>Alta</b></td></tr>
      <tr><td>720p</td><td>19 MB</td><td>38 MB</td><td>68 MB</td></tr>
      <tr><td>1080p</td><td>30 MB</td><td>60 MB</td><td>108 MB</td></tr>
    </tbody></table>
    ${TIP('Para WhatsApp: <b>MP4 · 720p · Liviana · 30</b>. Para proyectar en la charla técnica: <b>MP4 · 1080p · Alta</b>.')}
    <h4>¿Dónde quedó mi vídeo?</h4>
    <p>Al terminar aparece un aviso que dice <b>en qué carpeta</b> se guardó y con qué nombre. Si no elegiste carpeta, está en <b>Descargas</b>. La carpeta también se puede cambiar en <a data-help="ajustes">Ajustes</a>.</p>` },

  compartir: { icon: '📤', title: 'Compartir: vídeo, informe, Excel y proyecto', html: `
    <p>El botón <b>📤 Compartir</b> (arriba, dentro de un partido) junta todas las formas de sacar información:</p>
    <table class="grid g-table"><tbody>
      <tr><td><b>🎬 Vídeo para los jugadores</b></td><td>Elegís qué jugadas (todas, las de un jugador, las de un tipo) y genera el MP4. → <a data-help="exportar">Exportar vídeo</a>.</td></tr>
      <tr><td><b>📄 Informe en PDF</b></td><td>Resumen del partido con estadísticas y mapas, listo para imprimir o guardar como PDF (en la ventana de impresión elegí <i>Guardar como PDF</i>).</td></tr>
      <tr><td><b>📊 Estadísticas en Excel</b></td><td>Todas las jugadas y estadísticas en una planilla.</td></tr>
      <tr><td><b>📦 Pasarle el partido a un compañero</b></td><td>Archivo <code>.atfamatch.json</code> con el partido completo (jugadas, dibujos, listas) para pasárselo a un compañero. <b>No incluye el vídeo</b>: mandale también el archivo de vídeo, y al abrirlo la app le pedirá buscarlo.</td></tr>
    </tbody></table>
    <h4>“Más formatos”</h4>
    <ul><li><b>Vídeo anotado</b>: el partido completo (o un tramo) con los dibujos.</li>
      <li><b>Vídeo con todas las jugadas</b>: todas las jugadas seguidas (o una por archivo).</li>
      <li><b>CSV</b>: tabla simple para otros programas.</li>
      <li><b>XML (Sportscode/Nacsport)</b>: para intercambiar con esos programas; también podés <b>importar</b> XML o CSV de ellos.</li></ul>
    <h4>Atajos que ahorran tiempo</h4>
    <ul><li><b>⚡ Vídeo del entretiempo</b> → <a data-help="entretiempo">guía</a>.</li>
      <li>Clic derecho en una jugada → <b>📱 Para WhatsApp</b> → <a data-help="whatsapp">guía</a>.</li>
      <li>Clic derecho en una jugada → <b>⚖ Comparar con otra jugada</b> → <a data-help="comparar">guía</a>.</li></ul>
    <h4>Cómo le paso un partido a un compañero</h4>
    <ol><li>📤 Compartir → <b>📦 Pasarle el partido a un compañero</b>. Se descarga el archivo <code>.atfamatch.json</code>.</li>
      <li>Mandale ese archivo <b>y el vídeo</b> (Drive, pendrive, WeTransfer…).</li>
      <li>Él abre ATFAMatch → <b>Partidos → Importar partido…</b> y elige el <code>.json</code>.</li>
      <li>Al abrirlo, la app le pide el vídeo: <b>Buscar archivo…</b> y listo.</li></ol>` },

  estadisticas: { icon: '📊', title: 'Estadísticas y mapas', html: `
    <p>Dentro de un partido tocá <b>📊 Estadísticas</b> (o ${K('S')}).</p>
    <ul><li><b>Conteos</b> por tipo de jugada y por subcategoría (ej.: Recuperaciones: 12 correctas / 3 fallidas), para cada equipo.</li>
      <li><b>Por jugador</b>: cuántas jugadas de cada tipo hizo cada uno.</li>
      <li><b>Temporizadores</b>: tiempo total y porcentaje (ej.: posesión).</li>
      <li><b>Mapas</b>: solo aparecen si al marcar elegiste la posición. Con el selector cambiás entre <i>Campo</i>, <i>Medio campo</i> y <i>Portería</i>.</li></ul>
    <p>Desde ahí exportás a <b>Excel</b>, <b>CSV</b> o <b>Imprimir / PDF</b>.</p>
    ${TIP('Si los mapas salen vacíos, activá “Posición” en los botones del panel (→ <a data-help="paneles">Paneles</a>).')}` },

  equipos: { icon: '👕', title: 'Equipos y jugadores', html: `
    <h4>Plantel y convocatoria (nuevo)</h4>
    <ul><li><b>Equipos y planteles → 👥 Plantel</b>: cargá a <b>todos</b> los jugadores del club una sola vez (24, 30 o los que tengas) con nombre, posición y foto. El número es opcional (“N° habitual”). Con <b>Pegar lista…</b> cargás muchos de una (un nombre por línea).</li>
      <li>En cada partido, en las propiedades del partido, tocá <b>📋 Convocatoria</b>: tildás quiénes juegan, les ponés el <b>número de camiseta de ese partido</b> (puede cambiar de un partido a otro) y marcás los <b>titulares</b>. También podés sumar un jugador nuevo, que queda guardado en el plantel.</li>
      <li>Los <b>nombres salen siempre del plantel</b>: en las jugadas, la edición, las estadísticas y los informes aparece el nombre del jugador. Si corregís un nombre en el plantel, se corrige en todos los partidos.</li>
      <li>En <b>📊 Estadísticas</b> está el gráfico <b>Participación por jugador</b>, con los nombres, filtrable por tipo de jugada y equipo.</li></ul>

    <ol><li><b>Equipos → ＋ Nuevo equipo</b>.</li>
      <li>Poné nombre, escudo y colores.</li>
      <li>Agregá jugadores de a uno (número, nombre, posición, foto) (<b>+ Jugador</b>) o con <b>Pegar lista…</b>: copiá desde Excel/WhatsApp una lista tipo <code>10 Pérez DEL</code> (un jugador por renglón) y se cargan todos juntos.</li></ol>
    <p>Después, al crear un partido, elegís este equipo y la alineación se arma sola.</p>
    <h4>📄 Informes de jugador</h4>
    <p>El botón <b>📄 Informes</b> genera un PDF por jugador con sus números en <b>uno o varios partidos</b>, más un comentario tuyo, y un vídeo con todas sus jugadas.</p>
    <h4>Compartir equipos</h4>
    <p><b>Exportar</b> crea un archivo <code>.equipo.json</code>; tu compañero lo carga con <b>Importar</b>.</p>` },

  pizarra: { icon: '🧩', title: 'Pizarra táctica: ejercicios y jugadas animadas', html: `
    ${TIP('Para guardar la animación como vídeo: dentro de la pizarra tocá <b>🎬 Exportar animación (vídeo)</b> (arriba a la derecha). Graba todos los pasos y la guarda como MP4 en tu carpeta de exportación. <b>📷 PNG</b> guarda solo el paso actual como imagen y <b>🖨 PDF</b> arma la ficha del ejercicio.')}

    <p>Sirve para <b>diseñar ejercicios y jugadas</b>, animarlas y exportarlas a vídeo, imagen o PDF.</p>
    <h4>Empezar</h4>
    <ul><li><b>＋ Nueva pizarra</b>: cancha vacía.</li>
      <li><b>📚 Biblioteca de ejercicios</b>: más de 30 ejercicios y jugadas ya armados y <b>animados paso a paso</b>, para usar tal cual o modificar. Están ordenados por categoría (botones arriba) y tienen buscador: <b>Rondos</b> (3v1, 4v1, 4v2, 5v2 con pivote, 6v3, de transición), <b>Triangulaciones</b> (pared, tercer hombre, triángulo, rombo, desdoblamiento, centro atrás, combinación por dentro), <b>Posesión / juego de posición</b>, <b>Salida de balón</b>, <b>Presión</b>, <b>Transiciones</b>, <b>Finalización</b>, <b>Juegos reducidos</b> y <b>Balón parado</b> (córners, tiros libres, saque de banda y defensa del córner). Al usar uno se crea una copia tuya con la ficha completa; tocá <b>▶ Reproducir</b> para ver la animación y leé la nota de cada paso.</li>
      <li><b>Vista</b>: cancha completa, medio campo, tercios, espacio reducido.</li></ul>
    <h4>Colocar cosas</h4>
    <p>Elegí en la barra izquierda y hacé clic en la cancha: 🔵 jugador local, 🔴 visitante, 🟡 comodín/arquero, ⚽ pelota, conos, platillos, picas, vallas, aros, escaleras, maniquíes, arcos, números de estación. Los jugadores se numeran solos (${K('Ctrl')}+${K('Z')} deshace y recupera el número).</p>
    <p>Flechas: <b>➜ desplazamiento sin pelota</b>, <b>⇢ pase</b>, <b>〰 conducción</b>, <b>↝ trayectoria curva</b> (el jugador la sigue al animar). También zonas, textos y 📏 medir metros.</p>
    <h4>Seleccionar y editar</h4>
    <ul><li>Con <b>↖ Seleccionar</b> arrastrá objetos. Arrastrando en un lugar vacío seleccionás <b>varios</b>.</li>
      <li>${K('Ctrl')}+${K('C')} / ${K('Ctrl')}+${K('V')} copia y pega; ${K('Supr')} borra.</li></ul>
    <h4>Animar: dos maneras</h4>
    <ol><li><b>Por pasos</b>: acomodá todo, tocá <b>+ Paso</b>, mové jugadores/pelota a su nueva posición, otro <b>+ Paso</b>… Al tocar <b>▶ Reproducir</b> se mueven suavemente de un paso al siguiente. Cada paso tiene <b>duración</b> y una <b>nota</b> (ej.: “Pase al lateral”).</li>
      <li><b>Grabando movimientos</b>: tocá <b>● Grabar movimientos</b> y arrastrá jugadores y pelota <b>en tiempo real</b>, como si los movieras con la mano. <b>■ Terminar grabación</b>. Al reproducir se repite exactamente igual. <i>Estela de lo grabado</i> muestra el recorrido.</li></ol>
    <h4>Ficha y sesiones</h4>
    <ul><li>En el panel derecho completás la <b>ficha</b> del ejercicio: objetivo, duración, series, espacio, jugadores, consignas. <b>🖨 Ficha PDF</b> la imprime.</li>
      <li><b>＋ A una sesión</b> arma la sesión del día (calentamiento, parte principal, vuelta a la calma) e imprime todo junto.</li></ul>
    <h4>Exportar</h4>
    <p><b>📷 PNG</b> (imagen del paso actual), <b>🎬 Vídeo</b> (la animación, se guarda en tu carpeta de exportación), <b>🖨 PDF</b>, <b>⇩ Archivo</b> (para pasarla a otro), <b>＋ A playlist</b>.</p>
    <h4>Desde el vídeo a la pizarra</h4>
    <p>Dentro de un partido, <b>clic derecho sobre el vídeo → “Pasar a la pizarra táctica”</b> (o el botón 🧩 A pizarra): crea una pizarra con la imagen de ese momento de fondo para que dibujes encima. Queda <b>vinculada</b> a la jugada y puede salir al lado en el vídeo exportado (pantalla dividida).</p>` },

  entrenamientos: { icon: '🏃', title: 'Entrenamientos: planificación, asistencia y grabaciones', html: `
    <p>En la pestaña <b>🏃 Entrenamientos</b> cada entrenamiento junta todo en un lugar:</p>
    <h4>🧩 Ejercicios (planificación)</h4>
    <ul><li><b>✨ Crear ejercicio nuevo en la pizarra</b>: se abre la pizarra táctica; al tocar <b>← Volver</b> regresás al entrenamiento con el ejercicio ya agregado.</li>
      <li><b>📚 Desde la biblioteca</b>: rondos, posesiones, salidas, presión, pelota parada… listos para usar.</li>
      <li>Cada ejercicio tiene <b>fase</b> (calentamiento, parte principal, vuelta a la calma) y <b>minutos</b>. Con ↑ ↓ cambiás el orden y con <b>✏ Pizarra</b> lo editás.</li>
      <li><b>🖨 PDF</b>: la planilla completa del entrenamiento con cada ejercicio dibujado, para imprimir o mandar.</li></ul>
    <h4>✅ Asistencia</h4>
    <p>Elegí el <b>plantel</b> arriba y tildá quiénes vinieron. Sale también en el PDF, con los ausentes y tus notas.</p>
    <h4>🎬 Grabaciones del entrenamiento: ver el ejercicio y corregir dibujando</h4>
    <ul><li>Desde el entrenamiento → <b>🎬 Analizar un vídeo del entrenamiento</b> (o <b>🔴 Grabar y analizar en vivo</b>). No hace falta armar equipos ni alineaciones.</li>
      <li>En el análisis <b>no hay botonera ni jugadores</b>: a la derecha está la pestaña <b>🧩 Ejercicio</b> con el ejercicio planificado en la pizarra, <b>animado</b>. Si el entrenamiento tiene varios, elegís cuál arriba.</li>
      <li><b>📌 Ver sobre el vídeo</b>: el ejercicio flota encima del vídeo para comparar lo planificado con lo que hacen los jugadores (⤢ lo agranda).</li>
      <li><b>✏ Dibujar la corrección</b>: pausá donde haya algo para corregir y pintá (flechas, zonas, círculos, texto). Cada dibujo queda guardado en ese momento del vídeo, en la fila <b>Dibujos</b> de la línea de tiempo y en la lista <b>Correcciones dibujadas</b> (clic = ir a ese momento).</li>
      <li><b>🎬 Exportar vídeo con las correcciones</b>: arma un vídeo con todas las correcciones dibujadas, para mostrar en la charla.</li>
      <li>Las grabaciones aparecen también en <b>Partidos</b> con la marca 🏃 (filtro “Solo entrenamientos”).</li></ul>` },
  chat: { icon: '💬', title: 'Chat con el banco', html: `
    <p>Mensajes de texto entre la PC del analista y la tablet o celular del banco, por el mismo WiFi local de <a data-help="banco">📡 Banco</a>. No usa internet ni cuesta nada.</p>
    <h4>En la PC</h4>
    <ul><li>Con el Banco encendido aparece el botón <b>💬 Chat</b> abajo del vídeo. Se abre una ventanita en la esquina: escribís y <b>Enter</b>.</li>
      <li>Los botones de abajo (<i>Mirá la última jugada</i>, <i>Ok 👍</i>…) mandan frases rápidas con un clic.</li>
      <li>Cuando llega un mensaje de la tablet suena un “bip”, aparece un aviso y el botón muestra cuántos no leíste.</li>
      <li>Si el mensaje habla de una jugada, trae un botón <b>▶</b> que la reproduce.</li>
      <li>Mientras escribís, las teclas rápidas del panel no marcan nada (no hay riesgo de marcar sin querer).</li></ul>
    <h4>En la tablet</h4>
    <ul><li>Pestaña <b>💬 Chat</b> (con un numerito si hay mensajes sin leer; además la tablet vibra y muestra el mensaje arriba).</li>
      <li>Mirando una jugada, el botón <b>💬</b> manda un mensaje <b>sobre esa jugada</b> (en la PC se puede reproducir con un clic).</li></ul>
    ${TIP('Los mensajes quedan guardados en el partido: después podés releer lo que se habló en cada momento (cada mensaje muestra el minuto).')}` },
  banco: { icon: '📡', title: 'Banco: jugadas en la tablet y marcar desde el celular (WiFi)', html: `
    <p>Mientras analizás (en vivo o con un vídeo grabado), cada jugada que marcás se corta sola en un clip corto y aparece en la <b>tablet o celular del banco</b>, para que el cuerpo técnico la vea en el momento. Y desde esa tablet (o cualquier celular) también se puede <b>marcar jugadas</b> tocando los botones de tu panel.</p>
    <p>Funciona por <b>WiFi local, sin internet</b>: no se sube nada a ningún lado. La tablet no necesita instalar nada: usa el navegador (Chrome o Safari).</p>
    <h4>Qué hace falta</h4>
    <ul><li>Que la PC y la tablet estén en la <b>misma red WiFi</b>. Sirve un router o el <b>hotspot de un celular</b> (aunque no tenga datos: la red funciona igual).</li>
      <li>ATFAMatch instalado con el instalador (el servidor del banco viene incluido).</li></ul>
    <h4>Paso a paso</h4>
    <ol><li>En el partido, tocá <b>📡 Banco</b> (abajo del vídeo). El servidor del banco ya arranca solo cuando abrís ATFAMatch.</li>
      <li><b>Solo la primera vez</b>, Windows pregunta por el <b>Firewall</b> (“Windows PowerShell”): tildá <b>Redes privadas</b> y tocá <b>Permitir acceso</b>. Después no vuelve a preguntar.</li>
      <li>Aparece una <b>dirección</b> (por ejemplo <code>http://192.168.0.10:8090</code>) y un <b>código QR</b>. En la tablet, apuntá la cámara al QR (o escribí la dirección en el navegador).</li>
      <li>Elegí qué se manda (todas las jugadas o solo las marcadas con ⭐) y si la tablet puede marcar. Tocá <b>▶ Empezar a mandar</b>.</li></ol>
    <p class="tiny">Si en la ventana del banco dice “Todavía está apagado” (por ejemplo si abriste ATFAMatch de otra forma), tocá <b>Encender</b> o abrí <b>ATFAMatch - Servidor del banco</b> desde el menú Inicio.</p>
    <h4>En la tablet</h4>
    <ul><li><b>🎬 Jugadas</b>: la lista, la más nueva arriba (con la etiqueta <b>NUEVA</b> hasta que la mirás). Tocá una para verla; tiene ⟲ repetir, <b>0,5x</b> cámara lenta y ◀ ▶ para pasar a la anterior / siguiente. “★ Importantes” muestra solo las que tienen estrella.</li>
      <li><b>🏷 Marcar</b>: los botones de tu panel en grande. Tocá uno (o su subcategoría, por ejemplo <i>Correcto</i>) y la jugada se marca en la PC en ese momento. Arriba podés poner tu nombre (“Marco como…”) para saber quién marcó; esas jugadas aparecen con 📱.</li></ul>
    <h4>Si corregís una jugada</h4>
    <p>Si después de mandada le cambiás el <b>inicio o el fin</b> (arrastrando en la línea de tiempo o en su ventana), el clip se vuelve a cortar solo unos 2 segundos después de que dejás de editar y en la tablet aparece como <b>ACTUALIZADA</b>. Si la estirás o la movés más allá de lo que ya se grabó, primero llega lo que hay y se completa sola cuando la grabación llega a ese punto. Si movés la jugada entera, el minuto que se muestra se mueve con ella. Los cambios de nombre, estrellas, jugadores y etiquetas se ven en la tablet al instante. Si la borrás, desaparece de la tablet.</p>
    <p>En la tablet hay un botón <b>❓</b> arriba a la derecha con la ayuda para quien la usa en el banco.</p>
    <h4>Cuánto tarda</h4>
    <p>En vivo, el clip llega a la tablet <b>1 o 2 segundos después de que termina la jugada</b> (o sea, los segundos “después” del botón + 1 o 2 s): se manda el pedazo ya grabado, sin volver a procesarlo. Mientras tanto, en la tablet aparece como “⏳ en camino”. Con un vídeo ya grabado (después del partido) cada clip tarda lo que dura la jugada, porque se corta reproduciéndolo. En el botón <b>📡 Banco</b> ves cuántos clips hay en cola (⏳) y cuántos se mandaron (✓).</p>
    <h4>Si no conecta</h4>
    <ul><li><b>La tablet no abre la dirección</b>: verificá que estén en la misma red WiFi. Si la PC tiene cable y WiFi, probá las otras direcciones que muestra. Si la red de Windows está como <i>Pública</i>, cambiala a <i>Privada</i> (Configuración → Red e Internet → la red → Perfil: Privada) o permití PowerShell en el firewall para redes públicas.</li>
      <li><b>“No respondió el servidor”</b>: abrí el menú Inicio de Windows → <b>ATFAMatch - Servidor del banco</b>; la ventana del banco lo detecta sola. Para comprobar que anda, abrí <code>http://127.0.0.1:8090</code> en Edge: tiene que aparecer la página del banco. También podés tocar Encender otra vez y aceptar los avisos. Si lo cancelaste, en Edge andá a <i>Configuración → Cookies y permisos del sitio → Abrir vínculos externos</i> y quitá el bloqueo.</li>
      <li>El servidor se apaga solo si ATFAMatch deja de usarlo por 20 minutos, o con <b>Apagar servidor</b>.</li></ul>` },

  entretiempo: { icon: '⚡', title: 'Vídeo del entretiempo en un clic (y estrellas de importancia)', html: `
    <p>Pensado para el vestuario: en 10-15 minutos de descanso no hay tiempo de armar listas. Marcás las jugadas importantes con <b>estrellas</b> mientras mirás, y en el entretiempo sacás el vídeo con un clic.</p>
    <h4>1 · Marcar las importantes con estrellas (de 0 a 3)</h4>
    <ul><li>Apenas marcás una jugada aparece abajo una barra: tocá <b>☆</b> para ponerle 1, 2 o 3 estrellas.</li>
      <li>En la pestaña <b>Jugadas</b>, cada jugada tiene su <b>☆</b>: clic para ir cambiando (☆ → ★ → ★★ → ★★★ → ☆).</li>
      <li>También desde la ventana de la jugada (doble clic → <b>Importancia</b>) o con clic derecho → <b>Importancia</b>.</li>
      <li>En <b>Jugadas</b> podés filtrar por estrellas (“★ o más”, “★★ o más”, “★★★”) y reproducir o exportar solo esas.</li></ul>
    <h4>2 · Exportar el vídeo</h4>
    <ol><li><b>📤 Compartir → ⚡ Vídeo del entretiempo</b>.</li>
      <li>Elegí el <b>período</b> (por defecto el actual) y si querés <b>solo las jugadas con ⭐</b>.</li>
      <li>Te muestra cuántas jugadas son y cuánto dura. Tocá <b>🎬 Exportar ya</b>.</li></ol>
    <p>Usa la última configuración que elegiste al exportar (carpeta, resolución, calidad, cartel, marca de agua), así que no hay que tocar nada más.</p>
    ${TIP('Si la exportación de 5 minutos de jugadas tarda 5 minutos, empezala apenas termina el primer tiempo.')}` },

  whatsapp: { icon: '📱', title: 'Mandar una jugada por WhatsApp', html: `
    <ol><li><b>Clic derecho</b> sobre la jugada (en la línea de tiempo o en la lista) → <b>📱 Para WhatsApp (MP4 liviano)</b>.</li>
      <li>La app la exporta en MP4 720p con calidad liviana (pesa poco) y el cartel con el nombre solo los primeros 3 segundos.</li>
      <li>Al terminar te dice dónde quedó. Si tu PC lo permite aparece <b>📤 Compartir…</b>: abre el menú de Windows para mandarlo directo por WhatsApp (si tenés la app de WhatsApp instalada), mail u otra app.</li>
      <li>Si no aparece ese botón: abrí WhatsApp o WhatsApp Web, tocá 📎 → <i>Fotos y vídeos</i> o <i>Documento</i> y elegí el archivo.</li></ol>
    ${TIP('Como documento llega sin recomprimir (se ve mejor); como “vídeo” WhatsApp lo comprime un poco más.')}` },

  comparar: { icon: '⚖', title: 'Comparar dos jugadas lado a lado', html: `
    <p>Sirve para mostrar <b>“así lo hicimos / así tendría que ser”</b>, comparar a dos jugadores en la misma acción, o el mismo error en dos partidos.</p>
    <ol><li><b>Clic derecho</b> sobre la primera jugada → <b>⚖ Comparar con otra jugada…</b></li>
      <li>Buscá y elegí la segunda (puede ser de <b>otro partido</b>).</li>
      <li>Se abren las dos juntas, una al lado de la otra, y arrancan a la vez desde el inicio de cada jugada. Podés repetir, ponerlas en <b>cámara lenta</b> y activar el sonido.</li>
      <li>Abajo de cada vídeo hay un texto (“Así lo hicimos” / “Así tendría que ser”) que podés cambiar.</li>
      <li><b>🎬 Exportar comparación</b> graba un vídeo con las dos lado a lado, sus nombres y textos, en tu carpeta de exportación.</li></ol>` },

  plantillas: { icon: '💾', title: 'Plantillas de partido (crear partidos en un clic)', html: `
    <p>Si siempre analizás a tu equipo con el mismo panel, el mismo plantel y una alineación parecida, guardalo como <b>plantilla</b> y cada partido nuevo se arma solo.</p>
    <h4>Guardar una plantilla</h4>
    <ol><li>En la pantalla de datos del partido (al crear uno o con ⚙), armá equipos, alineaciones, panel y competición.</li>
      <li>Arriba a la izquierda, en <b>Plantilla</b>, tocá <b>💾 Guardar</b> y ponele un nombre (por ej. “Primera - Liga local”). Si ya existe una con ese nombre, se actualiza.</li></ol>
    <h4>Usarla</h4>
    <ol><li><b>+ Nuevo partido</b> → en <b>Plantilla</b> elegí la que quieras: se cargan los dos equipos con sus jugadores y alineación, el panel, la competición y la temporada.</li>
      <li>Solo te queda elegir el vídeo y cambiar el rival si hace falta.</li></ol>
    <p>Con 🗑 borrás la plantilla elegida. No afecta a los partidos ya creados.</p>` },

  repeticiones: { icon: '✂', title: 'Saltar repeticiones y cortes de cámara (transmisiones de TV)', html: `
    <p>Cuando analizás un partido grabado de la TV o de un streaming, se pierde mucho tiempo en <b>repeticiones</b>, <b>primeros planos</b> de jugadores, el <b>público</b> o el <b>banco</b>. Esta función los detecta y los saltea solos al reproducir, para que veas <b>solo el juego</b>.</p>
    ${WARN('No es inteligencia artificial y no es perfecta: es una detección por colores. Acierta mucho en transmisiones de TV; en vídeos de una sola cámara fija (los del club) casi no hay cortes y no hace falta usarla. Siempre podés corregir a mano lo que detectó.')}
    <h4>Cómo se usa</h4>
    <ol><li>Abrí el partido y tocá <b>✂ Repeticiones</b> (abajo del vídeo, al lado de “🧩 A pizarra”).</li>
      <li>Elegí la <b>sensibilidad</b> (empezá con <i>Media</i>) y tocá <b>🔍 Analizar ahora</b>.</li>
      <li>La app recorre el vídeo a 16x: un partido de 90 minutos tarda unos <b>6 a 10 minutos</b>. Dejá la ventana visible; podés cancelar cuando quieras.</li>
      <li>Al terminar ves cuánto tiempo hay de cada tipo y cuánto se va a saltar. Con las casillas <b>saltar</b> elegís qué tipos se saltean.</li>
      <li>Dejá marcado <b>Saltar automáticamente al reproducir el partido</b>. Cuando el vídeo llega a un tramo marcado, salta al final y aparece un aviso “⏭ Repetición saltada”.</li></ol>
    <h4>Qué detecta</h4>
    <table class="grid g-table"><tbody>
      <tr><td><b style="color:#2f9e5a">Juego</b></td><td>Imagen con mucho césped: la cámara general mostrando la jugada. Por defecto <b>no</b> se salta.</td></tr>
      <tr><td><b style="color:#f59e0b">Primer plano / público</b></td><td>Imagen con poco césped: cara de un jugador, la tribuna, el DT, el banco. Por defecto se salta.</td></tr>
      <tr><td><b style="color:#e5484d">Repetición</b></td><td>En TV las repeticiones empiezan y terminan con una “cortina” (el logo del canal o del torneo que pasa rápido). La app busca dos cortinas separadas entre 5 y 60 segundos y marca lo de adentro como repetición. Por defecto se salta.</td></tr>
    </tbody></table>
    <h4>Corregir a mano</h4>
    <p>En la línea de tiempo aparece la fila <b>✂ Planos</b> con los tramos de colores. Los que se saltan se ven <b>rayados</b>. <b>Hacé clic sobre un tramo</b> para cambiarlo: si estaba para saltar, deja de saltarse, y al revés.</p>
    <h4>Para tener en cuenta</h4>
    <ul><li>Solo actúa al reproducir el partido normalmente: cuando reproducís una jugada marcada o una lista, no se salta nada.</li>
      <li>Las jugadas que marcás no cambian: si marcaste algo durante una repetición, sigue estando.</li>
      <li>Si detecta demasiados cortes, bajá la sensibilidad; si se le escapan, subila. Tocá <b>Analizar de nuevo</b>.</li>
      <li>En el <b>análisis en vivo</b> se usa después de tocar <b>■ Finalizar</b>, cuando el partido ya quedó grabado.</li></ul>` },

  velocidad: { icon: '🐢', title: 'Cámara lenta y cámara rápida en una jugada', html: `
    <p>Cada jugada puede tener su <b>propia velocidad</b>: más lenta para ver bien un detalle (un perfil, un control, una marca) o más rápida para mostrar un recorrido largo sin aburrir. Se usa al reproducirla en la app <b>y</b> al exportarla a vídeo.</p>
    <h4>Paso a paso</h4>
    <ol><li><b>Doble clic</b> sobre la jugada (en la línea de tiempo o en la pestaña <b>Jugadas</b>).</li>
      <li>En la sección <b>Velocidad (cámara lenta o rápida)</b> elegí: Súper lenta 0,25x, Cámara lenta 0,5x, Algo lenta 0,75x, Normal, Rápida 1,5x, Muy rápida 2x o Súper rápida 3x.</li>
      <li>Elegí <b>dónde</b> se aplica:
        <ul><li><b>En toda la jugada</b>: toda la jugada va a esa velocidad.</li>
          <li><b>Solo en el momento clave</b>: la jugada va normal y se pone lenta (o rápida) solo unos segundos alrededor del momento importante. Por defecto es el instante en que apretaste el botón, ±2 segundos. Podés cambiar los segundos, o ir con el vídeo al momento exacto y tocar <b>Usar el momento actual del vídeo</b>.</li></ul></li>
      <li><b>Guardar</b>. Reproducí la jugada para verla con esa velocidad.</li></ol>
    ${TIP('El efecto típico de la TV es: jugada normal → cámara lenta en el remate o en el error → vuelve a normal. Se logra con <b>Cámara lenta 0,5x</b> + <b>Solo en el momento clave</b>.')}
    <h4>Al exportar</h4>
    <ul><li>En <b>Exportar vídeo → Velocidad</b>, con <b>Normal</b> se respeta la velocidad propia de cada jugada.</li>

/* ============ Cortes de cámara y repeticiones (detección local, sin IA ni internet) ============
   Se recorre el vídeo a alta velocidad tomando una miniatura cada ~0,4 s.
   - Corte de cámara: cambio brusco del histograma de color entre dos miniaturas seguidas.
   - Plano de juego: hay mucho césped (verde) en la imagen. Primer plano / público / banco: poco verde.
   - Repetición: en TV suelen empezar y terminar con una cortina gráfica (logo), que se ve como
     2 o más cortes muy seguidos. Lo que queda entre dos cortinas (5-60 s) se marca como repetición. */
const SHOT_KIND = { play: { name: 'Juego', color: '#2f9e5a' }, close: { name: 'Primer plano / público', color: '#f59e0b' }, replay: { name: 'Repetición', color: '#e5484d' } };
const SHOT_SENS = { low: { label: 'Baja (solo cortes muy claros)', thr: 0.55 }, med: { label: 'Media (recomendada)', thr: 0.42 }, high: { label: 'Alta (detecta más cortes)', thr: 0.3 } };

function frameFeatures(ctx, w, h) {
  const d = ctx.getImageData(0, 0, w, h).data; const hist = new Float32Array(64); let green = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2]; hist[(r >> 6) * 16 + (g >> 6) * 4 + (b >> 6)]++; n++;
    if (g > 45 && g > r * 1.08 && g > b * 1.05) green++;
  }
  for (let i = 0; i < 64; i++) hist[i] /= n;
  return { hist, green: green / n };
}
const histDiff = (a, b) => { let s = 0; for (let i = 0; i < 64; i++) s += Math.abs(a[i] - b[i]); return s / 2; };

async function scanVideoFrames(url, onProgress, isCancelled) {
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  await once(v, 'loadedmetadata', 15000); const dur = v.duration;
  if (!isFinite(dur) || dur <= 0) throw new Error('no se pudo leer la duración del vídeo');
  const W = 64, H = 36; const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d', { willReadFrequently: true });
  const samples = []; let last = -1;
  const sample = () => { const t = v.currentTime; if (t - last < 0.38) return; last = t; try { ctx.drawImage(v, 0, 0, W, H); const f = frameFeatures(ctx, W, H); samples.push({ t, ...f }); } catch (e) { } onProgress(t / dur); };
  // primer cuadro
  v.currentTime = 0; await once(v, 'seeked', 8000).catch(() => { }); sample();
  for (const r of [16, 8, 4]) { try { v.playbackRate = r; break; } catch (e) { } }
  await v.play();
  await new Promise(res => {
    let stallT = performance.now(), lastT = 0;
    const finish = () => { clearInterval(iv); res(); };
    const onFrame = () => { if (isCancelled() || v.ended) return finish(); sample(); if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(onFrame); };
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(onFrame);
    const iv = setInterval(() => {
      if (isCancelled() || v.ended || v.currentTime >= dur - 0.05) return finish();
      if (!v.requestVideoFrameCallback) sample();
      if (v.currentTime !== lastT) { lastT = v.currentTime; stallT = performance.now(); }
      else if (performance.now() - stallT > 8000) { v.play().catch(() => { }); if (performance.now() - stallT > 20000) finish(); }
    }, 60);
  });
  v.pause(); v.removeAttribute('src'); v.load();
  return { samples, dur };
}

function classifyShots(samples, dur, sens = 'med') {
  const thr = (SHOT_SENS[sens] || SHOT_SENS.med).thr;
  const cuts = [];
  for (let i = 1; i < samples.length; i++) if (histDiff(samples[i].hist, samples[i - 1].hist) > thr) cuts.push(samples[i].t);
  // cortinas (varios cortes en menos de 1,3 s)
  const wipes = []; for (let i = 0; i < cuts.length; i++) { let j = i; while (j + 1 < cuts.length && cuts[j + 1] - cuts[j] < 1.3) j++; if (j > i) { wipes.push({ s: cuts[i], e: cuts[j] }); i = j; } }
  // segmentos entre cortes (los cortes de una cortina cuentan como uno)
  const bounds = [0, ...cuts.filter(c => !wipes.some(w => c > w.s && c <= w.e)), dur];
  let segs = [];
  for (let i = 0; i < bounds.length - 1; i++) {
    const s = bounds[i], e = bounds[i + 1]; if (e - s < 0.05) continue;
    const inSeg = samples.filter(x => x.t >= s && x.t < e); const g = inSeg.length ? inSeg.reduce((a, x) => a + x.green, 0) / inSeg.length : 0.5;
    segs.push({ s, e, g, k: g >= 0.28 ? 'play' : 'close' });
  }
  // unir segmentos muy cortos con el anterior
  segs = segs.reduce((acc, x) => { const p = acc[acc.length - 1]; if (p && x.e - x.s < 1 && p.k === x.k) { p.e = x.e; } else acc.push(x); return acc; }, []);
  // repeticiones: entre dos cortinas separadas 5-60 s
  for (let i = 0; i + 1 < wipes.length; i++) {
    const a = wipes[i], b = wipes[i + 1]; const gap = b.s - a.e;
    if (gap >= 5 && gap <= 60) { segs.forEach(x => { if (x.s >= a.s - 0.5 && x.e <= b.e + 0.5) x.k = 'replay'; }); i++; }
  }
  // unir consecutivos del mismo tipo
  const out = []; for (const x of segs) { const p = out[out.length - 1]; if (p && p.k === x.k) p.e = x.e; else out.push({ s: +x.s.toFixed(2), e: +x.e.toFixed(2), k: x.k }); }
  return { segs: out, cuts: cuts.length, wipes: wipes.length };
}

function shotSkipAt(p, t) {
  const S = p && p.shots; if (!S || !S.on) return null;
  return S.segs.find(x => t >= x.s && t < x.e - 0.1 && (x.skip != null ? x.skip : (S.skip || {})[x.k])) || null;
}
function shotSummary(S) {
  const tot = k => S.segs.filter(x => x.k === k).reduce((a, x) => a + x.e - x.s, 0);
  const skipT = S.segs.filter(x => x.skip != null ? x.skip : (S.skip || {})[x.k]).reduce((a, x) => a + x.e - x.s, 0);
  return { play: tot('play'), close: tot('close'), replay: tot('replay'), skipT, n: S.segs.length };
}
const mmss = s => { s = Math.round(s); return Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s'; };

async function shotsDialog() {
  const p = ST.p; if (!p || !isFileMode()) return toast('Esta función necesita el vídeo del partido (grabado o ya finalizado el vivo)', 'warn');

  const sumHTML = () => { if (!p.shots) return ''; const s = shotSummary(p.shots); return `<div class="sect"><div class="sect-t">Resultado del análisis</div>
      <table class="grid g-table"><tbody>${Object.entries(SHOT_KIND).map(([k, v]) => `<tr><td><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${v.color};vertical-align:middle"></span> ${v.name}</td><td>${mmss(s[k])}</td><td><label class="chk"><input type="checkbox" data-skipk="${k}" ${(p.shots.skip || {})[k] ? 'checked' : ''}> saltar</label></td></tr>`).join('')}</tbody></table>
      <p class="tiny">${s.n} planos detectados · se saltan <b>${mmss(s.skipT)}</b>. En la línea de tiempo aparece la fila <b>✂ Planos</b>: hacé clic sobre un tramo para cambiar si se salta o no (los tramos que se saltan se ven rayados).</p>
      <label class="chk"><input type="checkbox" id="shOn" ${p.shots.on ? 'checked' : ''}> <b>Saltar automáticamente al reproducir el partido</b></label></div>`; };
  const draw = () => {
    body.innerHTML = `<p>Detecta <b>cortes de cámara</b>, <b>primeros planos / público</b> y <b>repeticiones</b> de una transmisión de TV o streaming para que puedas saltarlos y ver solo el juego. Funciona en tu PC, sin internet ni IA: compara los colores de cada imagen con la anterior y mide cuánto césped se ve.</p>
      ${sumHTML()}
      <div class="sect"><div class="sect-t">${p.shots ? 'Volver a analizar' : 'Analizar el vídeo'}</div><div class="form"><label>Sensibilidad</label><select id="shSens">${Object.entries(SHOT_SENS).map(([k, v]) => `<option value="${k}" ${k === ((p.shots && p.shots.sens) || 'med') ? 'selected' : ''}>${v.label}</option>`).join('')}</select></div>
      <p class="tiny">El análisis recorre el vídeo a 16x: un partido de 90 minutos tarda unos 6 a 10 minutos. Dejá la ventana visible mientras tanto. Funciona mejor con transmisiones de TV; en vídeos de una sola cámara fija casi no hay cortes.</p>
      <div class="row"><button class="primary" id="shGo">🔍 ${p.shots ? 'Analizar de nuevo' : 'Analizar ahora'}</button>${p.shots ? '<button class="danger" id="shDel">Borrar análisis</button>' : ''}</div></div>`;
    $$('[data-skipk]', body).forEach(c => c.onchange = () => { p.shots.skip[c.dataset.skipk] = c.checked; p.shots.segs.forEach(x => { if (x.k === c.dataset.skipk) delete x.skip; }); markDirty(); draw(); });
    const on = $('#shOn', body); if (on) on.onchange = () => { p.shots.on = on.checked; markDirty(); refreshShotsBtn(); };
    const del = $('#shDel', body); if (del) del.onclick = () => { delete p.shots; markDirty(); resizeTimeline(); refreshShotsBtn(); draw(); };
    $('#shGo', body).onclick = () => runShotAnalysis($('#shSens', body).value).then(ok => { if (ok) { draw(); resizeTimeline(); } });
  };
  draw();
  await modal({ title: '✂ Saltar repeticiones y cortes de cámara', help: 'repeticiones', body, buttons: [{ label: 'Listo', cls: 'primary' }] });
}
async function runShotAnalysis(sens) {
  const p = ST.p; const cam = p.cameras[ST.mainCam || 0] || p.cameras[0]; const url = await urlForCam(p, ST.mainCam || 0); if (!url) return false;
  let cancelled = false; const prog = document.createElement('div');
  prog.innerHTML = `<p id="sh-t">Analizando el vídeo…</p><div class="progress"><div id="sh-b"></div></div><p class="tiny">No minimices la ventana. Podés cancelar cuando quieras.</p>`;
  modal({ title: 'Analizando cortes de cámara…', body: prog, sticky: true, noHelp: true, buttons: [{ label: 'Cancelar', cls: 'danger', onClick: () => { cancelled = true; return true; } }] });
  const t0 = performance.now();
  try {
    pause();
    const { samples, dur } = await scanVideoFrames(url, f => { const el = $('#sh-b', prog); if (!el) return; el.style.width = Math.round(f * 100) + '%'; const elapsed = (performance.now() - t0) / 1000; const rest = f > 0.02 ? elapsed / f - elapsed : 0; $('#sh-t', prog).textContent = `Analizando… ${Math.round(f * 100)}%${rest ? ' · faltan ~' + mmss(rest) : ''}`; }, () => cancelled);
    const m = prog.closest('.modal'); if (m) m.close(true);
    if (cancelled) { toast('Análisis cancelado', 'warn'); return false; }
    const r = classifyShots(samples, dur, sens);
    p.shots = { cam: cam && cam.id, at: Date.now(), sens, segs: r.segs, on: true, skip: { play: false, close: true, replay: true }, cuts: r.cuts, wipes: r.wipes };
    markDirty(); refreshShotsBtn();
    const s = shotSummary(p.shots);
    toast(`✔ ${r.cuts} cortes de cámara · ${r.wipes ? r.wipes + ' cortinas de repetición · ' : ''}se saltarán ${mmss(s.skipT)}`);
    return true;
  } catch (e) { const m = prog.closest('.modal'); if (m) m.close(true); toast('No se pudo analizar: ' + e.message, 'bad'); return false; }
}
function refreshShotsBtn() { const b = $('#btnShots'); if (!b || !ST.p) return; const on = ST.p.shots && ST.p.shots.on; b.classList.toggle('on', !!on); b.title = on ? 'Saltando repeticiones y primeros planos (clic para opciones)' : 'Detectar y saltar repeticiones y cortes de cámara'; }
/** Llamado en cada cuadro: salta los tramos marcados mientras se reproduce normalmente */
function shotsTick(t) {
  if (!ST.p || !ST.p.shots || !ST.p.shots.on || !isPlaying() || ST.hold || ST.playingEv) return;
  const seg = shotSkipAt(ST.p, t); if (!seg) return;
  if (ST.lastShotSkip && ST.lastShotSkip === seg && performance.now() - ST.lastShotSkipAt < 1500) return;
  ST.lastShotSkip = seg; ST.lastShotSkipAt = performance.now();
  seek(Math.min(getDuration(), seg.e + 0.05)); toast(`⏭ ${SHOT_KIND[seg.k].name} saltada (${Math.round(seg.e - seg.s)} s)`);
}
function drawShotsRow(ctx, y, W) {
  const S = ST.p.shots; if (!S) return;
  for (const x of S.segs) {
    const x1 = tToX(x.s), x2 = tToX(x.e); if (x2 < TL.label || x1 > W) continue;
    const sk = x.skip != null ? x.skip : (S.skip || {})[x.k];
    ctx.fillStyle = SHOT_KIND[x.k].color; ctx.globalAlpha = x.k === 'play' ? 0.35 : 0.85; ctx.fillRect(x1, y + 4, Math.max(1, x2 - x1 - 1), TL.rowH - 8); ctx.globalAlpha = 1;
    if (sk) { ctx.save(); ctx.beginPath(); ctx.rect(x1, y + 4, Math.max(1, x2 - x1 - 1), TL.rowH - 8); ctx.clip(); ctx.strokeStyle = '#00000088'; ctx.lineWidth = 2; for (let k = x1 - 20; k < x2; k += 7) { ctx.beginPath(); ctx.moveTo(k, y + TL.rowH); ctx.lineTo(k + 14, y); ctx.stroke(); } ctx.restore(); }
  }
}
function shotsRowClick(t) {

const bancoPost = (path, body, type = 'application/json') => fetch(BANCO.base + path, { method: 'POST', body, headers: { 'Content-Type': type }, cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r; });
function bancoUrls() { const ips = (BANCO.ips || []).filter(x => !/^169\.254\./.test(x.ip)); ips.sort((a, b) => (b.wifi - a.wifi) || (/^192\.168\./.test(b.ip) - /^192\.168\./.test(a.ip))); return ips.map(x => ({ url: `http://${x.ip}:${BANCO.port}`, name: x.name, wifi: x.wifi })); }

  const clips = [...BANCO.sent.values()].filter(c => c.file && p.events.some(e => e.id === c.id)).map(c => { const e = p.events.find(x => x.id === c.id); return { id: e.id, file: c.file, v: c.v || c.at, upd: !!c.upd, from: c.from != null ? c.from : null, to: c.to != null ? c.to : null, name: e.name, color: e.color || '#2fb36d', t: fmt(evKeyT(e), false), sec: evKeyT(e), stars: e.stars || 0, team: e.team ? p[e.team].name : '', tags: e.tags.map(x => x.value), players: e.players.map(id => playerLabel(playerById(id))).filter(Boolean), created: c.at }; }).sort((a, b) => b.created - a.created);
  const panel = p.dashboard.buttons.filter(b => ['event', 'score', 'card', 'tag', 'timer'].includes(b.type)).map(b => ({ id: b.id, name: b.name, color: b.color, type: b.type, cells: b.showTags !== false && b.groups && b.groups[0] ? { group: b.groups[0].name, tags: b.groups[0].tags } : null, active: b.type === 'tag' ? ST.activeTags.has(b.id) : b.type === 'timer' ? timerRunning(b.id) : false }));

  const last = [...p.events].sort((a, b) => (b.created || 0) - (a.created || 0)).slice(0, 8).map(e => ({ name: e.name, color: e.color, t: fmt(e.eventTime ?? e.start, false), remote: !!e.remote }));

}
function bancoMarkState() { BANCO.stateDirty = true; }
const evSig = ev => `${(+ev.start).toFixed(2)}|${(+ev.stop).toFixed(2)}`;
async function bancoTick() {
  if (!BANCO.on || !ST.p) return;
  try {
    // 3 · marcas que llegan desde el celular/tablet
    const r = await fetch(`${BANCO.base}/api/inbox?since=${BANCO.seq}`, { cache: 'no-store' }); const j = await r.json(); BANCO.fails = 0;
    if (j.seq < BANCO.seq) BANCO.seq = 0; // el servidor se reinició
    for (const it of j.items || []) { BANCO.seq = Math.max(BANCO.seq, it.seq); if (BANCO.opts.tagging) await bancoApplyTag(it); }
    BANCO.seq = Math.max(BANCO.seq, j.seq || 0);
  } catch (e) { if (++BANCO.fails === 5) toast('Se perdió la conexión con el banco (¿se cerró el servidor?)', 'bad'); bancoBadge(); return; }
  // jugadas ya enviadas a las que les cambiaron el inicio o el fin → se vuelve a cortar el clip (cuando se dejó de editar 2 s)
  for (const ev of ST.p.events) {
    const c = BANCO.sent.get(ev.id); if (!c || !c.file || c.sig == null || BANCO.q.includes(ev)) continue;
    const sig = evSig(ev); if (sig === c.sig) { c.chg = null; continue; }
    if (!c.chg || c.chg.sig !== sig) { c.chg = { sig, at: Date.now() }; continue; }
    if (ST.p.mode === 'live' && clockNow() < ev.start + 1) continue; // todavía no se grabó el inicio: se espera
    if (Date.now() - c.chg.at > 2000) { c.chg = null; BANCO.q.push(ev); }
  }
  // clips que se mandaron incompletos (la jugada terminaba más adelante de lo grabado) → se completan al llegar
  if (ST.p.mode === 'live') for (const ev of ST.p.events) { const c = BANCO.sent.get(ev.id); if (c && c.partial && !BANCO.q.includes(ev) && clockNow() >= ev.stop + 0.3) { c.partial = false; BANCO.q.push(ev); } }
  // 5 · jugadas nuevas → clip para el banco
  for (const ev of ST.p.events) {
    if (ev.kind === 'timer' || BANCO.sent.has(ev.id) || BANCO.q.includes(ev)) continue;
    if (BANCO.opts.only === 'stars' && !(ev.stars > 0)) continue;
    const ready = ST.p.mode === 'live' ? (liveHasRec() && clockNow() >= ev.stop + 0.3) : isFileMode();
    if (ready) BANCO.q.push(ev);
  }
  if (!BANCO.busy && BANCO.q.length) bancoWork();
  if (BANCO.stateDirty || Date.now() - (BANCO.lastState || 0) > 3000) { BANCO.stateDirty = false; BANCO.lastState = Date.now(); bancoPost('/api/state', JSON.stringify(bancoState()), 'application/json; charset=utf-8').catch(() => { }); }
  bancoBadge();
}
function placeNewButton(p, b) {
  const bs = p.dashboard.buttons; const W = 104, H = 58, G = 8;
  const cols = Math.max(1, Math.floor((Math.max(...bs.map(x => x.x + x.w), 4 * (W + G))) / (W + G)));
  for (let r = 0; r < 60; r++) for (let c = 0; c < cols; c++) {
    const x = 8 + c * (W + G), y = 8 + r * (H + G);
    if (!bs.some(o => x < o.x + o.w && x + W > o.x && y < o.y + o.h && y + H > o.y)) { b.x = x; b.y = y; b.w = W; b.h = H; return b; }
  }
  return b;
}
async function bancoApplyTag(it) {
  let d; try { d = typeof it.data === 'string' ? JSON.parse(it.data) : it.data; } catch (e) { return; }
  const who = String(d.who || 'la tablet').slice(0, 30);
  // botón nuevo creado desde la tablet
  if (d.action === 'newbtn') {
    const name = String(d.name || '').trim().slice(0, 40); if (!name) return;
    if (ST.p.dashboard.buttons.some(b => b.name.toLowerCase() === name.toLowerCase())) { toast(`📱 "${name}" ya existe en el panel`, 'warn'); return; }
    const type = d.type === 'tag' ? 'tag' : 'event';
    const b = placeNewButton(ST.p, mkBtn(type, name, /^#[0-9a-f]{6}$/i.test(d.color || '') ? d.color : '#3b82f6', 0, 0));
    ST.p.dashboard.buttons.push(b); markDirty(); renderDashboardView(); renderSide(); if (typeof resizeTimeline === 'function') resizeTimeline();
    toast(`📱 ${who} creó ${type === 'tag' ? 'la etiqueta' : 'el botón'} "${name}"`); bancoMarkState(); return;
  }
  if (d.action === 'chat') { chatFromTablet(d, who); return; }
  // etiqueta libre agregada a una jugada desde la tablet
  if (d.action === 'addtag') {
    const ev = ST.p.events.find(e => e.id === d.ev); const value = String(d.value || '').trim().slice(0, 40); if (!ev || !value) return;
    if (!ev.tags.some(t => t.value.toLowerCase() === value.toLowerCase())) { ev.tags.push({ group: '', value }); markDirty(); renderSide(); }
    toast(`📱 ${who} etiquetó "${ev.name}" (${fmt(evKeyT(ev), false)}) con "${value}"`); bancoMarkState(); return;
  }
  const b = ST.p.dashboard.buttons.find(x => x.id === d.btn); if (!b) return;
  const n0 = ST.p.events.length; ST.remoteTag = true;
  try { await pressButton(b, new Set(), d.sub ? { group: d.group || '', value: d.sub } : null); } finally { ST.remoteTag = false; }
  const ev = ST.p.events.length > n0 ? ST.p.events[ST.p.events.length - 1] : null;
  if (ev) { ev.remote = d.who || 'tablet'; markDirty(); }
  toast(`📱 ${b.name}${d.sub ? ' · ' + d.sub : ''} (desde ${d.who || 'la tablet'})`);
  bancoMarkState();
}
async function bancoWork() {
  BANCO.busy = true; bancoBadge();
  try {
    while (BANCO.on && BANCO.q.length) {
      const ev = BANCO.q.shift(); if (!ST.p.events.includes(ev)) continue;
      let url = null, tmp = false, fast = null;
      if (ST.p.mode === 'live') {
        const future = ev.stop > clockNow() + 1; // la jugada termina más adelante de lo grabado: se manda lo que hay y se completa después
        for (let k = 0; k < 12; k++) { fast = liveFastClip(ev, future); if (fast !== 'wait') break; try { ST.live.recorder.requestData(); } catch (e) { } await sleep(350); }
        if (fast === 'wait') { if (BANCO.sent.has(ev.id) || ev.stop > clockNow()) { const c0 = BANCO.sent.get(ev.id); if (c0) c0.chg = null; continue; } fast = null; }
        if (!fast) { const blob = await liveFreshBlob(); if (!blob) break; url = URL.createObjectURL(blob); tmp = true; }
      } else { const cam = ST.p.cameras[0]; url = VIDEO_URLS[cam.id]; if (!url) break; }
      try {
        const { blob, ext, from, to, partial } = fast || await makeClipBlob(ev, url);
        const file = `${ev.id.replace(/[^A-Za-z0-9_-]/g, '')}.${ext}`;
        await bancoPost(`/api/clip?file=${encodeURIComponent(file)}`, blob, blob.type || 'application/octet-stream');
        const prev = BANCO.sent.get(ev.id); BANCO.sent.set(ev.id, { id: ev.id, file, at: prev && prev.file ? prev.at : Date.now(), v: Date.now(), upd: !!(prev && prev.file), from, to, partial: !!partial, sig: evSig(ev) }); BANCO.stateDirty = true;
      } catch (e) { console.warn('clip', e); BANCO.sent.set(ev.id, { id: ev.id, file: null, at: Date.now(), err: e.message }); }
      finally { if (tmp) URL.revokeObjectURL(url); }
      bancoBadge();
    }
  } finally { BANCO.busy = false; bancoBadge(); }
}
function bancoBadge() {
  if (typeof chatBadge === 'function') chatBadge();
  const b = $('#btnBanco'); if (!b) return;
  b.classList.toggle('on', BANCO.on);
  b.innerHTML = BANCO.on ? `📡 Banco <span class="tiny">${BANCO.busy || BANCO.q.length ? '⏳ ' + (BANCO.q.length + (BANCO.busy ? 1 : 0)) : '✓'} ${[...BANCO.sent.values()].filter(x => x.file).length}</span>` : '📡 Banco';
}
async function bancoEnable(opts) {
  Object.assign(BANCO.opts, opts);
  const j = await bancoEnsureLan(); if (!j) return false;
  BANCO.ips = j.ips || []; BANCO.port = j.port || 8090;
  if (!BANCO.on) {
    if (opts.fresh) { await bancoPost('/api/reset', '{}').catch(() => { }); BANCO.sent.clear(); BANCO.seq = 0; }
    if (!opts.backlog) for (const ev of ST.p.events) if (!BANCO.sent.has(ev.id)) BANCO.sent.set(ev.id, { id: ev.id, file: null, at: 0, skipped: true });
    try { const r = await fetch(`${BANCO.base}/api/inbox?since=0`, { cache: 'no-store' }); const jj = await r.json(); BANCO.seq = jj.seq || 0; } catch (e) { }
    BANCO.on = true; BANCO.pid = ST.p.id; clearInterval(BANCO.iv); BANCO.iv = setInterval(bancoTick, 1000);

}
function bancoDisable(stopServer = false) {
  BANCO.on = false; clearInterval(BANCO.iv); BANCO.q = []; bancoBadge();

/* ---------------- 💬 Chat con el banco (texto por WiFi local, en las dos direcciones) ----------------
   Tablet → PC: POST /api/tag {action:'chat'} (bandeja que la app ya lee cada 1 s)
   PC → tablet: los mensajes viajan dentro del estado que la tablet consulta cada 2 s.
   Los mensajes quedan guardados en el partido (p.chat). */
const CHAT = { open: false, unread: 0, lastN: -1 };
const CHAT_QUICK = ['👀 Mirá la última jugada', 'Ok 👍', '¿Cuánto falta?', 'Ya te la mando', '🔁 Hacé el cambio', '⚠ Atentos a la pelota parada'];
function chatList(p = ST.p) { if (!p.chat) p.chat = []; return p.chat; }
function chatPush(m) {
  const L = chatList(); if (m.cid && L.some(x => x.cid === m.cid)) return null;
  L.push(m); if (L.length > 400) L.splice(0, L.length - 400); markDirty(); bancoMarkState(); return m;
}
function chatFromTablet(d, who) {
  const text = String(d.text || '').trim().slice(0, 500); if (!text) return;
  const ev = d.ev ? ST.p.events.find(e => e.id === d.ev) : null;
  const m = chatPush({ id: uid(), cid: String(d.cid || '').slice(0, 40) || null, from: 'tablet', who, text, at: Date.now(), min: fmt(getTime(), false), ev: ev ? ev.id : null });
  if (!m) return;
  if (!CHAT.open) { CHAT.unread++; toast(`💬 ${who}: ${text.length > 80 ? text.slice(0, 80) + '…' : text}`); }
  chatBeep(); chatRender(); chatBadge();
}
function chatSend(text, ev = null) {
  text = String(text || '').trim().slice(0, 500); if (!text) return;
  if (!BANCO.on) { toast('Encendé 📡 Banco para chatear con la tablet', 'warn'); return; }
  chatPush({ id: uid(), from: 'pc', who: SETTINGS.chatName || 'Analista', text, at: Date.now(), min: fmt(getTime(), false), ev: ev ? ev.id : null });
  BANCO.stateDirty = true; chatRender();
}
function chatForState(p) {
  return (p.chat || []).slice(-60).map(m => { const e = m.ev ? p.events.find(x => x.id === m.ev) : null; return { id: m.id, cid: m.cid || null, from: m.from, who: m.who, text: m.text, at: m.at, min: m.min, ev: e ? { id: e.id, name: e.name, t: fmt(evKeyT(e), false) } : null }; });
}
function chatBeep() {
  try { const a = CHAT.ac || (CHAT.ac = new AudioContext()); const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(0.15, a.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.25); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.3); } catch (e) { }
}
function chatBadge() {
  const b = $('#btnChat'); if (!b) return;
  b.style.display = BANCO.on || (ST.p && (ST.p.chat || []).length) ? '' : 'none';
  b.innerHTML = '💬 Chat' + (CHAT.unread ? ` <span class="chat-n">${CHAT.unread}</span>` : '');
}
function chatToggle(force) {
  CHAT.open = force != null ? force : !CHAT.open;
  let box = $('#chatBox');
  if (!CHAT.open) { if (box) box.remove(); return; }
  CHAT.unread = 0; chatBadge();
  if (!box) {
    box = document.createElement('div'); box.id = 'chatBox';
    box.innerHTML = `<div class="ch-h"><b>💬 Chat con el banco</b><span class="tiny grow" id="chSt"></span><button class="help-q small" data-help="chat">❓</button><button class="small" id="chX" title="Cerrar">✕</button></div>
      <div class="ch-list" id="chList"></div>
      <div class="ch-quick">${CHAT_QUICK.map(q => `<button class="small" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <div class="ch-in"><input type="text" id="chIn" maxlength="500" placeholder="Escribí un mensaje y Enter…"><button class="primary small" id="chGo">Enviar</button></div>`;
    document.body.appendChild(box);
    $('#chX', box).onclick = () => chatToggle(false);
    const inp = $('#chIn', box);
    const go = () => { chatSend(inp.value); inp.value = ''; inp.focus(); };
    $('#chGo', box).onclick = go;
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') go(); if (e.key === 'Escape') chatToggle(false); };
    box.onclick = e => {
      const q = e.target.closest('[data-q]'); if (q) { chatSend(q.dataset.q); return; }
      const j = e.target.closest('[data-chev]'); if (j) { const ev = ST.p.events.find(x => x.id === j.dataset.chev); if (ev) playEvent(ev); }
    };
    CHAT.lastN = -1; setTimeout(() => inp.focus(), 30);
  }
  chatRender();
}
function chatRender() {
  const list = $('#chList'); if (!list || !ST.p) return;
  const L = chatList(); const st = $('#chSt'); if (st) st.textContent = BANCO.on ? '· WiFi ✓' : '· Banco apagado';
  if (CHAT.lastN === L.length) return; CHAT.lastN = L.length;
  const hm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  list.innerHTML = L.length ? L.map(m => { const e = m.ev ? ST.p.events.find(x => x.id === m.ev) : null;

function addBlock(s, b) { s.blocks.push({ id: uid(), boardId: b.id, phase: s.blocks.length ? 'Parte principal' : 'Calentamiento', minutes: parseInt(b.sheet && b.sheet.duration) || 15, notes: '' }); }
/** Cierra la ventana del entrenamiento y sigue con otra pantalla */

/** Datos iniciales de una grabación de entrenamiento (desde la ventana del entrenamiento) */
function trainingDraft(D) {

/* ---------- Análisis de una grabación de entrenamiento: solo el ejercicio de la pizarra + dibujar correcciones ----------
   Sin panel de etiquetas ni jugadores: a la derecha aparece el ejercicio planificado (animado) y se corrige
   dibujando sobre el vídeo (✏ Dibujar). Cada dibujo queda en la línea de tiempo como "Dibujos". */
const isTraining = (p = ST.p) => !!(p && p.kind === 'training');
async function trainingSetupAnalysis(p) {
  const tabs = $$('.side-tabs button'); const tr = isTraining(p);
  tabs.forEach(b => { if (b.dataset.st === 'panel' || b.dataset.st === 'players') b.style.display = tr ? 'none' : ''; if (b.dataset.st === 'exercise') b.style.display = tr ? '' : 'none'; });
  const sb = $('#scoreboard'), ps = $('#periodSel'); if (sb) sb.style.display = tr ? 'none' : ''; if (ps && ps.parentElement) ps.parentElement.style.display = tr ? 'none' : '';
  const ex = $('#exBox'); if (ex) ex.remove();
  if (tr) { if (!APP.boards) await loadBoards(); if (!APP.sessions) await loadSessions(); TR.exSel = 0; switchSide('exercise'); }
  else if ($('.side-tabs button.active') && $('.side-tabs button.active').dataset.st === 'exercise') switchSide('panel');
}
function trainingBoards(p = ST.p) {
  const s = (APP.sessions || []).find(x => x.id === p.sessionId);
  return { s, list: s ? s.blocks.map(x => ({ x, b: (APP.boards || []).find(y => y.id === x.boardId) })).filter(o => o.b) : [] };
}
/** Animación en bucle de una pizarra dentro de un canvas (se corta sola cuando el canvas deja de estar en pantalla) */
function loopBoard(cv, b) {
  const { W, H } = boardSize(b); cv.width = W; cv.height = H; const ctx = cv.getContext('2d'); const tot = Math.max(0.5, boardDuration(b) + 1.2); const t0 = performance.now();
  const step = () => { if (!cv.isConnected) return; if (cv._paused) { requestAnimationFrame(step); return; } const sec = ((performance.now() - t0) / 1000) % tot; const { fi, t } = boardFrameAt(b, Math.min(sec, tot - 1.2)); drawBoardFrame(ctx, b, fi, t, W, H, true, true); requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function renderExerciseTab() {
  const el = $('#st-exercise'); if (!el || !ST.p) return; const p = ST.p; const { s, list } = trainingBoards(p);
  const draws = p.events.filter(e => e.kind === 'draw').sort((a, b) => a.start - b.start);
  const cur = list[TR.exSel || 0];
  el.innerHTML = `${s ? `<div class="tiny" style="margin-bottom:6px">🏃 <b>${esc(s.name)}</b>${s.objectives ? ' · 🎯 ' + esc(s.objectives) : ''}</div>` : '<p class="muted">Esta grabación no está unida a un entrenamiento.</p>'}
    ${list.length ? `<select id="exSel" style="width:100%;margin-bottom:6px">${list.map((o, i) => `<option value="${i}" ${i === (TR.exSel || 0) ? 'selected' : ''}>${i + 1}. ${esc(o.b.name)} · ${esc(o.x.phase)} · ${o.x.minutes} min</option>`).join('')}</select>
      <canvas id="exCv" style="width:100%;border-radius:8px;background:#1f6f3a;cursor:pointer" title="Clic: pausar / seguir"></canvas>
      <div class="row" style="margin-top:6px;flex-wrap:wrap"><button class="small" id="exFloat">📌 Ver sobre el vídeo</button><button class="small primary" id="exDraw">✏ Dibujar la corrección</button><button class="small" id="exOpen">🧩 Abrir en la pizarra</button></div>
      ${cur && cur.b.notes ? `<p class="tiny" style="margin-top:6px">${esc(cur.b.notes).slice(0, 400)}</p>` : ''}`
      : s ? '<p class="muted">El entrenamiento no tiene ejercicios de la pizarra. Agregalos desde la pestaña 🏃 Entrenamientos.</p>' : ''}
    <div class="sect" style="margin-top:10px"><div class="sect-t">Correcciones dibujadas (${draws.length})</div>
      ${draws.length ? draws.map(e => `<div class="evitem" data-dr="${e.id}" style="cursor:pointer"><span class="tm">${fmt(e.eventTime ?? e.start)}</span><span class="nm">✏ ${esc(e.name)}</span></div>`).join('') : '<p class="tiny">Pausá el vídeo donde haya algo para corregir y tocá <b>✏ Dibujar la corrección</b>: flechas, zonas, círculos, texto… Queda guardado en ese momento del vídeo.</p>'}
      ${draws.length ? '<div class="row" style="margin-top:6px"><button class="small" id="exExp">🎬 Exportar vídeo con las correcciones</button></div>' : ''}</div>`;
  const sel = $('#exSel', el); if (sel) sel.onchange = () => { TR.exSel = +sel.value; renderExerciseTab(); const fb = $('#exBox'); if (fb) exFloat(true); };
  const cv = $('#exCv', el); if (cv && cur) { loopBoard(cv, cur.b); cv.onclick = () => cv._paused = !cv._paused; }
  const f = $('#exFloat', el); if (f) f.onclick = () => exFloat();
  const d = $('#exDraw', el); if (d) d.onclick = () => { pause(); enterDrawMode(); };
  const o = $('#exOpen', el); if (o) o.onclick = () => { pause(); openBoard(cur.b, 'analysis'); };
  $$('[data-dr]', el).forEach(n => n.onclick = () => { const e = p.events.find(x => x.id === n.dataset.dr); if (e) { cancelEvPlay(); seek(e.eventTime ?? e.start); pause(); } });
  const x = $('#exExp', el); if (x) x.onclick = () => renderDialog(draws.map(e => ({ type: 'event', projectId: p.id, eventId: e.id })), p.name + ' - correcciones');
}
/** El ejercicio flotando sobre el vídeo, para compararlo con lo que hacen los jugadores */
function exFloat(refresh = false) {
  const { list } = trainingBoards(); const cur = list[TR.exSel || 0]; let box = $('#exBox');
  if (box && !refresh) { box.remove(); return; } if (!cur) return;
  if (!box) { box = document.createElement('div'); box.id = 'exBox'; $('#videoArea').appendChild(box); }
  box.innerHTML = `<div class="exh"><b class="grow">🧩 ${esc(cur.b.name)}</b><button class="small" data-exs title="Tamaño">⤢</button><button class="small" data-exx>✕</button></div><canvas></canvas>`;
  loopBoard($('canvas', box), cur.b);
  $('[data-exx]', box).onclick = () => box.remove();
  $('[data-exs]', box).onclick = () => box.classList.toggle('big');

    hl = el; el.classList.add('tour-hl'); const r = el.getBoundingClientRect();

function fixWebmDuration(el) {
  if (el.duration !== Infinity) return;
  const h = () => { if (el.duration !== Infinity) { el.removeEventListener('durationchange', h); el.currentTime = 0; fitTimeline(); } };
  el.addEventListener('durationchange', h); el.currentTime = 1e9;
}
document.addEventListener('loadedmetadata', e => { if (e.target.tagName === 'VIDEO') fixWebmDuration(e.target); }, true);

function hideSplash() { const s = $('#splash'); if (!s || s.classList.contains('out')) return; s.classList.add('out'); setTimeout(() => s.remove(), 800); }
(async function init() {
  const t0 = performance.now(); const sp = $('#splash'); if (sp) sp.onclick = hideSplash;
  await DB.open(); await loadSettings(); await loadAll();
  if (SETTINGS.watermark === 'OpenMatch') { SETTINGS.watermark = 'ATFAMatch'; saveSettings(); }
  document.body.classList.toggle('simple', !SETTINGS.advanced); $('#advToggle').checked = !!SETTINGS.advanced;
  if (WEB) document.body.classList.add("web");
  if (WEB && !window.showDirectoryPicker) document.body.classList.add("nodir");
  if (WEB && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  if (WEB && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
  bindUI(); initGuides(); showHomeTab('projects'); loadExportDir().then(() => { if ($('#setExpDir') && EXPORT_DIR) $('#setExpDir').innerHTML = exportDirLabel(); }); initBackup();
  if (!SETTINGS.onboarded && !APP.projects.length) setTimeout(welcomeDialog, Math.max(0, 2900 - (performance.now() - t0)));
  setTimeout(hideSplash, Math.max(0, 2600 - (performance.now() - t0)));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
})();

</script>
