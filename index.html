<title>ATFAMatch · Videoanálisis</title>
<style>
:root{
  --bg:#0f1318; --bg2:#161c23; --bg3:#1e2630; --bg4:#273240; --line:#2e3a48;
  --tx:#e6edf3; --tx2:#9fb0c0; --tx3:#6b7c8d;
  --acc:#2fb36d; --acc2:#24985b; --warn:#e5a50a; --bad:#e5484d; --blue:#3b82f6;
  --r:8px; font-size:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--bg4)}
button.primary{background:var(--acc);border-color:var(--acc2);color:#fff;font-weight:600}
button.primary:hover{background:var(--acc2)}
button.danger{background:#3a1c1f;border-color:#5c2a2e;color:#ffb4b6}
button.danger:hover{background:#5c2a2e}
button.ghost{background:transparent;border-color:transparent}
button.small{padding:3px 7px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
label.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
hr{border:none;border-top:1px solid var(--line);margin:6px 0}
h2{margin:0 0 12px;font-size:20px} h3{margin:14px 0 8px;font-size:15px;color:var(--tx2)}
.muted{color:var(--tx2)} .tiny{font-size:12px;color:var(--tx3)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.screen{display:none;height:100vh;flex-direction:column}
.screen.active{display:flex}
.overlay-screen{position:fixed;inset:0;background:var(--bg);z-index:50}

/* ---- top nav ---- */
.topnav{display:flex;align-items:center;gap:20px;padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px}
.brand small{font-weight:400;color:var(--tx3);font-size:12px}
.logo{color:var(--acc)}
.topnav nav{display:flex;gap:4px;flex-wrap:wrap}
.topnav nav button{background:transparent;border-color:transparent}
.topnav nav button.active{background:var(--bg4);border-color:var(--line)}
.home-main{flex:1;overflow:auto;padding:20px}
.tab{display:none;max-width:1200px;margin:0 auto}
.tab.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.card .ttl{font-weight:700;font-size:15px}
.card .vs{display:flex;align-items:center;gap:8px;font-size:13px}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.empty{padding:40px;text-align:center;color:var(--tx2);border:1px dashed var(--line);border-radius:var(--r)}
table.grid{border-collapse:collapse;width:100%}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:13px}
table.grid th{color:var(--tx2);font-weight:600;background:var(--bg2);position:sticky;top:0}
table.grid td.num,table.grid th.num{text-align:right}

/* ---- análisis ---- */
.an-top{display:flex;align-items:center;gap:12px;padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.an-title{font-weight:700;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scoreboard{display:flex;align-items:center;gap:8px;background:#000;border-radius:6px;padding:4px 10px;font-weight:700}
.scoreboard .sc{font-size:18px;min-width:22px;text-align:center}
.period{display:flex;gap:6px;align-items:center;color:var(--tx2);font-size:13px}
.an-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.menu-wrap{position:relative}
.menu{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:6px;z-index:40;min-width:270px;box-shadow:0 10px 30px #0008}
.menu.open{display:flex;flex-direction:column;gap:2px}
.menu button{text-align:left;background:transparent;border-color:transparent}
.menu button:hover{background:var(--bg4)}
.an-body{flex:1;display:flex;min-height:0}
.an-left{flex:1;display:flex;flex-direction:column;min-width:0}
.video-area{flex:1;display:flex;flex-direction:column;min-height:0;background:#000;position:relative}
.video-main{flex:1;position:relative;overflow:hidden;min-height:120px}
.zoomwrap{position:absolute;inset:0;transform-origin:0 0}
.zoomwrap video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.video-area.grid .video-main{display:none}
.video-area.grid .video-thumbs{flex:1;display:grid;grid-template-columns:1fr 1fr;height:auto}
.video-area.grid .video-thumbs .thumb{height:auto}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#overlay.drawing{pointer-events:auto;cursor:crosshair}
.video-thumbs{display:flex;gap:2px;height:110px;background:#000}
.video-thumbs:empty{display:none}
.thumb{position:relative;flex:1;min-width:0;cursor:pointer;border:2px solid transparent}
.thumb.active{border-color:var(--acc)}
.thumb video{width:100%;height:100%;object-fit:contain;background:#000}
.thumb span{position:absolute;left:4px;top:3px;font-size:11px;background:#000a;padding:1px 5px;border-radius:4px}
.no-video{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--tx2);text-align:center;padding:20px}
.title-card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;font-size:34px;font-weight:800;text-align:center;padding:20px;z-index:5}
.title-card.show{display:flex}
.live-badge{position:absolute;left:10px;top:10px;z-index:6;font-weight:700}
.live-badge:empty{display:none}
.live-badge{background:#000b;padding:4px 10px;border-radius:6px}
.live-badge .rec{color:#ff4d4f}
.controls{display:flex;align-items:center;gap:5px;padding:6px 8px;background:var(--bg2);border-top:1px solid var(--line);flex-wrap:wrap}
.controls button{padding:4px 9px}
.controls button.big{font-size:16px;padding:4px 16px;background:var(--acc);border-color:var(--acc2);color:#fff}
.controls .time{font-variant-numeric:tabular-nums;margin:0 6px;color:var(--tx2);font-size:13px}
.zoomctl{display:flex;align-items:center;gap:4px} .zoomctl input{width:80px}
.live-ctl{display:flex;gap:5px;margin-left:auto}
.an-side{width:var(--sideW,460px);max-width:70vw;min-width:280px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--bg2);min-height:0}
.side-tabs{display:flex;border-bottom:1px solid var(--line)}
.side-tabs button{flex:1;border-radius:0;background:transparent;border:none;border-bottom:2px solid transparent;padding:8px 4px}
.side-tabs button.active{border-bottom-color:var(--acc);color:#fff;background:var(--bg3)}
.side-body{flex:1;overflow:auto;min-height:0}
.stab{display:none;padding:8px}
.stab.active{display:block}
.dash-view{position:relative;transform-origin:0 0}
.dbtn{position:absolute;border-radius:8px;border:1px solid #0004;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;font-weight:700;font-size:13px;line-height:1.15;padding:4px;overflow:hidden;box-shadow:inset 0 -3px 0 #0003;transition:transform .05s}
.dbtn:active{transform:scale(.97)}
.dbtn .hk{position:absolute;right:4px;top:2px;font-size:10px;opacity:.7;font-weight:600}
.dbtn .sub{font-size:10px;font-weight:600;opacity:.85}
.dbtn.recording{outline:3px solid #ff3b3b;animation:pulse 1s infinite}
.dbtn.on{outline:3px solid #fff}
@keyframes pulse{50%{outline-color:#ff3b3b55}}
.active-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.active-tags:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--bg4);border:1px solid var(--line);font-size:12px;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);border-color:var(--acc2);color:#fff}
.chip small{opacity:.7}

/* event list */
.filters{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;padding:8px;background:var(--bg3);border-radius:var(--r)}
.filters .row select,.filters .row input{flex:1;min-width:0}
.evgroup{margin-bottom:6px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.evgroup>.gh{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg3);cursor:pointer;font-weight:600}
.evgroup>.gh .cnt{margin-left:auto;color:var(--tx2);font-weight:400}
.evgroup.collapsed .items{display:none}
.evitem{display:flex;align-items:center;gap:6px;padding:5px 8px;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.evitem:hover{background:var(--bg3)}
.evitem.sel{background:#1f3a2c}
.evitem .tm{font-variant-numeric:tabular-nums;color:var(--tx2);font-size:12px;width:92px;flex:none}
.evitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evitem .nm small{color:var(--tx2)}
.evitem .ib{opacity:.6;padding:1px 5px;font-size:12px;background:transparent;border-color:transparent}
.evitem .ib:hover{opacity:1;background:var(--bg4)}
.pl-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:4px;background:var(--bg);font-size:13px}
.pl-item.drag-over{border-color:var(--acc)}
.pl-item.playing{border-color:var(--acc);background:#1f3a2c}
.pl-item .h{cursor:grab;color:var(--tx3)}

/* timeline */
.timeline{background:var(--bg2);border-top:1px solid var(--line);display:flex;flex-direction:column;height:210px;flex:none}
.tl-bar{display:flex;gap:14px;align-items:center;padding:3px 10px;font-size:12px;color:var(--tx2)}
.tl-bar label{display:flex;gap:5px;align-items:center}
.tl-bar .hint{margin-left:auto;color:var(--tx3)}
.tl-box{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
#tlCanvas{display:block}
#tlScroll{width:100%;margin:0;height:12px}

/* dibujo */
.draw-toolbar{display:none;position:absolute;left:8px;top:8px;z-index:8;max-height:calc(100% - 16px);overflow:auto;background:#11161cf2;border:1px solid var(--line);border-radius:10px;padding:6px;flex-direction:column;gap:6px;max-width:calc(100% - 16px)}
.draw-toolbar.show{display:flex}
.draw-toolbar .tools{display:flex;flex-wrap:wrap;gap:3px}
.draw-toolbar .tools button{width:34px;height:32px;padding:0;font-size:15px}
.draw-toolbar .tools button.on{background:var(--acc);border-color:var(--acc2)}
.draw-toolbar .props{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.draw-toolbar .props input[type=number]{width:60px}
.draw-text-input{position:absolute;z-index:9;background:#000c;color:#fff;border:1px solid var(--acc);padding:4px 6px;font-size:18px;min-width:160px}

/* modal */
.modal-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #000c}
.modal.wide{width:min(1100px,100%)}
.modal.narrow{width:min(460px,100%)}
.modal-h{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;display:flex;align-items:center}
.modal-h .x{margin-left:auto}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.form>label{color:var(--tx2);font-size:13px}
.form .full{grid-column:1/-1}
.sect{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.sect-t{font-weight:700;color:var(--tx2);margin-bottom:6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:5px}
.pchip{display:flex;align-items:center;gap:6px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:12px;background:var(--bg)}
.pchip.on{background:var(--acc);border-color:var(--acc2);color:#fff}
.pchip b{min-width:20px;text-align:center}
.pchip img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.field-pick{position:relative;width:100%;max-width:440px;cursor:crosshair;border-radius:6px;overflow:hidden}
.field-pick img{width:100%;display:block}
.field-pick .mark{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#ffeb3b;border:2px solid #000}
.progress{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.progress>div{height:100%;background:var(--acc);width:0}

/* toasts */
#toasts{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:200;pointer-events:none;align-items:center}
.toast{background:#0b0f13ee;border:1px solid var(--line);border-left:4px solid var(--acc);padding:8px 14px;border-radius:8px;font-size:13px;animation:tin .15s ease-out;max-width:80vw}
.toast.warn{border-left-color:var(--warn)} .toast.bad{border-left-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* editor de paneles */
.dash-editor{display:flex;gap:12px;min-height:560px}
.de-canvas-wrap{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:auto;position:relative;min-height:520px}
.de-canvas{position:relative;width:1000px;height:640px;background-image:linear-gradient(var(--bg3) 1px,transparent 1px),linear-gradient(90deg,var(--bg3) 1px,transparent 1px);background-size:10px 10px}
.de-canvas .dbtn.sel{outline:3px solid #fff}
.de-canvas .rs{position:absolute;right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#fff8 50%)}
.de-props{width:330px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow:auto;max-height:78vh}
.de-props .form{grid-template-columns:110px 1fr}
.taggroup{border:1px solid var(--line);border-radius:6px;padding:6px;margin-bottom:6px}

/* stats */
.stats-body{flex:1;overflow:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;align-content:start}
.sbox{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sbox.wide{grid-column:1/-1}
.sbox h3{margin-top:0}
.bar-row{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.bar{height:16px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex}
.bar>div{height:100%}
.bignum{display:flex;gap:20px;flex-wrap:wrap}
.bignum div{background:var(--bg);border-radius:8px;padding:10px 14px;min-width:110px}
.bignum b{display:block;font-size:24px}
.heat{position:relative}
.heat canvas{width:100%;display:block;border-radius:6px}
.kbd{display:inline-block;background:var(--bg4);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;font-size:12px;font-family:ui-monospace,monospace}
.help h3{color:var(--tx)} .help p,.help li{color:var(--tx2);line-height:1.5}

@media (max-width:900px){
  .an-body{flex-direction:column}
  .an-side{width:100%;max-width:none;height:45vh;border-left:none;border-top:1px solid var(--line)}
  .dash-editor{flex-direction:column}
  .de-props{width:auto}
}
@media print{
  body{background:#fff;color:#000}
}

/* pizarra táctica */
.bd-body{flex:1;display:flex;min-height:0}

@media (max-width:900px){.bd-body{flex-direction:column}.bd-tools{width:auto;flex-direction:row;flex-wrap:wrap}.bd-side{width:auto;max-height:40vh}}

/* marca ATFA */
.brand{display:flex;align-items:center;gap:8px}
.brand-badge{display:inline-flex;align-items:center;background:#fff;border-radius:7px;padding:3px 7px;height:30px}

/* pantalla de inicio */
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(ellipse at center,#ffffff 0%,#eef3f7 70%,#dde6ee 100%);transition:opacity .7s ease;cursor:pointer}
#splash img{width:min(560px,70vw);opacity:0;transform:scale(.94);animation:splashIn 1.4s cubic-bezier(.2,.7,.2,1) .15s forwards}

@keyframes splashIn{to{opacity:1;transform:scale(1)}}
.ctxmenu{right:auto!important;width:max-content;max-width:420px}

/* modo simple / avanzado */
body.simple .adv{display:none!important}
body:not(.simple) .simple-only{display:none!important}
body.simple #controls.more .adv{display:inline-flex!important}
/* bienvenida */
.welcome{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:6px 0 4px}
.wcard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:22px 18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .08s,border-color .1s;white-space:normal}

/* guía */
.tour-hl{position:relative;z-index:95!important;box-shadow:0 0 0 4px #00aeef,0 0 0 9999px #000a!important;border-radius:8px}
.tour-bubble{position:fixed;z-index:96;background:#fff;color:#111;border-radius:12px;padding:14px 16px;max-width:340px;box-shadow:0 12px 40px #0009;font-size:14px;line-height:1.45}

.ptype .ic{font-size:44px}.ptype b{font-size:15px}.ptype span{font-size:12px;color:var(--tx2)}
/* propiedades del partido */
.pp-body{flex:1;overflow:auto;padding:14px 18px}

.pp-shield{width:46px;height:46px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;overflow:hidden}

.pp-names{display:grid;grid-template-columns:1fr 1fr;gap:54px;margin-top:6px}
.pp-src{margin-top:10px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px}
.pp-cam{display:flex;align-items:center;gap:6px;margin-bottom:6px}.pp-cam input[type=text]{width:150px}
.pp-tactics{display:flex;justify-content:space-around;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
.pp-field{display:grid;grid-template-columns:150px 1fr 150px;gap:10px;align-items:start}
.pp-bench{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;border:2px dashed #2fb36d66;border-radius:8px;padding:6px;min-height:200px;align-content:flex-start}

.pp-pitch img{width:100%;display:block;border-radius:8px;user-select:none}
.pp-pl{width:58px;cursor:pointer;text-align:center;user-select:none}
.pp-pitch .pp-pl{position:absolute;transform:translate(-50%,-50%)}
.pp-pl .ph{width:46px;height:46px;margin:0 auto;border-radius:8px;background:#1b222b;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;border:2px solid #0006}
.pp-pl .ph img{width:100%;height:100%;object-fit:cover}
.pp-pl .num{font-weight:800;font-size:12px;border-radius:4px;margin:-12px auto 0;width:26px;position:relative}

.pp-pl.sel .ph{border-color:#facc15;box-shadow:0 0 0 3px #facc15}
@media (max-width:1100px){.pp-top{grid-template-columns:1fr}.pp-field{grid-template-columns:1fr}.pp-bench{min-height:auto}}

/* botones con subcategorías dentro (estilo LongoMatch) */
.dbtn.has-cells{justify-content:flex-start;padding:0;align-items:stretch}
.dbtn .dbh{display:flex;align-items:center;gap:4px;padding:3px 6px 2px;font-size:12px;min-height:20px}

.dbtn .cell{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border-left:1px dashed #0003;border-top:1px dashed #0002;text-align:center;padding:1px;line-height:1.05;overflow:hidden}

/* editor de paneles estilo LongoMatch */
.de-toolbar{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px;padding:8px 10px;background:var(--bg3);border-radius:10px}

.de-add{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;padding:6px 8px;font-size:12px;font-weight:600}

.de-add:hover{border-color:var(--acc)}
.de-bg{position:relative;width:96px;cursor:pointer;text-align:center;font-size:11px;color:var(--tx2);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px}
.de-bg:hover{border-color:var(--acc)}
.de-bg img{width:100%;height:46px;object-fit:contain;display:block}
.de-bg button{position:absolute;right:0;top:0;padding:0 4px}
.pp-top>*{min-width:0}.pp-meta input,.pp-meta textarea,.pp-names input{width:100%;min-width:0}
/* Guías */
.help-q{background:#0b3a4f;border:1px solid #00aeef66;color:#bfefff;font-weight:600}
.help-q:hover{background:#00aeef;color:#001018}
.guide{line-height:1.55;font-size:14px;max-width:860px}
.guide h4{margin:18px 0 6px;color:#7fd8ff;font-size:15px}
.guide ol,.guide ul{margin:4px 0 8px;padding-left:22px}.guide li{margin:4px 0}
.guide a[data-help]{color:#4cc9ff;cursor:pointer;text-decoration:underline}
.guide code{background:#0b0e12;padding:1px 5px;border-radius:4px}
.g-tip{background:#0f2e1f;border-left:4px solid #2ebd6b;padding:8px 12px;border-radius:6px;margin:10px 0}

.g-table td{vertical-align:top;padding:6px 10px}.g-table td:first-child{white-space:nowrap}
.g-chips{display:flex;flex-wrap:wrap;gap:6px}.g-chip{background:#151b22;border:1px solid var(--line);border-radius:14px;padding:4px 10px;cursor:pointer;font-size:12.5px;text-decoration:none!important;color:inherit!important}
.g-chip:hover{border-color:#00aeef}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0}
.g-card{display:flex;align-items:center;gap:10px;text-align:left;padding:14px;background:#11161c;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.g-card:hover{border-color:#00aeef;background:#0f1d26}.g-card .ic{font-size:24px}
.g-card,.g-card b{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}
.tpos-grid{display:inline-grid;grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,22px);gap:3px;background:#0b0e12;padding:4px;border-radius:6px;border:1px solid var(--line);vertical-align:middle}

.rd-tt{transition:opacity .15s}
#btnShots.on{background:#7c2d12;border-color:#f59e0b;color:#fde68a}
/* Barra tras marcar */
#markBar{position:fixed;left:50%;bottom:150px;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:.2s;z-index:80;background:#151b22;border:1px solid #00aeef88;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px #000a;font-size:14px}

.ib.star{color:#6b7785}.ib.star.on{color:#facc15}

.recent{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}

/* Banco */
#btnBanco.on{background:#0b3a4f;border-color:#00aeef;color:#bfefff}
.bc-url{display:flex;gap:16px;align-items:center}.bc-qr svg{width:180px;height:180px;border-radius:8px}

#chatBox .ch-h{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #2a3442}
#chatBox .ch-list{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
#chatBox .ch-m{max-width:85%;align-self:flex-start;background:#1d2633;border-radius:10px;padding:6px 9px}
#chatBox .ch-m.me{align-self:flex-end;background:#0c4a6e}
#chatBox .ch-w{font-size:10.5px;opacity:.7;margin-bottom:2px}
#chatBox .ch-t{white-space:pre-wrap;word-break:break-word}
#chatBox .ch-ev{display:block;margin:2px 0 4px;font-size:11.5px;background:#0006;border:0;border-left:3px solid #2fb36d;border-radius:4px;padding:3px 6px;color:inherit;cursor:pointer;text-align:left}
#chatBox .ch-quick{display:flex;gap:4px;overflow-x:auto;padding:6px 10px 0;flex-wrap:nowrap}
#chatBox .ch-quick button{white-space:nowrap;font-size:11.5px}
#chatBox .ch-in{display:flex;gap:6px;padding:8px 10px}
#chatBox .ch-in input{flex:1;min-width:0}
.chat-n{background:#ef4444;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-weight:700;margin-left:2px}
.evgroup>.gh .gact{padding:2px 7px;font-size:12px;opacity:.85}
.evgroup>.gh .gact:hover{opacity:1}
.evgroup>.gh .gexp{background:#0c4a6e;border-radius:6px;color:#e0f2fe}
.tr-badge{background:#0e7490;color:#e0f2fe;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;vertical-align:middle}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;max-height:46vh;overflow:auto}
.att-grid .att{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px}
.att-grid .att.on{border-color:#22c55e;background:#16a34a22}
.att-grid .att img,.att-grid .att .ph{width:28px;height:28px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;background:#0003;flex:none}
.att-grid .att span small{display:block;opacity:.6;font-size:11px}
.pp-conv{display:block;margin:4px auto 6px;font-size:12px}
#qpPane{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);width:min(820px,94vw);max-height:56vh;overflow:auto;background:#11161d;border:1px solid #2a3442;border-radius:12px;box-shadow:0 12px 40px #000c;padding:10px 12px;z-index:950}
#qpPane .players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
#vidLoading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000c;color:#fff;padding:12px 18px;border-radius:10px;text-align:center;z-index:5;pointer-events:none;font-size:14px}
.pp-training .pp-tactics,.pp-training .pp-field,.pp-training .pp-vs,.pp-training .pp-names{display:none}
#exBox{position:absolute;right:10px;top:44px;width:340px;background:#0b0e12ee;border:1px solid #2a3442;border-radius:10px;z-index:7;box-shadow:0 8px 26px #000b;overflow:hidden}
#exBox.big{width:560px}
#exBox canvas{width:100%;display:block}
#exBox .exh{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:12px}

/* ================= CELULAR (versión web) ================= */
.screen{height:100dvh}
.m-only{display:none!important}
body.nodir #rd-pick,body.nodir #rd-reset,body.nodir #setExpPick,body.nodir #setExpReset,body.nodir #bkDir,body.nodir #bkNow,body.web #btnBanco,body.web #btnChat,body.web .no-web{display:none!important}
@media (max-width:760px){
  body{-webkit-text-size-adjust:100%}
  button,select,input{font-size:15px}
  .m-only{display:inline-flex!important}
  .m-hide{display:none!important}
  /* inicio */
  .topnav{flex-wrap:wrap;gap:6px;padding:6px 8px}
  .topnav .brand{font-size:15px}.topnav .brand small{display:none}
  .topnav nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .topnav nav::-webkit-scrollbar{display:none}
  .topnav nav button{white-space:nowrap;flex:none;padding:6px 10px}
  .topnav>label.chk{font-size:11px}
  .home-main{padding:10px}
  .welcome{grid-template-columns:1fr}
  /* ventanas */
  .modal-bg{padding:0;align-items:stretch}
  .modal,.modal.wide,.modal.narrow{width:100%;max-height:100dvh;border-radius:0;border:none}
  .modal-b{padding:10px 12px}
  .modal-b [style*="grid-template-columns"]{grid-template-columns:1fr!important}
  .form{grid-template-columns:1fr;gap:3px 0}.form>*{min-width:0}.form>label{margin-top:6px}
  .form .row{flex-wrap:wrap}
  .modal-f{position:sticky;bottom:0;background:var(--bg2)}
  .menu{max-width:92vw;max-height:70dvh;overflow:auto}
  .an-top .menu{position:fixed;top:46px;right:6px;left:6px;max-width:none;min-width:0}
  #markBar{left:6px;right:6px;bottom:8px;transform:translateY(30px);flex-wrap:wrap;justify-content:center}
  #markBar.show,#markBar.on{transform:none}
  /* análisis: vídeo arriba, controles, panel abajo */
  .an-top{gap:6px;padding:4px 6px;flex-wrap:nowrap;overflow-x:auto}
  .an-top .an-title{display:none}
  .an-top .period{font-size:0}.an-top .period select{font-size:14px}
  .scoreboard{font-size:13px;flex:none;padding:3px 7px;gap:5px}
  .scoreboard>span:not(.sc):not(.dot){display:none}
  #btnDrawMode,#btnStats,#btnExportMenu{font-size:0!important}
  #btnDrawMode::before{content:'✎';font-size:16px}#btnStats::before{content:'📊';font-size:16px}#btnExportMenu::before{content:'📤 ▾';font-size:15px}
  .an-actions{gap:4px;flex:none}
  .an-actions>button,.an-actions .menu-wrap>button{padding:5px 8px;font-size:14px;white-space:nowrap}
  #btnBack{font-size:0;padding:5px 9px}#btnBack::before{content:'←';font-size:16px}
  .an-body{flex-direction:column}
  .an-left{flex:none}
  .video-area{flex:none}
  .video-main{flex:none;aspect-ratio:16/9;min-height:0;width:100%}
  .video-thumbs{height:60px}
  .controls{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:5px 6px;gap:6px}
  .controls::-webkit-scrollbar{display:none}
  .controls>*{flex:none}
  .controls button{padding:7px 11px;font-size:15px}
  .controls button.big{padding:7px 20px}
  .controls .time{font-size:12px;margin:0 2px}
  .an-side{flex:1;height:auto!important;width:100%!important;max-width:none;min-width:0;border-left:none;border-top:1px solid var(--line)}
  .side-tabs{overflow-x:auto;scrollbar-width:none}
  .side-tabs button{flex:none;padding:9px 12px;white-space:nowrap}
  .timeline{display:none}
  body.m-tl .timeline{display:flex;height:150px}
  .tl-bar .hint,.tl-bar>span:first-child{display:none}
  .draw-toolbar{max-width:100%;overflow-x:auto}
  /* propiedades del partido */
  .pp-body{padding:8px}
  .pp-top{grid-template-columns:1fr!important}
  .pp-field{grid-template-columns:1fr!important}
  .pp-bench{min-height:auto}
  .pp-names{gap:8px}
  .pp-vs{grid-template-columns:1fr 30px 1fr}
  .pp-team{padding:5px;gap:4px}.pp-team select{font-size:14px}
  .pp-shield{width:34px;height:34px;font-size:20px}
  .pp-cam{flex-wrap:wrap}
  .pp-pl{width:46px}.pp-pl .ph{width:34px;height:34px;font-size:20px}
  /* pizarra y estadísticas */
  .bd-tools{width:auto}
  .stats-body{padding:8px}
  #toasts{left:8px;right:8px;transform:none}.toast{max-width:none}
  table{font-size:13px}
}
/* celular acostado: vídeo a la izquierda, botonera a la derecha */
@media (max-height:520px) and (orientation:landscape){
  .topnav{padding:4px 8px}
  .an-top{padding:2px 6px;flex-wrap:nowrap;overflow-x:auto}
  .an-top .an-title{display:none}
  .an-body{flex-direction:row}
  .an-side{width:42vw!important;height:auto!important;min-width:0;border-top:none;border-left:1px solid var(--line)}
  .side-resizer{display:none}
  .controls{flex-wrap:nowrap;overflow-x:auto;padding:3px 5px}
  .controls>*{flex:none}
  .timeline{display:none}
  body.m-tl .timeline{display:flex;height:110px}
  .video-thumbs{height:50px}
  .modal-bg{padding:0}
  .modal,.modal.wide,.modal.narrow{max-height:100dvh;border-radius:0}
}

</style>

let EXPORT_DIR = null;

/** Guarda en la carpeta elegida (por ruta) mandando el archivo en partes de 16 MB al servidor local */
async function savePathExport(name, blob) {
  const CH = 16 * 1024 * 1024; let fname = null, full = null;
  for (let pos = 0; pos < blob.size || pos === 0; pos += CH) {
    const part = blob.slice(pos, Math.min(blob.size, pos + CH));
    const q = `?dir=${encodeURIComponent(EXPORT_DIR.path)}&name=${encodeURIComponent(fname || name)}&pos=${pos}${pos === 0 ? '&new=1' : ''}`;
    const r = await fetch(LOCALSRV + '/api/save' + q, { method: 'POST', body: part }); if (!r.ok) throw new Error(await r.text());
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'no se pudo guardar'); fname = j.name; full = j.path;
    if (blob.size === 0) break;
  }
  return { folder: EXPORT_DIR.name, file: fname, path: full, dir: EXPORT_DIR.path, blob };
}
async function saveExport(name, blob, useDir = true) {
  if (useDir && isPathDir(EXPORT_DIR)) {

    catch (e) { console.warn('No se pudo guardar en la carpeta elegida', e); toast('No se pudo guardar en "' + EXPORT_DIR.path + '" (' + e.message + '): se guarda en Descargas', 'warn'); }
  } else if (useDir && EXPORT_DIR && await exportDirReady(false)) {
    try {
      let fn = name; const dot = name.lastIndexOf('.'); const base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
      for (let i = 2; i < 200; i++) { try { await EXPORT_DIR.getFileHandle(fn); fn = `${base} (${i})${ext}`; } catch (e) { break; } }
      const fh = await EXPORT_DIR.getFileHandle(fn, { create: true }); const w = await fh.createWritable(); await w.write(blob); await w.close();
      return { folder: EXPORT_DIR.name, file: fn, blob };
    } catch (e) { console.warn('No se pudo guardar en la carpeta elegida', e); }
  }

}

/** modal({title, body(html|node), buttons:[{label,cls,value,onClick}], wide, narrow, onOpen(root)}) → Promise(value) */
function modal(opts) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    const m = document.createElement('div'); m.className = 'modal' + (opts.wide ? ' wide' : '') + (opts.narrow ? ' narrow' : '');
    const hk = opts.noHelp ? null : (opts.help || (typeof guideForTitle === 'function' ? guideForTitle(opts.title) : null));
    m.innerHTML = `<div class="modal-h">${esc(opts.title || '')}${hk ? `<button class="help-q" data-help="${hk}" style="margin-left:auto;margin-right:6px" title="Ver la guía">❓ Guía</button>` : ''}<button class="ghost x" data-x ${hk ? 'style="margin-left:0"' : ''}>✕</button></div><div class="modal-b"></div><div class="modal-f"></div>`;
    const body = $('.modal-b', m);
    if (typeof opts.body === 'string') body.innerHTML = opts.body; else if (opts.body) body.appendChild(opts.body);
    const close = v => { bg.remove(); document.removeEventListener('keydown', kd, true); resolve(v); };
    m.close = close;
    const foot = $('.modal-f', m);
    (opts.buttons || [{ label: 'Cerrar', value: null }]).forEach(b => {
      const btn = document.createElement('button'); btn.textContent = b.label; if (b.cls) btn.className = b.cls;
      btn.onclick = async () => {
        if (b.onClick) { const r = await b.onClick(m); if (r === false) return; close(r === undefined ? b.value : r); }
        else close(b.value);
      };
      foot.appendChild(btn);
    });
    if (!foot.children.length) foot.remove();
    $('[data-x]', m).onclick = () => close(null);
    bg.addEventListener('mousedown', e => { if (e.target === bg && !opts.sticky) close(null); });
    const kd = e => {
      if (!document.body.contains(bg)) return;
      if (e.key === 'Escape') { e.stopPropagation(); close(null); }
      if (e.key === 'Enter' && opts.enterValue !== undefined && !(e.target.tagName === 'TEXTAREA') && !(e.target.dataset && e.target.dataset.localEnter !== undefined && e.target.value.trim())) {
        e.preventDefault(); e.stopPropagation();
        const prim = foot.querySelector('.primary'); if (prim) prim.click();
      }
    };
    document.addEventListener('keydown', kd, true);
    bg.appendChild(m); $('#modalRoot').appendChild(bg);
    if (opts.onOpen) opts.onOpen(m);
    const f = m.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 30);
  });
}

/* ---------------- Almacenamiento (IndexedDB con respaldo en memoria) ---------------- */
const DB = {
  db: null, mem: {}, ok: true,
  stores: ['projects', 'dashboards', 'teams', 'playlists', 'handles', 'blobs', 'kv', 'boards'],
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('openmatch', 2);
        r.onupgradeneeded = () => { this.stores.forEach(s => { if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('bloqueado'));
      });
    } catch (e) {
      this.ok = false; this.stores.forEach(s => this.mem[s] = new Map());
      console.warn('IndexedDB no disponible', e);
      setTimeout(() => toast('El navegador no permite guardar datos aquí: exportá tus proyectos (.json) para no perderlos.', 'warn'), 800);
    }
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store);
      const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async get(store, key) { if (!this.ok) return this.mem[store].get(key); return this.tx(store, 'readonly', s => s.get(key)); },
  async put(store, key, val) { if (!this.ok) { this.mem[store].set(key, val); return; } return this.tx(store, 'readwrite', s => s.put(val, key)); },
  async del(store, key) { if (!this.ok) { this.mem[store].delete(key); return; } return this.tx(store, 'readwrite', s => s.delete(key)); },
  async all(store) {
    if (!this.ok) return Array.from(this.mem[store].values());
    return this.tx(store, 'readonly', s => s.getAll());
  },
};

/* ---------------- Vídeo: obtención de URLs ---------------- */
const VIDEO_URLS = {}; // camId -> objectURL (sesión)
const HAS_FS = 'showOpenFilePicker' in window;
/* Vídeos por RUTA (file:///C:/...): la app y el vídeo son archivos locales, así que Edge no pide permiso nunca.
   La ruta la da el pequeño servidor local de ATFAMatch (ventana de Windows para elegir / búsqueda por nombre y tamaño).
   Si el servidor no está, se usa el selector del navegador como antes. */
const LOCALSRV = 'http://127.0.0.1:8090';
/* Versión web (GitHub Pages / celular): no hay servicio local de Windows */
const WEB = !!window.ATFA_WEB;
const MOBILE = WEB && (matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad/i.test(navigator.userAgent));
function pathToUrl(p) { return 'file:///' + String(p).replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/').replace(/^([A-Za-z])%3A/, '$1:'); }
async function localSrv(path, ms = 1500, opts = {}) {
  if (WEB) return null;
  try { const ctl = new AbortController(); const t = ms ? setTimeout(() => ctl.abort(), ms) : 0; const r = await fetch(LOCALSRV + path, { cache: 'no-store', signal: ctl.signal, ...opts }); clearTimeout(t); if (!r.ok) return null; return await r.json(); } catch (e) { return null; }
}
async function localSrvUp() {
  if (WEB) return false;
  // recién abierta la app el servidor puede tardar 1-2 s en arrancar: esperar un poco antes de darlo por apagado
  for (let i = 0; i < 6; i++) { const j = await localSrv('/api/ping', 1200); if (j && j.app === 'atfamatch-banco') return (j.version || 0) >= 3; if (performance.now() > 20000) return false; await sleep(800); }
  return false;
}
/** ¿Se puede leer este vídeo por su ruta? (carga solo los metadatos, sin permisos) */
function probeVideoUrl(url, ms = 6000) {
  return new Promise(res => { const v = document.createElement('video'); v.muted = true; v.preload = 'metadata'; let done = false;
    const fin = ok => { if (done) return; done = true; clearTimeout(t); v.removeAttribute('src'); try { v.load(); } catch (e) { } res(ok); };
    const t = setTimeout(() => fin(false), ms); v.onloadedmetadata = () => fin(true); v.onerror = () => fin(false); v.src = url; });
}
async function localFind(name, size) {
  if (!name || !await localSrvUp()) return null;
  toast('🔎 Buscando "' + name + '" en la PC…');
  const j = await localSrv('/api/find?name=' + encodeURIComponent(name) + '&size=' + (size || 0), 60000);
  return j && j.path ? j : null;
}
function camChanged(cam) { if (ST.p && ST.p.cameras && ST.p.cameras.includes(cam)) markDirty(); }
async function chooseVideoFile() {
  if (await localSrvUp()) {
    toast('Se abrió la ventana de Windows para elegir el vídeo (si no la ves, mirá la barra de tareas)');
    const j = await localSrv('/api/pick', 0, { method: 'POST', body: '{}' });
    if (j && j.cancel) return null;
    if (j && j.path) return { file: { name: j.name, size: j.size, lastModified: j.mtime || 0, path: j.path }, handle: null };
  }
  if (HAS_FS) {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'Vídeo', accept: { 'video/*': ['.mp4', '.mov', '.webm', '.mkv', '.m4v', '.avi', '.ogv'] } }] });
      return { file: await h.getFile(), handle: h };
    } catch (e) { if (e.name === 'AbortError') return null; }
  }
  const f = await pickFile('video/*,.mkv,.mov,.avi');
  return f ? { file: f, handle: null } : null;
}
async function attachVideo(cam, file, handle, storeCopy = false) {
  if (VIDEO_URLS[cam.id] && VIDEO_URLS[cam.id].startsWith('blob:')) URL.revokeObjectURL(VIDEO_URLS[cam.id]);
  cam.fileName = file.name || cam.fileName; cam.fileSize = file.size;
  if (file.path) {
    // vídeo por ruta: sin permisos, para siempre (mientras no lo muevas de carpeta)
    cam.path = file.path; VIDEO_URLS[cam.id] = pathToUrl(file.path);
    if (storeCopy) toast('El vídeo se usa desde su carpeta (no hace falta guardar una copia)');
    return;
  }
  VIDEO_URLS[cam.id] = URL.createObjectURL(file);
  delete cam.path;
  if (handle) { try { await DB.put('handles', cam.id, handle); } catch (e) { } }
  if (storeCopy) {
    try { await DB.put('blobs', cam.id, file); cam.stored = true; toast('Vídeo guardado dentro de la app'); }
    catch (e) { cam.stored = false; toast('No hay espacio para guardar el vídeo en el navegador', 'warn'); }
  }
  // en segundo plano: averiguar la ruta del archivo para no tener que pedir permiso la próxima vez
  if (!cam.stored) localFind(cam.fileName, cam.fileSize).then(j => { if (j && !cam.path) { cam.path = j.path; camChanged(cam); } }).catch(() => { });
}
/** Intenta recuperar el vídeo de una cámara sin interacción. Devuelve true si quedó disponible. */
async function restoreVideo(cam, interactive = false) {
  if (VIDEO_URLS[cam.id]) return true;
  if (cam.path) {
    const u = pathToUrl(cam.path);
    if (await probeVideoUrl(u)) { VIDEO_URLS[cam.id] = u; return true; }
  }
  try {
    const blob = await DB.get('blobs', cam.id);
    if (blob) { VIDEO_URLS[cam.id] = URL.createObjectURL(blob); return true; }
  } catch (e) { }
  // sin ruta (proyecto viejo) o el vídeo se movió: buscarlo por nombre y tamaño en la PC
  const j = await localFind(cam.fileName, cam.fileSize);
  if (j) { const u = pathToUrl(j.path); if (await probeVideoUrl(u)) { cam.path = j.path; VIDEO_URLS[cam.id] = u; camChanged(cam); toast('✔ Vídeo encontrado: ya no se va a pedir permiso'); return true; } }
  try {
    const h = await DB.get('handles', cam.id);
    if (h && h.queryPermission) {
      let p = await h.queryPermission({ mode: 'read' });
      if (p !== 'granted' && interactive) p = await h.requestPermission({ mode: 'read' });
      if (p === 'granted') { const f = await h.getFile(); VIDEO_URLS[cam.id] = URL.createObjectURL(f); return true; }
    }
  } catch (e) { }
  return false;
}

/* ---------------- Recorte de imagen (para capturas de pantalla / streaming) ---------------- */
/** Rectángulo fuente (px) del vídeo teniendo en cuenta el recorte guardado en el elemento (_crop normalizado) */
function vcrop(v) {
  const W = v.videoWidth || 0, H = v.videoHeight || 0; const c = v._crop;
  if (!c || !W) return { sx: 0, sy: 0, sw: W, sh: H };
  return { sx: c.x * W, sy: c.y * H, sw: Math.max(1, c.w * W), sh: Math.max(1, c.h * H) };
}
function applyCrop(el, crop) {
  el._crop = crop && crop.w > 0.02 && crop.h > 0.02 && !(crop.x === 0 && crop.y === 0 && crop.w === 1 && crop.h === 1) ? crop : null;
  const c = el._crop;
  el.style.objectViewBox = c ? `inset(${(c.y * 100).toFixed(2)}% ${((1 - c.x - c.w) * 100).toFixed(2)}% ${((1 - c.y - c.h) * 100).toFixed(2)}% ${(c.x * 100).toFixed(2)}%)` : '';
}
/** Diálogo para elegir la zona útil del vídeo arrastrando un rectángulo sobre el cuadro actual */
async function cropDialog(video, current) {
  if (!video || !video.videoWidth) { toast('Todavía no hay imagen para recortar', 'warn'); return undefined; }
  const W = video.videoWidth, H = video.videoHeight; const k = Math.min(1, 860 / W, 480 / H);
  const body = document.createElement('div');
  body.innerHTML = `<p class="muted">Arrastrá sobre la imagen para elegir la zona del partido (deja afuera menús, bordes o publicidad de la página).</p>
    <div style="position:relative;display:inline-block;cursor:crosshair;user-select:none" id="cr-wrap"><canvas id="cr-c" width="${Math.round(W * k)}" height="${Math.round(H * k)}" style="display:block;max-width:100%"></canvas></div>`;
  let crop = current ? { ...current } : null;
  const c = $('#cr-c', body), ctx = c.getContext('2d');
  const frame = document.createElement('canvas'); frame.width = c.width; frame.height = c.height; frame.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
  const draw = () => { ctx.drawImage(frame, 0, 0); if (crop) { ctx.fillStyle = '#000a'; ctx.beginPath(); ctx.rect(0, 0, c.width, c.height); ctx.rect(crop.x * c.width, crop.y * c.height, crop.w * c.width, crop.h * c.height); ctx.fill('evenodd'); ctx.strokeStyle = '#2fb36d'; ctx.lineWidth = 3; ctx.strokeRect(crop.x * c.width, crop.y * c.height, crop.w * c.width, crop.h * c.height); } };
  draw();
  c.addEventListener('pointerdown', e => {
    const r = c.getBoundingClientRect(); const p0 = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; c.setPointerCapture(e.pointerId);
    const mv = ev => { const x = clamp((ev.clientX - r.left) / r.width, 0, 1), y = clamp((ev.clientY - r.top) / r.height, 0, 1); crop = { x: Math.min(p0.x, x), y: Math.min(p0.y, y), w: Math.abs(x - p0.x), h: Math.abs(y - p0.y) }; draw(); };
    const up = () => { c.removeEventListener('pointermove', mv); c.removeEventListener('pointerup', up); if (crop && (crop.w < 0.03 || crop.h < 0.03)) { crop = null; draw(); } };
    c.addEventListener('pointermove', mv); c.addEventListener('pointerup', up);
  });
  return await modal({ title: 'Recortar imagen', wide: true, body, buttons: [{ label: 'Cancelar', value: undefined }, { label: 'Usar imagen completa', value: null }, { label: 'Aplicar recorte', cls: 'primary', onClick: () => crop || null }] });
}

async function importProjectFile() {
  const f = await pickFile('.json,application/json'); if (!f) return;
  try {
    const data = JSON.parse(await readText(f));
    if (data.format === 'openmatch-backup') return importBackup(data);
    const p = data.project || data;
    if (!p.events || !p.dashboard) throw new Error('No es un proyecto de ATFAMatch');
    if (APP.projects.some(x => x.id === p.id)) {
      const ow = await confirmBox(`Ya existe "${p.name}". ¿Reemplazarlo? (Cancelar = importar como copia)`, 'Reemplazar');
      if (ow) APP.projects = APP.projects.filter(x => x.id !== p.id); else { p.id = uid(); p.name += ' (importado)'; }
    }
    p.updated = Date.now(); APP.projects.push(p); await DB.put('projects', p.id, p);
    for (const pl of data.playlists || []) { if (!APP.playlists.some(x => x.id === pl.id)) { APP.playlists.push(pl); await savePlaylist(pl); } }
    toast('Proyecto importado: ' + p.name); renderProjects();
  } catch (e) { toast('No se pudo importar: ' + e.message, 'bad'); }
}
function exportProjectJSON(p) {
  const pls = APP.playlists.filter(pl => pl.items.some(i => i.projectId === p.id));
  download(safeName(p.name) + '.atfamatch.json', JSON.stringify({ format: 'openmatch-project', version: 1, exported: new Date().toISOString(), project: p, playlists: pls }, null, 1), 'application/json');
  toast('Proyecto exportado. Pasale este archivo + el vídeo a tus compañeros.');
}

/** Editor de equipo reutilizable (plantilla o copia dentro de un proyecto) */
async function teamEditorBody(t) {
  const body = document.createElement('div');
  const draw = () => {
    body.innerHTML = `<div class="form">
      <label>Nombre</label><input type="text" id="te-name" value="${esc(t.name)}">

      <label>Formación</label><input type="text" id="te-form" value="${esc(t.formation || '')}" placeholder="4-3-3">
    </div>
    <div class="sect"><div class="row"><div class="sect-t grow">${t.isMatch ? 'Jugadores de este partido' : `Plantel · ${t.players.length} jugadores`}</div><button class="small" id="te-add">+ Jugador</button><button class="small" id="te-paste">Pegar lista…</button></div>
    ${t.isMatch ? '' : '<p class="tiny" style="margin:2px 0 8px">Cargá acá a <b>todos</b> los jugadores del club (24, 30 o los que tengas) con su nombre, posición y foto. El <b>número de camiseta</b> es opcional: en cada partido se elige quién juega, con qué número y quién es titular desde <b>📋 Convocatoria</b>. Si corregís un nombre acá, se corrige en todos los partidos y estadísticas.</p>'}
    <table class="grid"><thead><tr>${t.isMatch ? '<th>Titular</th>' : ''}<th>${t.isMatch ? 'N°' : 'N° habitual'}</th><th>Nombre</th><th>Posición</th><th>Foto</th><th></th></tr></thead><tbody>
    ${t.players.map((p, i) => `<tr data-i="${i}">${t.isMatch ? `<td><input type="checkbox" data-f="active" ${p.active !== false ? 'checked' : ''}></td>` : ''}
      <td><input type="number" data-f="number" value="${p.number ?? ''}" style="width:60px" placeholder="—"></td>
      <td><input type="text" data-f="name" value="${esc(p.name)}" style="width:100%"></td>
      <td><input type="text" data-f="position" value="${esc(p.position || '')}" style="width:110px" placeholder="DEF, MED…"></td>
      <td>${p.photo ? `<img src="${p.photo}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle">` : ''}<button class="small" data-photo>📷</button></td>
      <td><button class="small danger" data-del>✕</button></td></tr>`).join('')}</tbody></table></div>`;
    $('#te-name', body).oninput = e => t.name = e.target.value;
    $('#te-color', body).oninput = e => t.color = e.target.value;
    $('#te-form', body).oninput = e => t.formation = e.target.value;
    $('#te-shield', body).onclick = async () => { const f = await pickFile('image/*'); if (f) { t.shield = await resizeImage(f, 128); draw(); } };
    const ns = $('#te-noshield', body); if (ns) ns.onclick = () => { t.shield = null; draw(); };
    $('#te-add', body).onclick = () => { const k = t.players.length + 1; t.players.push({ id: uid(), number: t.isMatch ? Math.max(0, ...t.players.map(p => +p.number || 0)) + 1 : null, name: 'Jugador ' + k, position: '', photo: null, active: true }); draw(); setTimeout(() => { const ins = body.querySelectorAll('[data-f=name]'); const l = ins[ins.length - 1]; if (l) { l.focus(); l.select(); } }, 30); };
    $('#te-paste', body).onclick = async () => {
      const txt = await modal({ title: 'Pegar lista de jugadores', narrow: true, body: `<p class="tiny">Una línea por jugador: solo el nombre, o <code>número nombre [posición]</code>. Ej.: <code>Juan Pérez</code> · <code>10 Lionel Messi DEL</code>. Reemplaza a los “Jugador 1, 2…” de ejemplo.</p><textarea id="pl" rows="12" style="width:100%"></textarea>`,
        buttons: [{ label: 'Cancelar' }, { label: 'Añadir', cls: 'primary', onClick: m => $('#pl', m).value }] });
      if (!txt) return;
      // los nombres reemplazan a los "Jugador N" de ejemplo; si sobran, se agregan; los de ejemplo que quedan se quitan
      const free = t.players.filter(p => /^jugador\s*\d*$/i.test((p.name || '').trim()));
      txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(l => {
        const m = l.match(/^(\d+)[\s.,;-]+(.+?)(?:[\s,;]+(POR|ARQ|DEF|MED|DEL|GK|DF|MF|FW|LAT|VOL|EXT))?$/i);
        const pl = m ? { number: +m[1], name: m[2].trim(), position: (m[3] || '').toUpperCase() } : { number: null, name: l, position: '' };
        const r = free.shift();
        if (r) { r.name = pl.name; r.position = pl.position || r.position; r.number = t.isMatch ? (pl.number ?? r.number) : pl.number; }
        else t.players.push({ id: uid(), ...pl, photo: null, active: true });
      });
      if (free.length) { const drop = new Set(free.map(p => p.id)); t.players = t.players.filter(p => !drop.has(p.id)); }
      draw();
    };
    $$('tr[data-i]', body).forEach(tr => {
      const p = t.players[+tr.dataset.i];
      $$('[data-f]', tr).forEach(inp => inp.oninput = inp.onchange = () => { const f = inp.dataset.f; p[f] = inp.type === 'checkbox' ? inp.checked : inp.type === 'number' ? (inp.value === '' ? null : +inp.value) : inp.value; });
      $('[data-del]', tr).onclick = () => { t.players.splice(+tr.dataset.i, 1); draw(); };
      $('[data-photo]', tr).onclick = async () => { const f = await pickFile('image/*'); if (f) { p.photo = await resizeImage(f, 96); draw(); } };
    });
  };
  draw();
  return body;
}

  el.innerHTML = `<div class="row" style="margin-bottom:14px"><h2 class="grow" style="margin:0">Paneles de análisis</h2><button id="impDash">Importar…</button><button class="primary" id="newDash">+ Nuevo panel</button></div>
  <p class="muted">Un panel define los botones que usás para etiquetar: categorías con subcategorías, etiquetas, goles, tarjetas y cronómetros, cada uno con su atajo de teclado.</p>
  <div class="cards">${APP.dashboards.map(d => `<div class="card" data-id="${d.id}"><div class="ttl">${esc(d.name)}</div>
    <div class="tiny">${d.buttons.length} botones · períodos: ${esc(d.periods.join(', '))}</div>
    <div class="row" style="gap:3px">${d.buttons.slice(0, 14).map(b => `<span class="dot" title="${esc(b.name)}" style="background:${esc(b.color)}"></span>`).join('')}</div>
    <div class="acts"><button class="primary" data-a="edit">Editar</button><button data-a="dup">Duplicar</button><button data-a="exp">Exportar</button><button class="danger" data-a="del">Borrar</button></div></div>`).join('')}</div>`;
  $('#newDash').onclick = async () => { const d = { id: uid(), name: 'Nuevo panel', sport: 'football', periods: ['1', '2'], buttons: [], disablePopup: false }; APP.dashboards.push(d); await saveDash(d); editDashboard(d, async () => { await saveDash(d); renderDashboards(); }); };
  $('#impDash').onclick = async () => {
    const f = await pickFile('.json'); if (!f) return;
    try { const d = JSON.parse(await readText(f)); if (!d.buttons) throw 0; d.id = uid(); APP.dashboards.push(d); await saveDash(d); renderDashboards(); toast('Panel importado'); } catch (e) { toast('Archivo no válido', 'bad'); }
  };
  $$('#tab-dashboards .card').forEach(c => c.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return; const d = APP.dashboards.find(x => x.id === c.dataset.id);
    if (b.dataset.a === 'edit') editDashboard(d, async () => { await saveDash(d); renderDashboards(); });
    if (b.dataset.a === 'exp') download(safeName(d.name) + '.panel.json', JSON.stringify(d, null, 1), 'application/json');
    if (b.dataset.a === 'dup') { const n = deep(d); n.id = uid(); n.name += ' (copia)'; n.builtin = false; APP.dashboards.push(n); await saveDash(n); renderDashboards(); }
    if (b.dataset.a === 'del') { if (APP.dashboards.length <= 1) return; if (await confirmBox('¿Borrar el panel ' + d.name + '?', 'Borrar', true)) { APP.dashboards = APP.dashboards.filter(x => x !== d); await DB.del('dashboards', d.id); renderDashboards(); } }
  });
}
function hotkeyLabel(k) { return k ? k.replace('shift+', '⇧').toUpperCase() : ''; }
function keyFromEvent(e) {
  if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return null;
  let k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (e.code && e.code.startsWith('Key')) k = e.code.slice(3).toLowerCase();
  if (e.code && e.code.startsWith('Digit')) k = e.code.slice(5);
  if (e.code && e.code.startsWith('Numpad') && /\d/.test(e.code.slice(6))) k = 'num' + e.code.slice(6);
  return (e.shiftKey ? 'shift+' : '') + k;
}
const RESERVED_KEYS = [' ', 'arrowleft', 'arrowright', 'arrowup', 'arrowdown', ',', '.', 'escape', 'enter', 'tab', 'd', 'delete', 'backspace'];

/** Editor visual de paneles. onSave() se llama al guardar. */
function editDashboard(d, onSave, projectCtx = null) {
  const work = deep(d); let sel = null;
  const body = document.createElement('div');
  body.innerHTML = `<div class="row" style="margin-bottom:8px">
      <label>Nombre <input type="text" id="de-name" value="${esc(work.name)}"></label>
      <label>Tiempos / períodos <input type="text" id="de-periods" value="${esc(work.periods.join(', '))}" style="width:160px" title="Separados por coma"></label>
      <label class="chk"><input type="checkbox" id="de-popup" ${work.disablePopup ? 'checked' : ''}> Etiquetado rápido (sin ventana emergente)</label>
    </div>
    <div class="de-toolbar"><div class="de-tb-group"><div class="tiny">Añadir botones al panel</div><div class="row" style="gap:6px">${Object.entries(BTN_TYPES).map(([k, v]) => `<button class="de-add" data-add="${k}" title="${BTN_HELP[k]}"><span>${BTN_ICONS[k]}</span>＋ ${v}</button>`).join('')}</div></div>
      <div class="de-tb-group"><div class="tiny">Fondos para etiquetar posiciones</div><div class="row" style="gap:6px">${Object.entries(POS_KINDS).map(([k, v]) => `<div class="de-bg" data-bg="${k}" title="Clic para cambiar la imagen"><img src="${dashBg(work, k)}"><span>${v}</span>${work.bg && work.bg[k] ? `<button class="small ghost" data-bgreset="${k}" title="Restablecer">↺</button>` : ''}</div>`).join('')}</div></div>
      <span class="tiny grow" style="text-align:right">Arrastrá los botones para moverlos · esquina para cambiar el tamaño</span></div>
    <div class="dash-editor"><div class="de-canvas-wrap"><div class="de-canvas" id="de-canvas"></div></div><div class="de-props" id="de-props"></div></div>`;
  const canvas = $('#de-canvas', body), props = $('#de-props', body);
  const drawCanvas = () => {
    const maxX = Math.max(1000, ...work.buttons.map(b => b.x + b.w + 20)), maxY = Math.max(600, ...work.buttons.map(b => b.y + b.h + 20));
    canvas.style.width = maxX + 'px'; canvas.style.height = maxY + 'px';
    canvas.innerHTML = work.buttons.map(b => dbtnHTML(b, sel === b.id ? 'sel' : '', true)).join('');
  };
  const drawProps = () => {
    const b = work.buttons.find(x => x.id === sel);
    if (!b) { props.innerHTML = '<p class="muted">Seleccioná un botón para editar sus propiedades.</p><p class="tiny">Tipos de botón:<br>• <b>⚡ Evento</b>: crea un clip en la línea de tiempo (automático: tiempo antes/después · manual: pulsás al inicio y al final).<br>• <b>🏷 Etiqueta</b>: se suma al próximo evento.<br>• <b>⚽ Puntuación</b>: gol o punto, suma al marcador.<br>• <b>🟨 Amonestación</b>: tarjeta o sanción a un jugador.<br>• <b>⏱ Temporizador</b>: mide intervalos (posesión, pelota en juego).<br><br>Las <b>subcategorías</b> (p.ej. Correcto / Fallo) aparecen dentro del botón: un clic en ellas etiqueta directo.</p>'; return; }
    const others = work.buttons.filter(x => x.id !== b.id);
    props.innerHTML = `<div class="form">
      <label>Tipo</label><b>${BTN_TYPES[b.type]}</b>
      <label>Nombre</label><input type="text" data-p="name" value="${esc(b.name)}">
      <label>Color</label><div class="row"><input type="color" data-p="color" value="${esc(b.color.slice(0, 7))}"><input type="color" data-p="textColor" value="${esc((b.textColor || textColorFor(b.color)).slice(0, 7))}" title="Color del texto"></div>
      <label>Atajo</label><div class="row"><input type="text" id="hk" value="${hotkeyLabel(b.hotkey)}" readonly placeholder="clic y pulsá una tecla" style="width:120px"><button class="small" id="hkclr">✕</button></div>
      <label>Tamaño</label><div class="row"><input type="number" data-p="w" value="${b.w}" style="width:70px"><input type="number" data-p="h" value="${b.h}" style="width:70px"></div>
      ${['event', 'score', 'card'].includes(b.type) ? `
      <label>Modo de etiquetado</label><select data-p="tagMode"><option value="fixed" ${b.tagMode !== 'free' ? 'selected' : ''}>Automático (tiempo antes y después)</option><option value="free" ${b.tagMode === 'free' ? 'selected' : ''}>Manual (pulsar al inicio y al final)</option></select>
      <label>Tiempo de inicio (s)</label><input type="number" step="0.5" data-p="lead" value="${b.lead ?? ''}" placeholder="por defecto ${SETTINGS.lead}">
      <label>Tiempo de fin (s)</label><input type="number" step="0.5" data-p="lag" value="${b.lag ?? ''}" placeholder="por defecto ${SETTINGS.lag}">
      <label>Posición de campo</label><select data-p="posField"><option value="">No etiquetado</option><option value="1" ${b.posField || b.askPosition ? 'selected' : ''}>Etiquetar</option></select>
      <label>Posición de medio campo</label><select data-p="posHalf"><option value="">No etiquetado</option><option value="1" ${b.posHalf ? 'selected' : ''}>Etiquetar</option></select>
      <label>Posición de portería</label><select data-p="posGoal"><option value="">No etiquetado</option><option value="1" ${b.posGoal ? 'selected' : ''}>Etiquetar</option></select>
      <label>Preguntar</label><div><label class="chk"><input type="checkbox" data-p="askTeam" ${b.askTeam !== false ? 'checked' : ''}> equipo</label><br><label class="chk"><input type="checkbox" data-p="askPlayers" ${b.askPlayers ? 'checked' : ''}> jugadores</label></div>
      <label>Subcategorías</label><div><label class="chk"><input type="checkbox" data-p="showTags" ${b.showTags !== false ? 'checked' : ''}> mostrarlas dentro del botón</label><div class="row tiny">por fila <input type="number" min="1" max="6" data-p="tagsPerRow" value="${b.tagsPerRow || 2}" style="width:56px"></div></div>
      ` : ''}
      ${b.type === 'score' ? `<label>Puntos</label><input type="number" data-p="points" value="${b.points ?? 1}">` : ''}
      ${b.type === 'timer' ? `<label>Equipo</label><select data-p="team"><option value="">—</option><option value="home" ${b.team === 'home' ? 'selected' : ''}>Local</option><option value="away" ${b.team === 'away' ? 'selected' : ''}>Visitante</option></select>` : ''}
      <label>Enlaces</label><select id="links" multiple size="4" title="Al pulsar este botón se activan también estos (Ctrl+clic para varios)">${others.map(o => `<option value="${o.id}" ${b.links?.includes(o.id) ? 'selected' : ''}>${esc(o.name)} (${BTN_TYPES[o.type].split(' ')[0]})</option>`).join('')}</select>
    </div>
    ${b.type === 'event' || b.type === 'score' || b.type === 'card' ? `<div class="sect"><div class="row"><div class="sect-t grow">Subcategorías / etiquetas</div><button class="small" id="addgrp">+ Grupo</button></div>
      ${(b.groups || []).map((g, gi) => `<div class="taggroup" data-g="${gi}"><div class="row"><input type="text" data-gn value="${esc(g.name)}" class="grow" placeholder="Nombre del grupo"><button class="small danger" data-gdel>✕</button></div>
      <input type="text" data-gt value="${esc(g.tags.join(', '))}" style="width:100%;margin-top:4px" placeholder="Etiquetas separadas por coma"></div>`).join('')}
      <p class="tiny">Ej.: grupo "Resultado" con "Correcto, Fallo". En la ventana de etiquetado se eligen con las teclas 1-9.</p></div>` : ''}
    <div class="row sect"><button class="small" id="dupb">Duplicar</button><button class="small danger" id="delb">Borrar botón</button></div>`;
    $$('[data-p]', props).forEach(inp => inp.oninput = inp.onchange = () => {
      const p = inp.dataset.p; let v = inp.type === 'checkbox' ? inp.checked : inp.value;
      if (['w', 'h', 'points', 'tagsPerRow'].includes(p)) v = +v || 0;
      if (['posField', 'posHalf', 'posGoal'].includes(p)) { v = !!inp.value; if (p === 'posField') b.askPosition = v; }
      if (['lead', 'lag'].includes(p)) v = inp.value === '' ? null : +inp.value;
      if (p === 'team') v = v || null;
      b[p] = v; if (p === 'color') b.textColor = textColorFor(v);
      drawCanvas(); if (p === 'color') drawProps();
    });
    const hk = $('#hk', props);
    hk.onkeydown = e => {
      e.preventDefault(); e.stopPropagation(); const k = keyFromEvent(e); if (!k) return;
      if (RESERVED_KEYS.includes(k)) return toast('Esa tecla está reservada para la reproducción', 'warn');
      const dup = work.buttons.find(x => x !== b && x.hotkey === k); if (dup) toast(`El atajo ${hotkeyLabel(k)} lo usaba "${dup.name}" (se quitó)`, 'warn'), dup.hotkey = '';
      b.hotkey = k; hk.value = hotkeyLabel(k); drawCanvas();
    };
    $('#hkclr', props).onclick = () => { b.hotkey = ''; hk.value = ''; drawCanvas(); };
    $('#links', props).onchange = e => b.links = Array.from(e.target.selectedOptions).map(o => o.value);
    const ag = $('#addgrp', props); if (ag) ag.onclick = () => { (b.groups = b.groups || []).push({ name: 'Grupo', tags: ['Opción 1', 'Opción 2'] }); drawProps(); };
    $$('.taggroup', props).forEach(g => {
      const gi = +g.dataset.g;
      $('[data-gn]', g).oninput = e => b.groups[gi].name = e.target.value;
      $('[data-gt]', g).oninput = e => b.groups[gi].tags = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
      $('[data-gdel]', g).onclick = () => { b.groups.splice(gi, 1); drawProps(); };
    });
    $('#dupb', props).onclick = () => { const n = deep(b); n.id = uid(); n.x += 20; n.y += 20; n.hotkey = ''; work.buttons.push(n); sel = n.id; drawCanvas(); drawProps(); };
    $('#delb', props).onclick = () => { work.buttons = work.buttons.filter(x => x !== b); work.buttons.forEach(x => x.links = (x.links || []).filter(l => l !== b.id)); sel = null; drawCanvas(); drawProps(); };
  };
  // arrastre
  canvas.addEventListener('pointerdown', e => {
    const el = e.target.closest('.dbtn'); if (!el) { sel = null; drawCanvas(); drawProps(); return; }
    const b = work.buttons.find(x => x.id === el.dataset.id); sel = b.id;
    const resize = e.target.classList.contains('rs'); const sx = e.clientX, sy = e.clientY, ox = b.x, oy = b.y, ow = b.w, oh = b.h;
    const mv = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (resize) { b.w = Math.max(40, Math.round((ow + dx) / 10) * 10); b.h = Math.max(30, Math.round((oh + dy) / 10) * 10); }
      else { b.x = Math.max(0, Math.round((ox + dx) / 10) * 10); b.y = Math.max(0, Math.round((oy + dy) / 10) * 10); }
      const n = canvas.querySelector(`[data-id="${b.id}"]`); n.style.left = b.x + 'px'; n.style.top = b.y + 'px'; n.style.width = b.w + 'px'; n.style.height = b.h + 'px';
    };
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); drawCanvas(); drawProps(); };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
    drawCanvas(); drawProps();
  });
  $$('[data-add]', body).forEach(btn => btn.onclick = () => {
    const t = btn.dataset.add; const y = Math.max(10, ...work.buttons.map(b => b.y + b.h + 10).concat([10]));
    const colors = { event: '#3b82f6', tag: '#cbd5e1', score: '#16a34a', card: '#facc15', timer: '#8b5cf6' };
    const b = mkBtn(t, { event: 'Nueva categoría', tag: 'Etiqueta', score: 'Gol', card: 'Tarjeta', timer: 'Cronómetro' }[t], colors[t], 10, y);
    if (t === 'event') b.groups = [RES_GROUP()];
    work.buttons.push(b); sel = b.id; drawCanvas(); drawProps();
  });
  const redrawBg = () => { $$('.de-bg', body).forEach(t => { const k = t.dataset.bg; t.querySelector('img').src = dashBg(work, k); }); };
  $$('[data-bg]', body).forEach(t => t.onclick = async e => {
    if (e.target.closest('[data-bgreset]')) { delete work.bg[t.dataset.bg]; redrawBg(); e.target.closest('[data-bgreset]').remove(); return; }
    const f = await pickFile('image/*'); if (!f) return; work.bg = work.bg || {}; work.bg[t.dataset.bg] = await resizeImage(f, 1200); redrawBg(); toast('Fondo actualizado: ' + POS_KINDS[t.dataset.bg]);
  });
  $('#de-name', body).oninput = e => work.name = e.target.value;

  $('#de-periods', body).oninput = e => work.periods = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
  $('#de-popup', body).onchange = e => work.disablePopup = e.target.checked;
  drawCanvas(); drawProps();
  return modal({ title: projectCtx ? 'Editar panel de este proyecto' : 'Editar panel', wide: true, body, sticky: true,
    buttons: [{ label: 'Cancelar', value: false }, { label: 'Guardar', cls: 'primary', onClick: async () => {
      if (!work.periods.length) work.periods = ['1'];
      Object.keys(d).forEach(k => delete d[k]); Object.assign(d, work); d.builtin = false; await onSave(); toast('Panel guardado'); return true;
    } }] });
}

}

async function buildVideos() {

      el.muted = i !== 0; el.dataset.cam = i; applyCrop(el, c.crop);
      el.addEventListener('loadedmetadata', () => { if (i === 0 && (!p.duration || Math.abs(p.duration - el.duration) > 1)) { p.duration = el.duration; markDirty(); } fitTimeline(); resizeOverlay(); });
      // vídeos largos / en OneDrive o disco externo: a veces la primera carga se queda sin imagen → reintentar solo
      let tries = 0; const MAX = 8;
      const msg = on => { const vm = $('#videoMain'); let m = $('#vidLoading'); if (on && i === 0) { if (!m && vm) { m = document.createElement('div'); m.id = 'vidLoading'; vm.appendChild(m); } if (m) m.innerHTML = `⏳ Cargando el vídeo${tries ? ` (reintento ${tries})` : ''}…<br><span class="tiny">Si es largo, está en OneDrive o en un disco externo, puede tardar unos segundos.</span>`; } else if (!on && i === 0 && m) m.remove(); };
      const retry = () => {

        tries++; msg(true); const src = VIDEO_URLS[c.id]; const t0 = el.currentTime || 0;
        el.removeAttribute('src'); el.load(); el.src = src; el.load(); if (t0) el.addEventListener('loadedmetadata', () => { try { el.currentTime = t0; } catch (e) { } }, { once: true });
        setTimeout(retry, 3000 + tries * 1500);

      el.addEventListener('error', () => { if (tries < MAX) setTimeout(retry, 1200); else toast(`No se puede reproducir "${c.fileName}". Probá convertirlo a MP4 (H.264).`, 'bad'); });

/* ---------------- Bucle principal ---------------- */
function tick() {

function scaleDash() {

function timerRunning(id) { const T = ST.p.timers[id]; return T && T.nodes.length && T.nodes[T.nodes.length - 1].stop == null; }
function timerTotal(id, t) { const T = ST.p.timers[id]; if (!T) return 0; return T.nodes.reduce((a, n) => a + ((n.stop == null ? t : n.stop) - n.start), 0); }

async function finishManual(b, t, preset = null) {
  let s = ST.pending[b.id]; if (s == null) return; const pt = preset || (ST.pendingTag || {})[b.id];
  const log = (ST.recRates || {})[b.id] || []; delete ST.pending[b.id]; if (ST.pendingTag) delete ST.pendingTag[b.id]; if (ST.recRates) delete ST.recRates[b.id];
  refreshButtonStates(); let e = t; if (e < s) [s, e] = [e, s]; if (e - s < 0.5) e = s + 0.5;
  const ev = await createEvent(b, s, e, s, false, pt);
  // tramos de velocidad: solo si cambiaste la velocidad durante la grabación (si fue siempre igual, no se guarda nada)
  if (ev && log.length > 1 && isFileMode()) {
    const segs = []; for (const g of log) { const tt = clamp(g.t, s, e); if (segs.length && Math.abs(segs[segs.length - 1].t - tt) < 0.05) segs[segs.length - 1].r = g.r; else if (!segs.length || segs[segs.length - 1].r !== g.r) segs.push({ t: tt, r: g.r }); }
    if (segs.length) segs[0].t = s;
    if (segs.some(g => g.r !== 1)) { ev.rateSegs = segs; ev.speed = 1; markDirty(); toast(`🎚 Velocidad guardada en la jugada: ${segs.map(g => g.r + 'x').join(' → ')}`); }
  }
}
function cancelManual(id) { delete ST.pending[id]; if (ST.pendingTag) delete ST.pendingTag[id]; if (ST.recRates) delete ST.recRates[id]; refreshButtonStates(); toast('Grabación de la jugada cancelada'); }
function renderRecBar(t) {

  if (!ids.length) { if (box.innerHTML) box.innerHTML = ''; return; }
  const key = ids.join(',');
  if (box.dataset.k !== key || !box.innerHTML) {
    box.dataset.k = key;
    box.innerHTML = ids.map(id => { const b = ST.p.dashboard.buttons.find(x => x.id === id); return `<div class="recrow" data-id="${id}"><span class="recdot"></span><b>GRABANDO</b> <span class="recnm">${esc(b ? b.name : '?')}</span> <span class="rectime" data-rt>0:00</span><span class="recspd" data-rs></span><button class="small recstop" data-stop="${id}">■ Terminar</button><button class="small" data-cancel="${id}" title="Cancelar (Esc)">✕</button></div>`; }).join('');
    box.onclick = async e => { const st = e.target.closest('[data-stop]'), cc = e.target.closest('[data-cancel]');
      if (st) { const b = ST.p.dashboard.buttons.find(x => x.id === st.dataset.stop); if (b) await finishManual(b, getTime()); renderRecBar(getTime()); }
      if (cc) { cancelManual(cc.dataset.cancel); renderRecBar(getTime()); } };
  }
  for (const row of box.querySelectorAll('.recrow')) { const s0 = ST.pending[row.dataset.id]; if (s0 == null) continue; row.querySelector('[data-rt]').textContent = fmt(Math.max(0, t - s0), false);
    const lg = (ST.recRates || {})[row.dataset.id]; row.querySelector('[data-rs]').textContent = lg && lg.length > 1 ? '🎚 ' + lg.map(g => g.r + 'x').filter((v, i, a) => i === 0 || v !== a[i - 1]).join('→') : ''; }
}

async function pressButton(b, visited = new Set(), preset = null) {
  if (!ST.p || visited.has(b.id)) return; visited.add(b.id);
  const t = getTime();
  if ((ST.p.mode === 'live' || ST.p.mode === 'clock') && !ST.clock.running && b.type !== 'tag') { toast('Iniciá la grabación / el reloj para etiquetar', 'warn'); return; }
  if (b.type === 'tag') {
    if (ST.activeTags.has(b.id)) ST.activeTags.delete(b.id); else ST.activeTags.add(b.id);
    // si hay un evento recién creado (últimos 3 s) se le añade la etiqueta directamente
    const last = ST.p.events[ST.p.events.length - 1];
    if (ST.activeTags.has(b.id) && last && Date.now() - last.created < 3000 && !last.tags.some(x => x.value === b.name)) {
      last.tags.push({ group: '', value: b.name }); ST.activeTags.delete(b.id); markDirty(); renderSide(); toast(`Etiqueta "${b.name}" añadida a ${last.name}`);
    } else toast(ST.activeTags.has(b.id) ? `Etiqueta "${b.name}" activa para el próximo evento` : `Etiqueta "${b.name}" desactivada`);
    refreshButtonStates();
  } else if (b.type === 'timer') {
    const T = ST.p.timers[b.id] = ST.p.timers[b.id] || { nodes: [] };
    if (timerRunning(b.id)) { T.nodes[T.nodes.length - 1].stop = t; toast(`⏱ ${b.name} detenido (${fmt(timerTotal(b.id, t), false)})`); }
    else {
      // posesiones excluyentes: al iniciar la del local se detiene la del visitante
      if (b.team) for (const o of ST.p.dashboard.buttons) if (o.type === 'timer' && o.team && o.team !== b.team && timerRunning(o.id)) ST.p.timers[o.id].nodes.slice(-1)[0].stop = t;
      T.nodes.push({ start: t, stop: null }); toast(`⏱ ${b.name} en marcha`);
    }
    markDirty(); refreshButtonStates();
  } else {
    if (tagModeOf(b) === 'free') {
      ST.pendingTag = ST.pendingTag || {}; ST.recRates = ST.recRates || {};
      if (ST.pending[b.id] == null) { ST.pending[b.id] = t; ST.pendingTag[b.id] = preset; ST.recRates[b.id] = [{ t, r: isFileMode() ? (+$('#rateSel').value || 1) : 1 }]; refreshButtonStates(); toast(`● Grabando ${b.name}${preset ? ' · ' + preset.value : ''} desde ${fmt(t)} — pulsá de nuevo (o ■ Terminar) para cerrar`); }
      else { await finishManual(b, t, preset); }
    } else {
      const lead = b.lead ?? SETTINGS.lead, lag = b.lag ?? SETTINGS.lag;
      await createEvent(b, Math.max(0, t - lead), t + lag, t, visited.size > 1, preset);
    }
  }
  for (const id of b.links || []) { const o = ST.p.dashboard.buttons.find(x => x.id === id); if (o) await pressButton(o, visited); }
}
async function createEvent(b, start, stop, evTime, fromLink = false, preset = null) {
  const ev = { id: uid(), catId: b.id, kind: b.type, name: b.name, color: b.color, start, stop, eventTime: evTime, tags: [], team: b.team || null, players: [], pos: null, notes: '', drawings: [], period: ST.p.period, created: Date.now() };
  if (b.type === 'score') ev.points = b.points ?? 1;
  for (const id of ST.activeTags) { const tb = ST.p.dashboard.buttons.find(x => x.id === id); if (tb) ev.tags.push({ group: '', value: tb.name }); }
  ST.activeTags.clear();
  if (preset) ev.tags.push({ group: preset.group, value: preset.value });

  const fast = SETTINGS.fastTagging || ST.p.dashboard.disablePopup || fromLink || ST.remoteTag;
  if (needs && !fast) {

    const ok = await eventDialog(ev, b, true);

  if (b.type === 'score') renderScore();

}

    $$('[data-tag]', body).forEach(c => c.onclick = () => toggleTag(+c.dataset.tag));

    ] }).then(async r => {

}
function deleteEvent(ev) {
  ST.p.events = ST.p.events.filter(x => x !== ev);
  if (ST.sel === ev.id) ST.sel = null; if (ST.playingEv === ev) ST.playingEv = null;
  markDirty(); renderSide(); renderScore(); refreshButtonStates();
}
function playEvent(ev, fromPl = false) {
  if (!isFileMode() && ST.p.mode === 'live' && liveHasRec()) { liveReview(ev); return; }
  if (!isFileMode()) { toast('Para reproducir hace falta el vídeo', 'warn'); return; }
  if (!fromPl) ST.plPlay = null;
  endHold(false);
  ST.sel = ev.id; ST.playingEv = ev; ST.shown.clear();
  seek(ev.start); play();
  highlightSel();
  const vis = $('#tlBox').clientWidth / ST.tl.pps;
  if (ev.start < ST.tl.t0 || ev.start > ST.tl.t0 + vis * 0.9) ST.tl.t0 = Math.max(0, ev.start - vis * 0.1);
}
function stepEvent(dir) {
  const list = filteredEvents().sort((a, b) => a.start - b.start); if (!list.length) return;
  const t = getTime(); let ev;
  if (dir > 0) ev = list.find(e => e.start > t + 0.3) || list[0];
  else ev = [...list].reverse().find(e => e.start < t - 1) || list[list.length - 1];
  playEvent(ev);
}

      case 'ellipse': { ctx.beginPath(); ctx.ellipse((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, Math.abs(b[0] - a[0]) / 2, Math.abs(b[1] - a[1]) / 2, 0, 0, Math.PI * 2); if (s.fill) { ctx.globalAlpha = 0.3; ctx.fill(); ctx.globalAlpha = 1; } ctx.stroke(); break; }
      case 'area': { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath(); ctx.globalAlpha = 0.3; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke(); break; }
      case 'text': { const fs = s.size * k * 1.2 + 6; ctx.font = `700 ${fs}px system-ui`; const lines = String(s.text).split('\n'); const w = Math.max(...lines.map(l => ctx.measureText(l).width)); ctx.shadowBlur = 0;
        const lh = fs * 1.3; let y0 = a[1]; if (y0 + lh * (lines.length - 1) > r.y + r.h - 4) y0 = r.y + r.h - 4 - lh * (lines.length - 1);
        ctx.fillStyle = '#000000b0'; ctx.fillRect(a[0] - 6, y0 - fs, w + 12, lh * lines.length); ctx.fillStyle = s.color; ctx.textBaseline = 'alphabetic'; lines.forEach((l, i) => ctx.fillText(l, a[0], y0 + fs * 0.12 + i * lh)); break; }
      case 'counter': { const R = 14 * k + 8; ctx.beginPath(); ctx.arc(a[0], a[1], R, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = textColorFor(s.color); ctx.font = `800 ${R * 1.2}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowBlur = 0; ctx.fillText(s.n, a[0], a[1] + 1); break; }
      case 'cross': { const R = 14 * k + 6; ctx.lineWidth *= 1.5; ctx.beginPath(); ctx.moveTo(a[0] - R, a[1] - R); ctx.lineTo(a[0] + R, a[1] + R); ctx.moveTo(a[0] + R, a[1] - R); ctx.lineTo(a[0] - R, a[1] + R); ctx.stroke(); break; }

      }

        [a, b].forEach(p => { ctx.beginPath(); ctx.moveTo(p[0] + Math.cos(ang) * tk, p[1] + Math.sin(ang) * tk); ctx.lineTo(p[0] - Math.cos(ang) * tk, p[1] - Math.sin(ang) * tk); ctx.stroke(); });
        const L = normLen(s.pts[0], s.pts[1]); const txt = ST.p && ST.p.calib ? (L * ST.p.calib).toFixed(1) + ' m' : (L * 100).toFixed(0) + ' u';
        label(ctx, txt, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 10, k, s.color); break;
      }
      case 'measure': {
        ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); ctx.setLineDash([]);

        [a, b].forEach(p => { ctx.beginPath(); ctx.moveTo(p[0] + Math.cos(ang) * tk, p[1] + Math.sin(ang) * tk); ctx.lineTo(p[0] - Math.cos(ang) * tk, p[1] - Math.sin(ang) * tk); ctx.stroke(); });
        const m = Math.hypot((s.pts[1].x - s.pts[0].x) * (s.lx || 100), (s.pts[1].y - s.pts[0].y) * (s.ly || 66));
        label(ctx, m.toFixed(1) + ' m', (a[0] + b[0]) / 2 + 6, (a[1] + b[1]) / 2 - 8, k, '#ffffff'); break;
      }
      case 'spot': {
        ctx.shadowBlur = 0; ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h);
        ctx.ellipse((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, Math.abs(b[0] - a[0]) / 2 + 1, Math.abs(b[1] - a[1]) / 2 + 1, 0, 0, Math.PI * 2, true);

      }
