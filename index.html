        ctx.setLineDash([8 * k + 3, 6 * k + 3]); ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.stroke(); ctx.setLineDash([]);
        const R = 12 * k + 6; pts.forEach(p => { ctx.beginPath(); ctx.ellipse(p[0], p[1], R, R * 0.45, 0, 0, Math.PI * 2); ctx.globalAlpha = 0.35; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke(); }); break;
      }
      case 'player': {
        const R = 14 * k + 8; ctx.beginPath(); ctx.ellipse(a[0], a[1], R * 1.3, R * 0.5, 0, 0, Math.PI * 2); ctx.globalAlpha = 0.45; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
        const fs = 13 * k + 8; ctx.font = `700 ${fs}px system-ui`; const tw = ctx.measureText(s.label).width; const by = a[1] - R * 3.2; const ph = s.photo ? fs * 1.6 : 0;
        ctx.shadowBlur = 0; ctx.fillStyle = '#000000c0'; ctx.fillRect(a[0] - tw / 2 - 8 - ph / 2, by - fs, tw + 16 + ph, fs * 1.6);
        if (s.photo) { try { ctx.drawImage(imgFor(s.photo), a[0] - tw / 2 - 6 - ph / 2, by - fs + 1, ph - 2, fs * 1.6 - 2); } catch (e) { } }
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s.label, a[0] + ph / 2, by - fs * 0.2);
        ctx.strokeStyle = s.color; ctx.beginPath(); ctx.moveTo(a[0], by + fs * 0.6); ctx.lineTo(a[0], a[1] - R * 0.5); ctx.stroke(); break;
      }
      case 'image': { const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]), w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]); const im = imgFor(s.src); ctx.shadowBlur = 0; if (im.complete) ctx.drawImage(im, x, y, w, h); else im.onload = () => DRAW.active && drawRedraw(); break; }
    }
    if (idx === selIdx) { const bb = shapeBBox(s); ctx.setLineDash([5, 4]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.shadowBlur = 0; ctx.strokeRect(r.x + bb.x1 * r.w - 6, r.y + bb.y1 * r.h - 6, (bb.x2 - bb.x1) * r.w + 12, (bb.y2 - bb.y1) * r.h + 12); }

}
function label(ctx, txt, x, y, k, color) {
  const fs = 13 * k + 8; ctx.font = `700 ${fs}px system-ui`; const w = ctx.measureText(txt).width; ctx.shadowBlur = 0;

}

/* --------- Captura PNG del cuadro actual con dibujos --------- */
function exportSnapshot(withDrawing) {
  const m = master(); const v = m ? m.el : ST.liveEl; if (!v || !v.videoWidth) return toast('No hay imagen de vídeo', 'warn');
  const vc = vcrop(v); const c = document.createElement('canvas'); c.width = Math.round(vc.sw); c.height = Math.round(vc.sh); const ctx = c.getContext('2d');
  ctx.drawImage(v, vc.sx, vc.sy, vc.sw, vc.sh, 0, 0, c.width, c.height);
  const shapes = DRAW.active ? DRAW.shapes : ST.hold ? ST.hold.d.shapes : [];
  if (withDrawing !== false && shapes.length) renderShapes(ctx, shapes, { x: 0, y: 0, w: c.width, h: c.height }, v);
  c.toBlob(b => download(safeName(ST.p.name) + '_' + fmt(getTime()).replace(/[:.]/g, '-') + '.png', b), 'image/png');
}

/* =========================================================
   Playlists, presentaciones y exportación de vídeo
   ========================================================= */
function resolveItem(it) {
  if (it.type !== 'event') return { it };
  const p = (ST.p && ST.p.id === it.projectId) ? ST.p : APP.projects.find(x => x.id === it.projectId);
  const ev = p && p.events.find(e => e.id === it.eventId);
  return { it, p, ev };
}
function itemLabel(it) {
  if (it.type === 'title') return '🅣 ' + (it.text || 'Título');
  if (it.type === 'image') return '🖼 Imagen ' + (it.duration || 4) + ' s';
  if (it.type === 'board') { const b = (APP.boards || []).find(x => x.id === it.boardId); return b ? '🧩 Pizarra: ' + esc(b.name) : '⚠ Pizarra borrada'; }
  const { p, ev } = resolveItem(it);
  if (!ev) return '⚠ Jugada no encontrada';
  return `${esc(ev.name)} <small class="muted">${fmt(ev.start)} ${ev.tags.map(t => esc(t.value)).join(' · ')}${p.id !== (ST.p && ST.p.id) ? ' · ' + esc(p.name) : ''}</small>`;
}
function renderPlaylistTab() {
  const el = $('#st-playlists');
  if (!ST.plSel || !APP.playlists.some(x => x.id === ST.plSel)) ST.plSel = APP.playlists[0]?.id || null;
  const pl = APP.playlists.find(x => x.id === ST.plSel);
  el.innerHTML = `<div class="row" style="margin-bottom:8px"><select id="plSel" class="grow">${APP.playlists.map(x => `<option value="${x.id}" ${x.id === ST.plSel ? 'selected' : ''}>${esc(x.name)} (${x.items.length})</option>`).join('')}</select><button class="small" id="plNew">+ Nueva</button>${pl ? '<button class="small" id="plRen">✎</button><button class="small danger" id="plDel">🗑</button>' : ''}</div>
  ${pl ? `<div class="row" style="margin-bottom:8px"><button class="small primary" id="plPlay">▶ Reproducir</button><button class="small" id="plRender">🎬 Exportar vídeo</button><button class="small" id="plTitle">+ Título</button><button class="small" id="plImg">+ Imagen</button><button class="small" id="plBoard">+ Pizarra</button><button class="small" id="plSel2">+ Evento seleccionado</button></div>
  <div id="plItems">${pl.items.map((it, i) => `<div class="pl-item ${ST.plPlay && ST.plPlay.pl.id === pl.id && ST.plPlay.idx === i ? 'playing' : ''}" draggable="true" data-i="${i}"><span class="h">⠿</span><span class="grow">${i + 1}. ${itemLabel(it)}</span><button class="ib small ghost" data-play="${i}">▶</button><button class="ib small ghost" data-rm="${i}">✕</button></div>`).join('') || '<div class="empty">Añadí jugadas con ＋ desde la lista de eventos.</div>'}</div>
  <p class="tiny">Arrastrá para reordenar. Las playlists pueden mezclar partidos: gestionalas también desde "Presentaciones" en la pantalla de inicio.</p>`
    : '<div class="empty">Creá una playlist para armar presentaciones para tus jugadores.</div>'}`;
  $('#plNew', el).onclick = async () => { const n = await promptBox('Nueva playlist', 'Playlist ' + (APP.playlists.length + 1)); if (!n) return; const p = { id: uid(), name: n, items: [] }; APP.playlists.push(p); await savePlaylist(p); ST.plSel = p.id; renderPlaylistTab(); };
  const sel = $('#plSel', el); if (sel) sel.onchange = () => { ST.plSel = sel.value; renderPlaylistTab(); };
  if (!pl) return;
  $('#plRen', el).onclick = async () => { const n = await promptBox('Renombrar', pl.name); if (n) { pl.name = n; await savePlaylist(pl); renderPlaylistTab(); } };
  $('#plDel', el).onclick = async () => { if (await confirmBox('¿Borrar la playlist?', 'Borrar', true)) { APP.playlists = APP.playlists.filter(x => x !== pl); await DB.del('playlists', pl.id); renderPlaylistTab(); } };
  $('#plPlay', el).onclick = () => startPlaylistPlayback(pl);
  $('#plRender', el).onclick = () => renderDialog(pl.items, pl.name);
  $('#plTitle', el).onclick = async () => { const it = await titleItemDialog(); if (it) { pl.items.push(it); await savePlaylist(pl); renderPlaylistTab(); } };
  $('#plImg', el).onclick = async () => { const f = await pickFile('image/*'); if (!f) return; pl.items.push({ id: uid(), type: 'image', src: await resizeImage(f, 1920), duration: 4 }); await savePlaylist(pl); renderPlaylistTab(); };
  $('#plBoard', el).onclick = async () => {
    if (!APP.boards) await loadBoards(); if (!APP.boards.length) return toast('Todavía no hay pizarras', 'warn');
    const id = await modal({ title: 'Añadir pizarra animada', narrow: true, body: `<select id="pb-s" style="width:100%">${APP.boards.map(b => `<option value="${b.id}">${esc((b.category ? b.category + ' / ' : '') + b.name)}</option>`).join('')}</select>`, buttons: [{ label: 'Cancelar' }, { label: 'Añadir', cls: 'primary', onClick: m => $('#pb-s', m).value }] });
    if (!id) return; pl.items.push({ id: uid(), type: 'board', boardId: id }); await savePlaylist(pl); renderPlaylistTab();
  };
  $('#plSel2', el).onclick = async () => { const ev = ST.p.events.find(e => e.id === ST.sel); if (!ev) return toast('Seleccioná un evento primero', 'warn'); pl.items.push({ id: uid(), type: 'event', projectId: ST.p.id, eventId: ev.id }); await savePlaylist(pl); renderPlaylistTab(); };
  $$('[data-rm]', el).forEach(b => b.onclick = async () => { pl.items.splice(+b.dataset.rm, 1); await savePlaylist(pl); renderPlaylistTab(); });
  $$('[data-play]', el).forEach(b => b.onclick = () => startPlaylistPlayback(pl, +b.dataset.play));
  let dragI = null;
  $$('.pl-item', el).forEach(n => {
    n.ondragstart = () => { dragI = +n.dataset.i; };
    n.ondragover = e => { e.preventDefault(); n.classList.add('drag-over'); };
    n.ondragleave = () => n.classList.remove('drag-over');
    n.ondrop = async e => { e.preventDefault(); const to = +n.dataset.i; if (dragI == null || dragI === to) return; const [m] = pl.items.splice(dragI, 1); pl.items.splice(to, 0, m); dragI = null; await savePlaylist(pl); renderPlaylistTab(); };
  });
}
async function titleItemDialog(it = {}) {
  return await modal({ title: 'Diapositiva de título', narrow: true, enterValue: true, body: `<div class="form"><label>Título</label><input type="text" id="tt-t" value="${esc(it.text || '')}" autofocus>
    <label>Subtítulo</label><input type="text" id="tt-s" value="${esc(it.sub || '')}"><label>Fondo</label><input type="color" id="tt-c" value="${esc(it.color || '#0f3d2a')}"><label>Duración (s)</label><input type="number" id="tt-d" value="${it.duration || 3}" min="1"></div>`,
    buttons: [{ label: 'Cancelar' }, { label: 'Añadir', cls: 'primary', onClick: m => ({ id: it.id || uid(), type: 'title', text: $('#tt-t', m).value, sub: $('#tt-s', m).value, color: $('#tt-c', m).value, duration: Math.max(1, +$('#tt-d', m).value || 3) }) }] });

async function addToPlaylistDialog(events) {
  if (!events.length) return toast('No hay eventos', 'warn');
  const res = await modal({ title: `Añadir ${events.length} jugada(s) a playlist`, narrow: true, body: `<div class="form"><label>Playlist</label><select id="ap-sel">${APP.playlists.map(x => `<option value="${x.id}" ${x.id === ST.plSel ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}<option value="__new">+ Nueva playlist…</option></select>
    <label>Nombre (si es nueva)</label><input type="text" id="ap-new" value="Playlist ${APP.playlists.length + 1}"></div>`,
    buttons: [{ label: 'Cancelar' }, { label: 'Añadir', cls: 'primary', onClick: m => ({ sel: $('#ap-sel', m).value, name: $('#ap-new', m).value }) }] });

async function editPlaylistDialog(pl) {
  const body = document.createElement('div');
  const draw = () => {
    body.innerHTML = `<div class="form"><label>Nombre</label><input type="text" id="ep-n" value="${esc(pl.name)}"></div><div class="sect">
    ${pl.items.map((it, i) => `<div class="pl-item"><span class="grow">${i + 1}. ${itemLabel(it)}</span><button class="small" data-up="${i}">↑</button><button class="small" data-dn="${i}">↓</button><button class="small danger" data-rm="${i}">✕</button></div>`).join('') || '<p class="muted">Vacía</p>'}
    <div class="row" style="margin-top:8px"><button class="small" id="ep-t">+ Título</button><button class="small" id="ep-i">+ Imagen</button></div></div>`;
    $('#ep-n', body).oninput = e => pl.name = e.target.value;

    $('#ep-i', body).onclick = async () => { const f = await pickFile('image/*'); if (f) { pl.items.push({ id: uid(), type: 'image', src: await resizeImage(f, 1920), duration: 4 }); draw(); } };
  };
  draw();
  await modal({ title: 'Editar playlist', body, buttons: [{ label: 'Listo', cls: 'primary' }] });
  await savePlaylist(pl);
}

/* ---------------- Reproducción de playlist dentro del análisis ---------------- */
function startPlaylistPlayback(pl, idx = 0) { ST.plPlay = { pl, idx: idx - 1 }; plNext(); }
function plNext() {
  const P = ST.plPlay; if (!P) return;
  hideTitleCard();
  P.idx++;
  if (P.idx >= P.pl.items.length) { ST.plPlay = null; ST.playingEv = null; pause(); toast('Fin de la playlist'); renderSide(); return; }
  const it = P.pl.items[P.idx];
  if (ST.p && $('#st-playlists').classList.contains('active')) renderPlaylistTab();
  if (it.type === 'title' || it.type === 'image') {
    pause(); ST.playingEv = null; showTitleCard(it);
    P.timer = setTimeout(() => { if (ST.plPlay === P) plNext(); }, (it.duration || 3) * 1000); return;
  }

          while (!cancelled) { const sec = (performance.now() - t0) / 1000; const { fi, t } = boardFrameAt(b, sec); drawBoardFrame(bctx, b, fi, t, bw, bh, true, true);
            drawBase(null, () => { const r = contentRect(W, H, bw, bh); cx.drawImage(bc, r.x, r.y, r.w, r.h); }); if (sec >= total) break; await sleep(1000 / 30); }
        }
      }
      else if (it.type === 'range') {
        const p = APP.projects.find(x => x.id === it.projectId) || ST.p;
        const fake = { id: '__range', name: '', start: it.from, stop: it.to, drawings: [], tags: [], players: [] };
        if (o.split) { curRec = newRecorder(); curRec.start(500); curRec.pause(); }
        const ok = await renderEvent(p, fake, { from: it.from, to: it.to });
        if (o.split && curRec) { const blob = await finishRecorder(curRec); curRec = null; if (ok && !cancelled) saved.push(await saveExport(`${outName}.${ext}`, blob, o.useDir)); }
      }
      else {
        const { p, ev } = resolveItem(it); if (!ev) { done++; continue; }
        if (o.split) { curRec = newRecorder(); curRec.start(500); curRec.pause(); }
        const ok = await renderEvent(p, ev);
        if (o.split && curRec) { const blob = await finishRecorder(curRec); curRec = null; if (ok && !cancelled) { clip++; saved.push(await saveExport(`${outName}_${String(clip).padStart(2, '0')}_${safeName(ev.name)}.${ext}`, blob, o.useDir)); } }
      }
      done++;
    }
    if (!o.split && curRec) { const blob = await finishRecorder(curRec); if (!cancelled) saved.push(await saveExport(`${outName}.${ext}`, blob, o.useDir)); }
    closeProg();
    const where = saved.length && saved[0].folder ? `en la carpeta "${saved[0].folder}"` : 'en tu carpeta de Descargas';
    window.__busy = false; if (cancelled) return null;
    toast(cancelled ? 'Exportación cancelada' : `✔ Vídeo exportado ${where}` + (saved.length > 1 ? ` (${saved.length} archivos)` : `: ${saved[0] ? saved[0].file : ''}`), cancelled ? 'warn' : '');
    if (saved.length && saved[0].dir) exportDoneBox(saved);
    return saved;
  } catch (e) { console.error(e); closeProg(); toast('Error al exportar: ' + e.message, 'bad'); return null; }
  finally { window.__busy = false; vid.pause(); vid.removeAttribute('src'); if (actx) actx.close(); stream.getTracks().forEach(t => t.stop()); }
}

/* ---------------- Serie de capturas de un evento (ZIP de PNG) ---------------- */
async function snapshotSeries(ev) {
  const step = parseFloat(String(await promptBox('Serie de capturas', '1', 'Cada cuántos segundos capturar un fotograma de la jugada:') || '').replace(',', '.'));
  if (!(step > 0)) return;
  const cam = ST.p.cameras[ST.mainCam] || ST.p.cameras[0]; const url = VIDEO_URLS[cam && cam.id]; if (!url) return toast('Falta el vídeo', 'warn');
  const v = document.createElement('video'); v.muted = true; v.src = url; await once(v, 'loadedmetadata'); v._crop = cam.crop || null;
  const vc = vcrop(v); const c = document.createElement('canvas'); c.width = Math.round(vc.sw); c.height = Math.round(vc.sh); const ctx = c.getContext('2d');
  const files = []; let n = 0;
  for (let t = ev.start; t <= ev.stop + 0.001; t += step) {
    v.currentTime = t + (+cam.offset || 0); await once(v, 'seeked'); ctx.drawImage(v, vc.sx, vc.sy, vc.sw, vc.sh, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/png')); files.push({ name: `${String(++n).padStart(3, '0')}_${fmt(t).replace(/[:.]/g, '-')}.png`, data: new Uint8Array(await blob.arrayBuffer()) });
  }
  download(safeName(ev.name) + '_capturas.zip', zipStore(files)); toast(`${n} capturas exportadas`);
}

function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
function computeStats(p) {
  const evs = p.events.filter(e => e.kind !== 'subst' && e.kind !== 'draw');
  const cats = catList(p).filter(c => c.id !== '__subst' && c.id !== '__draw').map(c => {
    const list = evs.filter(e => e.catId === c.id);
    const b = p.dashboard.buttons.find(x => x.id === c.id);
    const groups = {};
    list.forEach(e => e.tags.forEach(t => { const g = t.group || 'Etiquetas'; groups[g] = groups[g] || {}; groups[g][t.value] = groups[g][t.value] || { total: 0, home: 0, away: 0 }; groups[g][t.value].total++; if (e.team) groups[g][t.value][e.team]++; }));
    return { ...c, total: list.length, home: list.filter(e => e.team === 'home').length, away: list.filter(e => e.team === 'away').length, dur: list.reduce((a, e) => a + (e.stop - e.start), 0), groups, list, btn: b };
  }).filter(c => c.total);
  const end = Math.max(p.duration || 0, ...p.events.map(e => e.stop), ...Object.values(p.timers || {}).flatMap(T => T.nodes.map(n => n.stop || n.start)), 0);
  const timers = p.dashboard.buttons.filter(b => b.type === 'timer').map(b => {
    const T = (p.timers || {})[b.id]; const total = T ? T.nodes.reduce((a, n) => a + ((n.stop ?? end) - n.start), 0) : 0;
    return { id: b.id, name: b.name, team: b.team, color: b.color, total, count: T ? T.nodes.length : 0 };
  });
  const players = ['home', 'away'].flatMap(s => p[s].players.map(pl => {
    const list = evs.filter(e => e.players.includes(pl.id)); const byCat = {}; list.forEach(e => byCat[e.catId] = (byCat[e.catId] || 0) + 1);
    return { ...pl, side: s, total: list.length, byCat };
  })).filter(x => x.total);
  return { evs, cats, timers, players, score: scoreOf(p), end };
}

}

/* ---------------- Exportaciones ---------------- */
function eventRows(p) {

  const cats = catList(p);
  [...p.events].sort((a, b) => a.start - b.start).forEach(e => rows.push([
    cats.find(c => c.id === e.catId)?.name || e.name, e.name, fmt(e.start), fmt(e.stop), +(e.stop - e.start).toFixed(2), +e.start.toFixed(2), +e.stop.toFixed(2), e.period || '',
    e.team === 'home' ? p.home.name : e.team === 'away' ? p.away.name : '', e.players.map(id => playerLabel(playerById(id, p))).join(', '),
    e.tags.map(t => (t.group ? t.group + ': ' : '') + t.value).join(', '), e.pos ? +e.pos.x.toFixed(3) : '', e.pos ? +e.pos.y.toFixed(3) : '', e.points ?? '', (e.drawings || []).length, e.notes || '']));
  return rows;
}
function exportCSV(p = ST.p) { download(safeName(p.name) + '_eventos.csv', csvString(eventRows(p)), 'text/csv;charset=utf-8'); toast('CSV exportado'); }
function exportXLSX(p = ST.p) {

  const sum = [['Categoría', 'Total', p.home.name, p.away.name, 'Sin equipo', 'Duración total (s)']].concat(S.cats.map(c => [c.name, c.total, c.home, c.away, c.total - c.home - c.away, +c.dur.toFixed(1)]));
  const sub = [['Categoría', 'Grupo', 'Valor', 'Total', '% de la categoría', p.home.name, p.away.name]];
  S.cats.forEach(c => Object.entries(c.groups).forEach(([g, vals]) => Object.entries(vals).forEach(([v, n]) => sub.push([c.name, g, v, n.total, pct(n.total, c.total), n.home, n.away]))));

  const info = [['Campo', 'Valor'], ['Proyecto', p.name], ['Fecha', p.date || ''], ['Competición', p.competition || ''], ['Temporada', p.season || ''], ['Local', p.home.name], ['Visitante', p.away.name], ['Marcador', `${S.score.home} - ${S.score.away}`], ['Eventos', S.evs.length], ['Exportado', new Date().toLocaleString()]];
  download(safeName(p.name) + '_estadisticas.xlsx', xlsxBlob([{ name: 'Resumen', rows: info }, { name: 'Eventos', rows: eventRows(p) }, { name: 'Categorías', rows: sum }, { name: 'Subcategorías', rows: sub }, { name: 'Jugadores', rows: pls }, { name: 'Cronómetros', rows: tim }]));

function exportXML(p = ST.p) {
  const x = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let id = 0; const cats = catList(p);
  const inst = [...p.events].sort((a, b) => a.start - b.start).map(e => {
    const code = cats.find(c => c.id === e.catId)?.name || e.name;
    const labels = [...e.tags.map(t => ({ g: t.group || 'Etiqueta', v: t.value })), ...(e.team ? [{ g: 'Equipo', v: e.team === 'home' ? p.home.name : p.away.name }] : []), ...e.players.map(id2 => ({ g: 'Jugador', v: playerLabel(playerById(id2, p)) })), ...(e.period ? [{ g: 'Período', v: e.period }] : [])];
    return `  <instance>\n    <ID>${++id}</ID>\n    <start>${e.start.toFixed(2)}</start>\n    <end>${e.stop.toFixed(2)}</end>\n    <code>${x(code)}</code>\n${labels.map(l => `    <label>\n      <group>${x(l.g)}</group>\n      <text>${x(l.v)}</text>\n    </label>\n`).join('')}${e.pos ? `    <pos_x>${e.pos.x.toFixed(3)}</pos_x>\n    <pos_y>${e.pos.y.toFixed(3)}</pos_y>\n` : ''}${e.notes ? `    <free_text>${x(e.notes)}</free_text>\n` : ''}  </instance>`;
  }).join('\n');
  const rows = cats.map(c => { const [r, g, b] = hexToRgb(c.color); return `  <row>\n    <code>${x(c.name)}</code>\n    <R>${r * 257}</R>\n    <G>${g * 257}</G>\n    <B>${b * 257}</B>\n  </row>`; }).join('\n');
  download(safeName(p.name) + '_sportscode.xml', `<?xml version="1.0" encoding="utf-8"?>\n<file>\n <SESSION_INFO><start_time>${new Date().toISOString()}</start_time></SESSION_INFO>\n <ALL_INSTANCES>\n${inst}\n </ALL_INSTANCES>\n <ROWS>\n${rows}\n </ROWS>\n</file>\n`, 'application/xml');
  toast('XML exportado (compatible con Hudl Sportscode, Nacsport, Once, LongoMatch Pro)');
}
async function importXML() {
  const f = await pickFile('.xml'); if (!f) return; const p = ST.p;

    const doc = new DOMParser().parseFromString(await readText(f), 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('XML inválido');
    const colors = {}; doc.querySelectorAll('ROWS row').forEach(r => { const c = r.querySelector('code')?.textContent; const R = +r.querySelector('R')?.textContent || 0, G = +r.querySelector('G')?.textContent || 0, B = +r.querySelector('B')?.textContent || 0; if (c) colors[c] = '#' + [R, G, B].map(v => Math.round(v > 255 ? v / 257 : v).toString(16).padStart(2, '0')).join(''); });
    const insts = Array.from(doc.querySelectorAll('instance')); let n = 0; let newBtns = 0;

      const ev = { id: uid(), catId: b.id, kind: b.type, name: code, color: b.color, start: s + offset, stop: (isNaN(e) ? s + 5 : e) + offset, eventTime: s + offset, tags: [], team: null, players: [], pos: null, notes: it.querySelector('free_text')?.textContent || '', drawings: [], period: p.period, created: Date.now() };
      it.querySelectorAll('label').forEach(l => {
        const g = l.querySelector('group')?.textContent?.trim() || '', v = l.querySelector('text')?.textContent?.trim(); if (!v) return;
        if (/^(equipo|team)$/i.test(g)) { ev.team = v === p.home.name ? 'home' : v === p.away.name ? 'away' : null; if (ev.team) return; }
        if (/^(jugador|player)$/i.test(g)) { const pl = ['home', 'away'].flatMap(sd => p[sd].players.map(x => ({ ...x, side: sd }))).find(x => playerLabel(x) === v || x.name === v); if (pl) { ev.players.push(pl.id); ev.team = ev.team || pl.side; return; } }

      const px = parseFloat(it.querySelector('pos_x')?.textContent), py = parseFloat(it.querySelector('pos_y')?.textContent); if (!isNaN(px) && !isNaN(py)) ev.pos = { x: px, y: py };
      p.events.push(ev); n++;

}
async function importCSV() {
  const f = await pickFile('.csv,.txt'); if (!f) return; const p = ST.p;
  const txt = (await readText(f)).replace(/^﻿/, ''); const sep = (txt.split('\n')[0].match(/;/g) || []).length >= (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const parseLine = l => { const out = []; let cur = '', q = false; for (let i = 0; i < l.length; i++) { const ch = l[i]; if (q) { if (ch === '"' && l[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; } else if (ch === '"') q = true; else if (ch === sep) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(s => s.trim()); };
  const lines = txt.split(/\r?\n/).filter(Boolean).map(parseLine); const head = lines.shift().map(h => h.toLowerCase());
  const col = (...names) => head.findIndex(h => names.some(n => h.includes(n)));
  const ci = col('categor', 'category', 'name', 'nombre', 'code'), si = col('inicio (s)', 'start', 'inicio'), ei = col('fin (s)', 'stop', 'end', 'fin'), ti = col('etiqueta', 'tags');
  if (ci < 0 || si < 0) return toast('El CSV necesita columnas de categoría/nombre e inicio', 'bad');
  let n = 0;
  lines.forEach(r => {
    const code = r[ci]; const s = parseTime(r[si]); const e = ei >= 0 ? parseTime(r[ei]) : s + 5; if (!code || isNaN(s)) return;
    let b = p.dashboard.buttons.find(x => ['event', 'score', 'card'].includes(x.type) && x.name.toLowerCase() === code.toLowerCase());
    if (!b) { const y = Math.max(10, ...p.dashboard.buttons.map(x => x.y + x.h + 10)); b = mkBtn('event', code, '#3b82f6', 10, y); p.dashboard.buttons.push(b); }
    p.events.push({ id: uid(), catId: b.id, kind: b.type, name: code, color: b.color, start: s, stop: isNaN(e) ? s + 5 : e, eventTime: s, tags: ti >= 0 && r[ti] ? r[ti].split(',').map(v => { const [g, val] = v.includes(':') ? v.split(':') : ['', v]; return { group: g.trim(), value: (val || '').trim() }; }) : [], team: null, players: [], pos: null, notes: '', drawings: [], period: p.period, created: Date.now() });
    n++;
  });
  markDirty(); renderDashboardView(); renderSide(); resizeTimeline(); toast(`Importados ${n} eventos`);
}

function boardSize(b) {
  const v = b.view || b;
  if (v === 'half') return { W: 876, H: 720 };
  if (v === 'vertical') return { W: 600, H: 904 };
  if (v === 'image' && b.bgW) { const W = 1100; return { W, H: Math.round(W * b.bgH / b.bgW) }; }

}
/** Geometría del campo en metros para cada vista: conversión a lienzo y metros por unidad normalizada */
function fieldGeom(b, W, H) {
  const k = SPORT_M[b.sport] || 1;
  if (b.view === 'vertical') return { lx: 73 * k, ly: 110 * k, to: (xm, ym) => [(ym + 2.5) / 73 * W, H - (xm + 2.5) / 110 * H], field: true };

/** Posición final de un objeto en un paso (si hay grabación, el último punto) */
function endPos(b, fi, id) { const fr = b.frames[fi]; if (fr && fr.tracks && fr.tracks[id] && fr.tracks[id].length) { const l = fr.tracks[id][fr.tracks[id].length - 1]; return { x: l[1], y: l[2] }; } return framePos(b, fi, id); }
function bdPt(e) { const c = $('#bdCanvas'); const r = c.getBoundingClientRect(); return { x: clamp((e.clientX - r.left) / r.width, 0, 1), y: clamp((e.clientY - r.top) / r.height, 0, 1) }; }
function viewMap(b, fx, fy) {
  if (b.view === 'vertical') return { x: fy, y: 1 - fx };
  if (b.view === 'half') return { x: 1 - fy, y: clamp((fx - 0.455) / 0.545, 0.02, 0.98) };
  return { x: fx, y: fy };
}
function placeFormation(teamId, side, form) {
  const b = BD.b; const t = APP.teams.find(x => x.id === teamId); if (!t) return;
  const lines = String(form || '4-4-2').split(/[^0-9]+/).map(Number).filter(n => n > 0);
  const players = t.players.filter(p => p.active !== false).slice(0, 1 + lines.reduce((a, n) => a + n, 0)); if (!players.length) return toast('El equipo no tiene jugadores', 'warn');
  bdPush();
  const pts = [{ fx: 0.04, fy: 0.5 }];
  lines.forEach((n, li) => { const fx = 0.13 + (li + 0.5) * (0.33 / lines.length); for (let i = 0; i < n; i++) pts.push({ fx, fy: (i + 1) / (n + 1) }); });
  players.forEach((pl, i) => {
    const pp = pts[i] || { fx: 0.3, fy: 0.5 }; let fx = pp.fx, fy = pp.fy; if (side === 'away') { fx = 1 - fx; fy = 1 - fy; }
    if (b.view === 'half') { if (side === 'home') { fx = 1 - pp.fx; fy = 1 - pp.fy; } else { fx = i === 0 ? 0.47 : Math.min(0.9, 0.5 + (pp.fx - 0.13) * 1.15); fy = pp.fy; } }
    const o = { id: uid(), type: 'player', team: side, color: i === 0 ? '#facc15' : t.color, num: pl.number ?? i + 1, label: pl.name && !/^Jugador \d+$/.test(pl.name) ? pl.name.split(' ').slice(-1)[0] : '' };
    b.objects.push(o); b.frames[BD.frame].pos[o.id] = viewMap(b, fx, fy);
  });
  renderBoardSide(); bdChanged(); toast(`${players.length} jugadores de ${t.name} colocados`);
}
function objRadius(o) { return (OBJ_R[o.type] || 16) * (o.scale || 1) * (['ladder', 'wall', 'goal'].includes(o.type) ? 2 : 1) + 6; }
function hitObj(pt) {
  const b = BD.b; const { W, H } = boardSize(b);
  for (let i = b.objects.length - 1; i >= 0; i--) { const o = b.objects[i]; const p = framePos(b, BD.frame, o.id); if (!p) continue; if (Math.hypot((pt.x - p.x) * W, (pt.y - p.y) * H) <= objRadius(o)) return o; }
  return null;
}
function hitBShape(pt) {
  const fr = BD.b.frames[BD.frame];
  for (let i = fr.shapes.length - 1; i >= 0; i--) { const bb = shapeBBox(fr.shapes[i]); const m = 0.012; if (pt.x >= bb.x1 - m && pt.x <= bb.x2 + m && pt.y >= bb.y1 - m && pt.y <= bb.y2 + m) return i; }
  return -1;
}
function deleteBoardSel() {
  const b = BD.b; if (!BD.selIds.size && !BD.selShapes.size) return; bdPush();
  if (BD.selIds.size) { b.objects = b.objects.filter(o => !BD.selIds.has(o.id)); b.frames.forEach(f => { BD.selIds.forEach(id => { delete f.pos[id]; if (f.tracks) delete f.tracks[id]; }); }); }
  if (BD.selShapes.size) { const fr = b.frames[BD.frame]; fr.shapes = fr.shapes.filter((_, i) => !BD.selShapes.has(i)); }
  BD.selIds.clear(); BD.selShapes.clear(); renderBoardSide(); bdChanged();
}
function copySel() {
  const b = BD.b; const fr = b.frames[BD.frame];
  BD.clip = { objs: b.objects.filter(o => BD.selIds.has(o.id)).map(o => ({ o: deep(o), p: { ...framePos(b, BD.frame, o.id) } })), shapes: [...BD.selShapes].map(i => deep(fr.shapes[i])).filter(Boolean) };
  if (BD.clip.objs.length || BD.clip.shapes.length) toast(`Copiado: ${BD.clip.objs.length} elementos, ${BD.clip.shapes.length} trazos`);
}
function pasteClip() {

/* ============ Grabación de movimientos en tiempo real ============ */
function startRecording() {
  const b = BD.b; if (BD.playing) return;
  bdPush();
  const fr = b.frames[BD.frame];
  BD.rec = { t0: performance.now(), tracks: {}, start: {}, fi: BD.frame };
  b.objects.forEach(o => { const p = framePos(b, BD.frame, o.id); if (p) BD.rec.start[o.id] = { ...p }; });
  delete fr.tracks;
  BD.tool = 'select'; $$('#bdTools button').forEach(x => x.classList.toggle('on', x.dataset.bt === 'select'));
  const loop = () => { if (!BD.rec) return; recSample(); drawBoard(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  renderBoardSide(); toast('● Grabando: arrastrá jugadores y pelota como en la jugada real. Pulsá "■ Terminar" (o Espacio) al final.');
}
function recSample() {
  const R = BD.rec; if (!R) return; const b = BD.b; const fr = b.frames[R.fi]; const t = (performance.now() - R.t0) / 1000;
  BD.selIds.forEach(id => {
    const p = fr.pos[id]; if (!p) return; const tr = R.tracks[id] = R.tracks[id] || [];
    const last = tr[tr.length - 1]; if (last && t - last[0] < 0.03) return;
    if (!tr.length) { const s = R.start[id] || p; if (t > 0.05) tr.push([0, s.x, s.y]); }
    tr.push([+t.toFixed(3), +p.x.toFixed(4), +p.y.toFixed(4)]);
  });
}
function stopRecording() {
  const R = BD.rec; if (!R) return; BD.rec = null; const b = BD.b; const fr = b.frames[R.fi];
  const dur = Math.max(0.5, (performance.now() - R.t0) / 1000);
  const ids = Object.keys(R.tracks);
  if (!ids.length) { renderBoardSide(); drawBoard(); return toast('No se grabó ningún movimiento', 'warn'); }
  const final = {}; b.objects.forEach(o => { const p = framePos(b, R.fi, o.id); if (p) final[o.id] = { ...p }; });
  ids.forEach(id => { const tr = R.tracks[id]; const l = tr[tr.length - 1]; if (l[0] < dur) tr.push([+dur.toFixed(3), l[1], l[2]]); });
  Object.entries(R.start).forEach(([id, p]) => { fr.pos[id] = p; });
  fr.tracks = R.tracks; fr.dur = +dur.toFixed(2);
  if (!b.frames[R.fi + 1]) b.frames.push({ id: uid(), pos: final, shapes: [], dur: 2, note: '' });
  else b.objects.forEach(o => { if (R.tracks[o.id]) b.frames[R.fi + 1].pos[o.id] = final[o.id]; });
  renderBoardSide(); bdChanged(); toast(`● Grabación guardada en el paso ${R.fi + 1} (${dur.toFixed(1)} s). Pulsá ▶ para verla.`);
}

/* ============ Animación ============ */
async function playBoard(onFrame, target) {
  const b = BD.b; if (BD.rec) return stopRecording();
  const animated = b.frames.length > 1 || b.frames.some(f => f.tracks);
  if (!animated && !onFrame) return toast('Añadí pasos (+ Paso) o grabá movimientos (● Grabar) para animar', 'warn');
  BD.playing = true; BD.selIds.clear(); BD.selShapes.clear(); renderBoardSide();
  const c = target || $('#bdCanvas'); const ctx = c.getContext('2d'); const { W, H } = boardSize(b);
  const startF = 0; // siempre el recorrido completo, del paso 1 al último
  for (let i = startF; i < b.frames.length && BD.playing; i++) {
    BD.frame = i; const fr = b.frames[i]; const isLast = i === b.frames.length - 1 && !fr.tracks; const dur = fr.dur * 1000; const t0 = performance.now();
    while (BD.playing) {
      const t = Math.min(1, (performance.now() - t0) / dur);
      drawBoardFrame(ctx, b, i, isLast ? 0 : t, W, H, true, true); if (onFrame) onFrame();
      if (t >= 1) break; await new Promise(r => requestAnimationFrame(r));
    }
  }
  const ok = BD.playing; BD.playing = false; if (!target) { renderBoardSide(); drawBoard(); } return ok;
}

/** Dibuja la pizarra animada en el instante sec (para exportación de playlists) */
function boardFrameAt(b, sec) {
  let acc = 0; for (let i = 0; i < b.frames.length; i++) { const f = b.frames[i]; const last = i === b.frames.length - 1 && !f.tracks; const d = last ? 1.5 : +f.dur; if (sec < acc + d || i === b.frames.length - 1) return { fi: i, t: last ? 0 : clamp((sec - acc) / d, 0, 1) }; acc += d; }

}

/** Envía un fotograma a la pizarra. Con ev: el instante de la jugada; sin ev: el cuadro actual (y se vincula a la jugada que lo contiene, si hay). */

  const p = ST.p; const m = master(); if (!m) return toast('Hace falta el vídeo', 'warn');
  const tNow = getTime();
  if (!ev) ev = p.events.filter(e => e.kind !== 'draw' && tNow >= e.start && tNow <= e.stop).sort((a, b) => (a.stop - a.start) - (b.stop - b.start))[0] || null;
  const tFrame = atCurrent || !ev ? tNow : (ev.eventTime ?? ev.start);
  cancelEvPlay(); pause(); if (Math.abs(getTime() - tFrame) > 0.01) { seek(tFrame); await once(m.el, 'seeked').catch(() => { }); } await sleep(120);
  const v = m.el; const vc = vcrop(v); const k = Math.min(1, 1600 / vc.sw);
  const c = document.createElement('canvas'); c.width = Math.round(vc.sw * k); c.height = Math.round(vc.sh * k); c.getContext('2d').drawImage(v, vc.sx, vc.sy, vc.sw, vc.sh, 0, 0, c.width, c.height);
  const b = newBoard('football', 'image');
  b.bg = c.toDataURL('image/jpeg', 0.88); b.bgW = c.width; b.bgH = c.height;
  b.name = `${ev ? ev.name : 'Fotograma'} · ${p.name} ${fmt(tFrame, false)}`; b.category = 'Jugadas de partido';
  b.notes = ev ? [ev.tags.map(t => t.value).join(', '), ev.players.map(id => playerLabel(playerById(id))).join(', '), ev.notes].filter(Boolean).join('\n') : '';
  if (!APP.boards) await loadBoards(); APP.boards.push(b); await saveBoard(b); if (ev) { ev.boardId = b.id; markDirty(); } await saveNow();
  toast('Fotograma enviado a la pizarra: colocá jugadores y flechas encima'); openBoard(b, 'analysis');
}

function buildTemplate(tpl) {
  const b = newBoard('football', tpl.view); b.name = tpl.name; b.category = tpl.cat; b.sheet = { ...tpl.sheet }; b.notes = tpl.notes;
  const C = normCrop(tpl.crop); if (C) b.crop = { ...C };
  const tx = x => C ? (x - C.x) / C.w : x, ty = y => C ? (y - C.y) / C.h : y;
  // Las plantillas se escriben en coordenadas de cancha completa (arco rival a la derecha). En vista "media cancha" se rotan (arco abajo).
  const HALF = tpl.view === 'half', MIR = !!tpl.mirror;
  const P = (x, y) => { if (MIR) x = 1 - x; if (HALF) return { x: 1 - y, y: (110 * x - 50.05) / 59.95 }; return { x: tx(x), y: ty(y) }; };
  const UNP = q => { let x, y; if (HALF) { x = (q.y * 59.95 + 50.05) / 110; y = 1 - q.x; } else { x = C ? C.x + q.x * C.w : q.x; y = C ? C.y + q.y * C.h : q.y; } if (MIR) x = 1 - x; return [x, y]; };
  const ids = {}; let fr = b.frames[0];
  const add = (key, o, x, y) => { b.objects.push(o); fr.pos[o.id] = P(x, y); if (key) ids[key] = o.id; return o; };
  const k = {
    pl: (team, num, x, y) => add((team === 'home' ? 'h' : team === 'away' ? 'a' : 'g') + num, { id: uid(), type: 'player', team, color: team === 'home' ? '#1e6fd9' : team === 'away' ? '#e5484d' : '#facc15', num, label: '' }, x, y),
    formation: (team, pts, start = 1) => pts.forEach((p, i) => k.pl(team, i + start, ...p)),
    ball: (x, y) => add('ball', { id: uid(), type: 'ball' }, x, y),
    cone: (x, y) => add(null, { id: uid(), type: 'cone', color: '#ff7a00' }, x, y),
    obj: (type, x, y, rot = 0) => add(null, { ...makeObj(type, b), rot }, x, y),
    goal: (x, y, rot) => add(null, { id: uid(), type: 'goal', rot: (rot + (MIR ? 180 : 0) + (HALF ? 90 : 0)) % 360 }, x, y),
    zone: (n, x, y) => add(null, { id: uid(), type: 'zonenum', color: '#111111', num: n, scale: 0.8 }, x, y),
    rect: (x1, y1, x2, y2) => fr.shapes.push({ type: 'rect', pts: [P(x1, y1), P(x2, y2)], color: '#ffffff', width: 2, fill: true, st: 1 }),
    text: (x, y, t) => fr.shapes.push({ type: 'text', pts: [P(x, y)], text: t, color: '#ffeb3b', width: 3, size: 24, st: 1 }),
    arrow: (x1, y1, x2, y2, pass = false) => fr.shapes.push({ type: 'arrow', pts: [P(x1, y1), P(x2, y2)], color: pass ? '#ffffff' : '#ffeb3b', width: 4, dashed: pass }),
    wavy: (x1, y1, x2, y2) => fr.shapes.push({ type: 'wavy', pts: [P(x1, y1), P(x2, y2)], color: '#ffeb3b', width: 4 }),
    curve: pts => fr.shapes.push({ type: 'curve', pts: pts.map(([x, y]) => P(x, y)), color: '#ffeb3b', width: 4 }),
    run: (key, x, y) => { const p = framePos(b, b.frames.indexOf(fr), ids[key]); if (p) fr.shapes.push({ type: 'arrow', pts: [{ ...p }, P(x, y)], color: '#ffeb3b', width: 4 }); },
    step: () => { const pos = {}; b.objects.forEach(o => { const p = framePos(b, b.frames.length - 1, o.id); if (p) pos[o.id] = { ...p }; }); fr = { id: uid(), pos, shapes: [], dur: 2, note: '' }; b.frames.push(fr); },
    move: (key, x, y) => { if (ids[key]) fr.pos[ids[key]] = P(x, y); },
    note: t => { fr.note = t; },
    at: key => { const q = framePos(b, b.frames.indexOf(fr), ids[key]); return q ? UNP(q) : [0.5, 0.5]; },
    go: (key, x, y) => { const [sx, sy] = k.at(key); fr.shapes.push({ type: 'arrow', pts: [P(sx, sy), P(x, y)], color: '#ffeb3b', width: 4 }); pend[key] = [x, y]; },
    dribble: (key, x, y) => { const [sx, sy] = k.at(key); fr.shapes.push({ type: 'wavy', pts: [P(sx, sy), P(x, y)], color: '#ffeb3b', width: 4 }); pend[key] = [x, y]; pend.ball = [x + 0.005, y + 0.008]; },
    pass: (from, to, high = false) => { const [sx, sy] = pend[from] || k.at(from); const [tx2, ty2] = pend[to] || k.at(to); fr.shapes.push(high ? { type: 'curve', pts: [P(sx, sy), P((sx + tx2) / 2, Math.min(sy, ty2) - 0.08), P(tx2, ty2)], color: '#ffffff', width: 3 } : { type: 'arrow', pts: [P(sx, sy), P(tx2, ty2)], color: '#ffffff', width: 3, dashed: true }); pend.ball = [tx2 + 0.005, ty2 + 0.008]; },
    passTo: (from, x, y) => { const [sx, sy] = pend[from] || k.at(from); fr.shapes.push({ type: 'arrow', pts: [P(sx, sy), P(x, y)], color: '#ffffff', width: 3, dashed: true }); pend.ball = [x, y]; },
    shot: (from, x = 0.985, y = 0.5) => { const [sx, sy] = pend[from] || k.at(from); fr.shapes.push({ type: 'arrow', pts: [P(sx, sy), P(x, y)], color: '#ff5252', width: 5 }); pend.ball = [x, y]; },
    cross: (from, x, y) => { const [sx, sy] = pend[from] || k.at(from); fr.shapes.push({ type: 'curve', pts: [P(sx, sy), P((sx + x) / 2 + 0.01, (sy + y) / 2), P(x, y)], color: '#ffffff', width: 3 }); pend.ball = [x, y]; },
    zoneRect: (x1, y1, x2, y2, color = '#00aeef') => fr.shapes.push({ type: 'rect', pts: [P(x1, y1), P(x2, y2)], color, width: 2, fill: true, st: 1 }),
    line: (x1, y1, x2, y2, color = '#ffffff') => fr.shapes.push({ type: 'line', pts: [P(x1, y1), P(x2, y2)], color, width: 2, dashed: true, st: 1 }),
  };
  let pend = {};
  const step0 = k.step; k.step = () => { step0(); for (const [key, v] of Object.entries(pend)) k.move(key, ...v); pend = {}; };
  tpl.build(k);
  if (Object.keys(pend).length) k.step();
  // zonas, líneas y textos fijos del paso 1 se mantienen visibles en todos los pasos
  const stat = b.frames[0].shapes.filter(x => x.st); b.frames.slice(1).forEach(f => { f.shapes = [...stat.map(x => JSON.parse(JSON.stringify(x))), ...f.shapes]; });
  if (b.frames.length > 1 && !b.frames[b.frames.length - 1].shapes.length && b.frames.length > 2) { /* último paso sólo posiciones */ }
  return b;
}

    const perm = await backupPermission(h, ask);
    if (perm !== 'granted') { BK.state = 'paused'; updateBackupBanner(); return false; }
    const day = new Date().toISOString().slice(0, 10);
    const fh = await h.getFileHandle(`ATFAMatch-copia-${day}.json`, { create: true });
    const w = await fh.createWritable(); await w.write(backupPayload()); await w.close();
    // conservar las últimas 14 copias
    const names = []; for await (const [n, e] of h.entries()) if (e.kind === 'file' && /^ATFAMatch-copia-\d{4}-\d{2}-\d{2}\.json$/.test(n)) names.push(n);
    names.sort(); for (const n of names.slice(0, Math.max(0, names.length - 14))) { try { await h.removeEntry(n); } catch (e) { } }
    SETTINGS.backupAt = Date.now(); SETTINGS.backupDir = h.name; await DB.put('kv', 'settings', SETTINGS);
    BK.state = 'ok'; updateBackupBanner(); if (!quiet) toast('✔ Copia guardada en la carpeta "' + h.name + '"');
    return true;
  } catch (e) { BK.state = 'error'; updateBackupBanner(); if (!quiet) toast('No se pudo guardar la copia: ' + e.message, 'bad'); return false; }

}

}
async function initBackup() {
  const orig = DB.put.bind(DB);

function drawLineups() {

/* ============ Plantel y convocatoria ============
   El PLANTEL (pestaña Equipos) guarda a todos los jugadores del club con su nombre, posición y foto.
   En cada partido se arma la CONVOCATORIA: quiénes juegan, con qué número (puede cambiar de un partido a otro)
   y quiénes son titulares. Los nombres siempre salen del plantel: si se corrige un nombre, se corrige en todos los partidos. */
async function mergeIntoSquad(t) {
  const tpl = APP.teams.find(x => x.id === t.templateId); if (!tpl) return;
  let ch = false;
  for (const pl of t.players) {
    const q = tpl.players.find(x => x.id === pl.id || x.id === pl.squadId);
    if (!q && /^jugador\s*\d*$/i.test(pl.name || '')) continue;
    if (!q) { tpl.players.push({ id: pl.id, number: pl.number ?? null, name: pl.name, position: pl.position || '', photo: pl.photo || null, active: true }); ch = true; }
    else { for (const k of ['name', 'position', 'photo']) if (pl[k] && pl[k] !== q[k]) { q[k] = pl[k]; ch = true; } if (q.number == null && pl.number != null) { q.number = pl.number; ch = true; } }
  }
  if (t.name === tpl.name) for (const k of ['color', 'color2', 'shield', 'formation']) if (t[k] && t[k] !== tpl[k]) { tpl[k] = t[k]; ch = true; }
  if (ch) await saveTeam(tpl);
}
async function convocatoriaDialog(side, opts = {}) {

  for (const cur of t.players) if (!rows.some(r => r.id === cur.id)) rows.push({ id: cur.id, name: cur.name, position: cur.position || '', photo: cur.photo || null, number: cur.number, on: true, starter: cur.active !== false });
  const need = lineupSize(t.formation);
  const body = document.createElement('div');
  const draw = () => {
    const on = rows.filter(r => r.on), st = on.filter(r => r.starter);
    const dup = on.filter(r => r.number != null && on.some(o => o !== r && o.number === r.number)).map(r => r.number);
    body.innerHTML = `<p class="tiny">${tpl ? `Plantel de <b>${esc(tpl.name)}</b>: ${tpl.players.length} jugadores.` : 'Este equipo no tiene plantel guardado: los jugadores que agregues quedan solo en este partido.'} Tildá quiénes juegan, poné el <b>número de camiseta de este partido</b> y marcá los <b>titulares</b> (${need} según la táctica ${esc(t.formation)}).</p>
      <div class="row" style="margin-bottom:6px"><b class="grow">Convocados: ${on.length} · Titulares: <span style="color:${st.length === need ? 'var(--acc,#2fb36d)' : '#f59e0b'}">${st.length}/${need}</span></b><button class="small" id="cvAll">Todos</button><button class="small" id="cvNone">Ninguno</button><button class="small" id="cvNum">Números habituales</button><button class="small primary" id="cvPaste">📋 Pegar lista…</button></div>
      ${dup.length ? `<p class="tiny" style="color:#f59e0b">⚠ Número repetido: ${[...new Set(dup)].join(', ')}</p>` : ''}
      <div style="max-height:52vh;overflow:auto"><table class="grid"><thead><tr><th>Juega</th><th>N°</th><th>Nombre</th><th>Posición</th><th>Titular</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr style="${r.on ? '' : 'opacity:.5'}"><td><input type="checkbox" data-on="${i}" ${r.on ? 'checked' : ''}></td><td><input type="number" data-num="${i}" value="${r.number ?? ''}" style="width:60px" ${r.on ? '' : 'disabled'}></td>

    $$('[data-nm]', body).forEach(c => { c.oninput = () => { rows[+c.dataset.nm].name = c.value; }; c.onkeydown = e => e.stopPropagation(); });
    $$('[data-pos]', body).forEach(c => { c.oninput = () => { rows[+c.dataset.pos].position = c.value.toUpperCase(); }; c.onkeydown = e => e.stopPropagation(); });

    $('#cvNum', body).onclick = () => { rows.forEach(r => { const q = tpl && tpl.players.find(x => x.id === r.id); if (q && q.number != null) r.number = q.number; }); draw(); };
    const add = () => { const n = $('#cvNew', body).value.trim(); if (!n) return; rows.push({ id: uid(), name: n, position: $('#cvPos', body).value.trim().toUpperCase(), photo: null, number: null, on: true, starter: false, isNew: true }); draw(); setTimeout(() => $('#cvNew', body).focus(), 0); };
    $('#cvAdd', body).onclick = add; $('#cvNew', body).onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') add(); };

  const isPlaceholder = r => /^jugador\s*\d*$/i.test((r.name || '').trim());
  async function pasteList() {
    const txt = await modal({ title: 'Pegar lista de jugadores · ' + t.name, narrow: true, body: `<p class="tiny">Una línea por jugador. Puede ser solo el nombre, o <code>número nombre</code>, o <code>número nombre posición</code>.<br>Ej.: <code>Juan Pérez</code> · <code>10 Lionel Messi DEL</code><br>Los nombres van reemplazando a los “Jugador 1, Jugador 2…” de ejemplo; si hay más, se agregan. Todos quedan convocados y guardados en el plantel.</p><textarea id="pl" rows="14" style="width:100%" placeholder="Juan Pérez&#10;Mateo Gómez&#10;10 Lucas Díaz MED"></textarea>`,
      onOpen: m => setTimeout(() => $('#pl', m).focus(), 30), buttons: [{ label: 'Cancelar' }, { label: 'Usar la lista', cls: 'primary', onClick: m => $('#pl', m).value }] });
    if (!txt) return;
    const free = rows.filter(isPlaceholder); let added = 0;
    for (const l of txt.split(/\r?\n/).map(x => x.trim()).filter(Boolean)) {
      const m = l.match(/^(\d+)[\s.,;:-]+(.+?)(?:[\s,;]+(ARQ|POR|GK|DEF|DF|LAT|CEN|MED|MC|VOL|EXT|DEL|FW|DC))?$/i) || l.match(/^(.+?)(?:[\s,;]+(ARQ|POR|GK|DEF|DF|LAT|CEN|MED|MC|VOL|EXT|DEL|FW|DC))$/i);
      let num = null, name = l, pos = '';
      if (m && /^\d+$/.test(m[1])) { num = +m[1]; name = m[2]; pos = (m[3] || '').toUpperCase(); } else if (m) { name = m[1]; pos = (m[2] || '').toUpperCase(); }
      const r = free.shift();
      if (r) { r.name = name; if (pos) r.position = pos; if (num != null) r.number = num; r.on = true; r.renamed = true; }
      else { rows.push({ id: uid(), name, position: pos, photo: null, number: num, on: true, starter: false, isNew: true }); }
      added++;
    }
    // los "Jugador N" que sobraron quedan fuera de la convocatoria
    for (const r of free) { r.on = false; r.starter = false; }
    const need2 = lineupSize(t.formation); if (!rows.some(r => r.on && r.starter)) rows.filter(r => r.on).slice(0, need2).forEach(r => r.starter = true);
    toast(`✔ ${added} jugador(es) cargados`); draw();
  }
  draw();
  if (opts.paste) setTimeout(pasteList, 50);
  const ok = await modal({ title: `📋 Convocatoria · ${t.name}`, wide: true, help: 'equipos', body, buttons: [{ label: 'Cancelar', value: false }, { label: 'Listo', cls: 'primary', value: true }] });
  if (!ok) return;
  const on = rows.filter(r => r.on);
  const prev = new Map(t.players.map(x => [x.id, x]));
  t.players = [...on.filter(r => r.starter), ...on.filter(r => !r.starter)].map(r => ({ ...(prev.get(r.id) || {}), id: r.id, name: r.name, position: r.position, photo: r.photo, number: r.number, active: r.starter }));

    let ch = false;
    for (const r of rows) {
      const q = tpl.players.find(x => x.id === r.id);
      if (!q && r.isNew) { tpl.players.push({ id: r.id, number: r.number, name: r.name, position: r.position, photo: null, active: true }); ch = true; }
      else if (q && (q.name !== r.name || (q.position || '') !== r.position)) { q.name = r.name; q.position = r.position; ch = true; }
    }
    // si se cargaron nombres reales, los "Jugador N" de ejemplo que no juegan se quitan del plantel
    if (rows.some(r => r.renamed)) { const drop = new Set(rows.filter(r => !r.on && isPlaceholder(r)).map(r => r.id)); if (drop.size) { tpl.players = tpl.players.filter(x => !drop.has(x.id)); ch = true; } }
    if (ch) { await saveTeam(tpl); await syncSquadToProjects(tpl); }
  }
  drawLineups(); renderProps();
}
/** Nombres, fotos y posiciones siempre al día con el plantel (en todos los partidos) */
function syncSquadNames(p) {
  let ch = false;
  for (const side of ['home', 'away']) {
    const t = p[side]; const tpl = t && APP.teams.find(x => x.id === t.templateId); if (!tpl) continue;
    const norm = x => String(x || '').trim().toLowerCase();
    for (const pl of t.players) {
      let q = tpl.players.find(x => x.id === pl.id || x.id === pl.squadId);
      // jugadores cargados antes de existir el plantel: se enlazan por nombre o, si tenían nombre de ejemplo, por número
      if (!q) q = tpl.players.find(x => norm(x.name) && norm(x.name) === norm(pl.name)) || (/^jugador\s*\d*$/i.test(pl.name || '') && pl.number != null ? tpl.players.find(x => x.number === pl.number) : null);
      if (!q) continue; if (q.id !== pl.id && pl.squadId !== q.id) { pl.squadId = q.id; ch = true; }
      for (const k of ['name', 'position', 'photo']) if (q[k] && q[k] !== pl[k]) { pl[k] = q[k]; ch = true; }
    }
  }
  return ch;
}
async function syncSquadToProjects(tpl) {
  for (const p of APP.projects || []) { if (![p.home, p.away].some(t => t && t.templateId === tpl.id)) continue; if (syncSquadNames(p)) { p.updated = Date.now(); await DB.put('projects', p.id, p); } }
  if (ST.p && syncSquadNames(ST.p)) { markDirty(); renderSide(); }
}
